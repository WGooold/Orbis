org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Keep the compatible Gradle daemon reusable during a build batch, but do not retain it for hours.
org.gradle.daemon.idletimeout=600000
# Kotlin compilation uses a separate JVM; let its idle daemon exit after ten minutes too.
systemProp.kotlin.daemon.options=autoshutdownIdleSeconds=600
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Keep paired app data: AGP's device-test cleanup otherwise uninstalls the target app.
android.injected.androidTest.leaveApksInstalledAfterRun=true
