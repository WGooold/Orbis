function endGesture(e,cancel=false){clearTimeout(longTimer);const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;if(!g.locked)return;suppressUntil=performance.now()+350;g.target.classList.remove('dragging');if(app.hasPointerCapture(g.id))app.releasePointerCapture(g.id);const v=g.dx/Math.max(1,performance.now()-g.start);if(g.mode.startsWith('drawer')){g.target.style.transform='';$('#drawer-shade').style.removeProperty('opacity');$('#drawer-shade').style.removeProperty('visibility');if(!cancel)drawer(g.mode==='drawer-open'?(g.progress>.32||v>.55):!(g.progress<.7||v<-.55))}else{const dist=g.mode==='sheet'?g.dy:g.mode==='runtime'?-g.dx:g.dx,limit=g.mode==='sheet'?90:g.mode==='runtime'?g.target.offsetWidth*.5:app.clientWidth*.32;g.target.style.transform='';if(!cancel&&dist>limit){if(g.mode==='sheet')closeSheet();else if(g.mode==='page')pop();else{const row=hs().find(s=>s.id===g.sid);closable(row)?closeSessions([g.sid]):toast(row.background?'等待后台任务结束后可关闭':'任务结束后可关闭')}}}}
app.addEventListener('pointerup',e=>endGesture(e));app.addEventListener('pointercancel',e=>endGesture(e,true));app.addEventListener('contextmenu',e=>{if(e.target.closest('[data-catalog],[data-runtime],[data-message]'))e.preventDefault()});
window.addEventListener('blur',()=>{stopWheel();clearTimeout(longTimer);if(gesture)endGesture({pointerId:gesture.id},true)});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopWheel();clearTimeout(longTimer);if(gesture)endGesture({pointerId:gesture.id},true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();back();return}if(e.key!=='Tab')return;const root=state.sheet?$('#sheet'):topPage()?$('#'+topPage().id):state.drawer?$('#drawer'):null;if(!root)return;const c=[...root.querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(el=>!el.disabled&&!el.closest('[hidden],[inert]')&&el.getClientRects().length),first=c[0],last=c.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}});
function resizeViewport(){if(matchMedia('(max-width:600px)').matches&&window.visualViewport)app.style.height=visualViewport.height+'px';else app.style.removeProperty('height')}
window.visualViewport?.addEventListener('resize',resizeViewport);window.addEventListener('resize',resizeViewport);try{const t=localStorage.getItem('orbis-soft-pop-theme');if(['dark','light'].includes(t))state.theme=t}catch{}document.body.classList.toggle('light',state.theme==='light');renderHome();renderDirectory();syncLayers();resizeViewport();
