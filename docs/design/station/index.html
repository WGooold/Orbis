<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Orbis · Orbital Ring Station 3D</title>
<style>
:root{color-scheme:dark;--paper:#eff2f7;--mute:#8c96a6;--line:rgba(130,178,236,.24);--steel:#7db4f0;--amber:#f4b34e;--glass:rgba(13,16,22,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1016;color:var(--paper);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#1d222c 0,#11151d 52%,#090c11 100%)}
#stage{position:absolute;inset:0;width:100%;height:100%;outline:none}
.grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.91' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.2' d='M0 0h180v180H0z'/%3E%3C/svg%3E");mix-blend-mode:screen}
.hud{position:absolute;z-index:2;inset:0;pointer-events:none;padding:clamp(18px,3.5vw,46px);display:flex;flex-direction:column;justify-content:space-between}
.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.brand{display:flex;gap:14px;align-items:flex-start}
.sigil{position:relative;width:30px;height:30px;border:1px solid rgba(125,180,240,.54);border-radius:50%;flex:none;margin-top:2px;box-shadow:0 0 18px rgba(100,158,230,.24);display:grid;place-items:center}
.sigil svg{width:17px;height:17px;fill:none;stroke:var(--steel);stroke-width:1.6}
.eyebrow{margin:0 0 6px;color:#b2d0f2;font-size:9px;font-weight:550;letter-spacing:.24em}
.title{margin:0;color:#f4f7fb;font-size:clamp(14px,1.3vw,18px);font-weight:520;letter-spacing:.04em}
.subtitle{margin:7px 0 0;color:#8892a4;font-size:9px;letter-spacing:.13em}
.header-actions{display:flex;gap:8px;pointer-events:auto}
.button{height:35px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:2px;color:#d2dae6;background:rgba(14,18,26,.68);font:500 10px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.07em;cursor:pointer;transition:all .2s;backdrop-filter:blur(15px)}
.button:hover,.button:focus-visible,.button[aria-pressed="true"]{color:#fff;border-color:rgba(150,198,252,.68);background:rgba(52,96,154,.38);outline:none}
.button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.4}
.bottom{align-items:flex-end}
.note{margin:0 0 1px;color:#939dad;font-size:9px;letter-spacing:.14em}
.note .dot{color:var(--amber);padding:0 7px}
.meta{text-align:right;color:#8791a2;font:9px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em}
.meta strong{color:#d0e4fb;font-weight:500}
.meta .rule{display:inline-block;width:30px;height:1px;margin:0 8px;vertical-align:middle;background:linear-gradient(90deg,transparent,var(--steel))}
.view-dock{position:absolute;left:50%;bottom:clamp(48px,8vh,82px);z-index:3;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border:1px solid rgba(140,185,240,.22);background:rgba(11,14,20,.84);backdrop-filter:blur(18px);pointer-events:auto}
.view{min-width:64px;height:30px;padding:0 11px;border:1px solid transparent;border-radius:1px;background:transparent;color:#929cad;font:500 9px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.08em;cursor:pointer;transition:all .18s}
.view:hover{color:#f5f8fc}
.view[aria-pressed="true"]{border-color:rgba(145,194,250,.54);color:#dcecfc;background:rgba(76,130,206,.24)}
#loading{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#0d1016;color:#c2d2e8;font:9px ui-monospace,monospace;letter-spacing:.2em;transition:opacity .45s}
#loading.done{opacity:0;pointer-events:none}
.load-inner{text-align:center}
.loading-line{width:142px;height:1px;margin:13px auto 0;background:linear-gradient(90deg,transparent,var(--steel),transparent);animation:scan 1.5s ease-in-out infinite}
@keyframes scan{0%,100%{opacity:.24;transform:scaleX(.45)}50%{opacity:1;transform:scaleX(1)}}
#error{display:none;max-width:420px;padding:18px;border:1px solid rgba(145,194,250,.36);background:#121722;color:#dbe8f8;line-height:1.6;letter-spacing:.03em}
@media(max-width:660px){.hud{padding:18px}.sigil{width:25px;height:25px}.brand{gap:10px}.eyebrow{font-size:8px}.title{font-size:13px}.subtitle{font-size:8px}.button{height:32px;padding:0 9px;font-size:9px}.header-actions{gap:5px}.view-dock{bottom:68px;max-width:calc(100% - 28px);width:max-content}.view{min-width:0;padding:0 9px;font-size:8px}.bottom{gap:8px}.note,.meta{font-size:7px}.meta .rule{width:16px;margin:0 4px}}
@media(max-width:380px){.button span{display:none}.button{width:33px;justify-content:center;padding:0}.view{padding:0 7px}.subtitle{letter-spacing:.08em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Orbis 轨道环形空间站可交互三维模型"></canvas><div class="grain"></div>
<div id="loading"><div class="load-inner" id="loadLabel">载入轨道环形空间站几何与 PBR 贴图<div class="loading-line"></div></div><div id="error"></div></div>
<div class="hud">
 <header class="top">
  <div class="brand">
   <span class="sigil" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3.5v5.1M12 15.4v5.1M3.5 12h5.1M15.4 12h5.1"/></svg></span>
   <div>
    <p class="eyebrow">ORBIS DEEP SPACE <span style="opacity:.5">/</span> STATION 01</p>
    <h1 class="title">Orbis 轨道环形空间站</h1>
    <p class="subtitle">CERAMIC OUTER TORUS <span style="opacity:.4">·</span> BLUE-STEEL CORE HUB <span style="opacity:.4">·</span> 16 TENSION SPOKES</p>
   </div>
  </div>
  <div class="header-actions">
   <button class="button" id="orbitToggle" type="button" aria-pressed="false" title="自动环绕"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-3L4 10"/><path d="M4 5v5h5M4 13a8 8 0 0 0 14.7 3L20 14"/><path d="M20 19v-5h-5"/></svg><span>自动环绕</span></button>
   <button class="button" id="resetView" type="button" title="重置视角"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.1"/></svg><span>重置</span></button>
  </div>
 </header>
 <footer class="bottom">
  <p class="note">拖动旋转 <span class="dot">·</span> 滚轮缩放 <span class="dot">·</span> 选择视图</p>
  <div class="meta">
   <div><strong>ORBIS RING STATION</strong><span class="rule"></span><span id="partCount">202 GROUPS</span></div>
   <div>AEROSPACE CERAMIC <span style="color:#f4b34e">·</span> AMBER BAYS <span style="color:#7db4f0">·</span> RADIAL SPOKES</div>
  </div>
 </footer>
</div>
<nav class="view-dock" aria-label="模型视角">
 <button class="view" data-view="hero" aria-pressed="true">透视</button>
 <button class="view" data-view="front" aria-pressed="false">正面</button>
 <button class="view" data-view="rear" aria-pressed="false">背面</button>
 <button class="view" data-view="edge" aria-pressed="false">侧面</button>
 <button class="view" data-view="rear34" aria-pressed="false">后斜视</button>
 <button class="view" data-view="top" aria-pressed="false">俯视</button>
</nav>
<script type="module">
import * as THREE from './three-runtime.js';
import {OrbitControls,GLTFLoader,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,RoomEnvironment} from './three-runtime.js';

const canvas=document.querySelector('#stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#14181f');
scene.fog=new THREE.FogExp2('#14181f',.0014);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.15,300);
camera.position.set(-22,12,32);
const target=new THREE.Vector3(0,0,0);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),.04).texture;
pmrem.dispose();

// Blender Z-up (X, Y, Z) -> glTF Y-up (X, Z, -Y): Front (-Y in Blender) is +Z in Three.js!
const key=new THREE.DirectionalLight(0xfffdf9,2.15);key.position.set(18,22,28);scene.add(key);
const rearKey=new THREE.DirectionalLight(0xf0f5ff,1.35);rearKey.position.set(-16,18,-30);scene.add(rearKey);
const rim=new THREE.DirectionalLight(0xdfeaff,1.15);rim.position.set(30,12,8);scene.add(rim);
const fill=new THREE.HemisphereLight(0xe4ecf8,0x141922,.72);scene.add(fill);
const hubBlueFront=new THREE.PointLight(0x6da6f2,10,24,2);hubBlueFront.position.set(0,0,4.5);scene.add(hubBlueFront);
const hubBlueRear=new THREE.PointLight(0x6da6f2,10,24,2);hubBlueRear.position.set(0,0,-4.5);scene.add(hubBlueRear);
const amberGlow=new THREE.PointLight(0xffa438,8,28,2);amberGlow.position.set(-5,-6,5);scene.add(amberGlow);

const composer=new EffectComposer(renderer);
const renderPass=new RenderPass(scene,camera);
composer.addPass(renderPass);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.16,.45,.86));
composer.addPass(new OutputPass());

const stars=new Float32Array(1200*3);
let seed=202611;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(let i=0;i<1200;i++){const r=60+rnd()*130,t=rnd()*Math.PI*2,p=Math.acos(rnd()*2-1);stars[i*3]=r*Math.sin(p)*Math.cos(t);stars[i*3+1]=r*Math.cos(p);stars[i*3+2]=r*Math.sin(p)*Math.sin(t)}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.BufferAttribute(stars,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xdde6f4,size:.13,sizeAttenuation:true,transparent:true,opacity:.55,depthWrite:false,fog:false})));

let station=null,controls=null,selected='hero',autoRotate=false,cameraTween=null;
const viewButtons=[...document.querySelectorAll('.view')];
// Blender (X, Y, Z) -> glTF (X, Z, -Y)
const cameraState={
 hero:{type:'perspective',position:new THREE.Vector3(-23.5,13.5,32.5),aim:new THREE.Vector3(.5,.6,0),up:new THREE.Vector3(0,1,0)},
 front:{type:'ortho',position:new THREE.Vector3(.4,.4,44),aim:new THREE.Vector3(.4,.4,0),up:new THREE.Vector3(0,1,0),width:28.5,height:27.5},
 rear:{type:'ortho',position:new THREE.Vector3(.4,.4,-44),aim:new THREE.Vector3(.4,.4,0),up:new THREE.Vector3(0,1,0),width:28.5,height:27.5},
 edge:{type:'ortho',position:new THREE.Vector3(44*Math.cos(.17),44*Math.sin(.17),0),aim:new THREE.Vector3(0,.3,0),up:new THREE.Vector3(0,1,0),width:16,height:26.5},
 rear34:{type:'perspective',position:new THREE.Vector3(25.5,-9,-34),aim:new THREE.Vector3(.5,.9,0),up:new THREE.Vector3(0,1,0)},
 top:{type:'ortho',position:new THREE.Vector3(0,44,0),aim:new THREE.Vector3(0,0,0),up:new THREE.Vector3(0,0,-1),width:28.5,height:16}
};

function fittedCamera(which){
 const v=cameraState[which],aspect=innerWidth/innerHeight;
 if(v.type==='perspective'){const c=new THREE.PerspectiveCamera(42,aspect,.15,300);c.up.copy(v.up);c.position.copy(v.position);c.lookAt(v.aim);return c}
 const halfH=Math.max(v.height/2,v.width/aspect/2)*1.12;
 const c=new THREE.OrthographicCamera(-halfH*aspect,halfH*aspect,halfH,-halfH,.1,300);
 c.up.copy(v.up);c.position.copy(v.position);c.lookAt(v.aim);return c;
}

function setCamera(which,{immediate=false}={}){
 selected=which;
 const oldControls=controls;
 const oldCamera=oldControls?.object||activeCamera;
 const fromPosition=oldCamera.position.clone();
 const fromTarget=oldControls?.target.clone()||target.clone();
 if(oldControls){autoRotate=oldControls.autoRotate;oldControls.dispose()}
 const next=fittedCamera(which);
 next.position.copy(fromPosition);next.lookAt(fromTarget);
 controls=new OrbitControls(next,canvas);
 controls.target.copy(fromTarget);
 controls.enableDamping=true;controls.dampingFactor=.07;
 controls.minDistance=12;controls.maxDistance=95;
 controls.minZoom=.45;controls.maxZoom=3.5;
 controls.autoRotate=false;controls.autoRotateSpeed=.36;
 controls.update();
 activeCamera=next;
 cameraTween=immediate?null:{start:performance.now(),duration:520,fromPosition,toPosition:cameraState[which].position.clone(),fromTarget,toTarget:cameraState[which].aim.clone()};
 if(immediate){next.position.copy(cameraState[which].position);controls.target.copy(cameraState[which].aim);controls.autoRotate=autoRotate;controls.update()}
 viewButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===which)));
}

let activeCamera=camera;
viewButtons.forEach(b=>b.addEventListener('click',()=>setCamera(b.dataset.view)));
const orbitButton=document.querySelector('#orbitToggle');
orbitButton.addEventListener('click',()=>{autoRotate=!autoRotate;if(controls)controls.autoRotate=autoRotate;orbitButton.setAttribute('aria-pressed',String(autoRotate))});
document.querySelector('#resetView').addEventListener('click',()=>{autoRotate=false;orbitButton.setAttribute('aria-pressed','false');setCamera('hero')});

const loader=new GLTFLoader();
loader.load('./orbital_station.glb',gltf=>{
 station=gltf.scene;
 let meshCount=0;
 station.traverse(o=>{if(o.isMesh)meshCount++});
 document.querySelector('#partCount').textContent=`${meshCount} PARTS`;
 scene.add(station);
 station.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(station);
 const center=bounds.getCenter(new THREE.Vector3());
 target.copy(center);
 for(const v of Object.values(cameraState)){v.aim.add(center);v.position.add(center)}
 document.querySelector('#loading').classList.add('done');
 setCamera('hero',{immediate:true});
},undefined,error=>{
 console.error(error);
 const box=document.querySelector('#error');
 document.querySelector('#loadLabel').style.display='none';
 box.style.display='block';
 box.textContent='模型载入失败。请用本地 HTTP 服务打开本页，并确认 orbital_station.glb 与 three-runtime.js 位于同一目录。';
});

const resize=()=>{
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
 renderer.setSize(innerWidth,innerHeight);
 composer.setSize(innerWidth,innerHeight);
 cameraTween=null;
 if(controls){
  const zoom=controls.object.zoom||1,position=controls.object.position.clone(),aim=controls.target.clone();
  const next=fittedCamera(selected);next.position.copy(position);next.lookAt(aim);next.zoom=zoom;next.updateProjectionMatrix();
  controls.dispose();controls=new OrbitControls(next,canvas);controls.target.copy(aim);
  controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=12;controls.maxDistance=95;controls.minZoom=.45;controls.maxZoom=3.5;
  controls.autoRotate=autoRotate;controls.autoRotateSpeed=.36;activeCamera=next;
 }else activeCamera.aspect=innerWidth/innerHeight;
 activeCamera.updateProjectionMatrix();
};
addEventListener('resize',resize,{passive:true});
const prefersReduced=matchMedia('(prefers-reduced-motion: reduce)');
if(prefersReduced.matches){autoRotate=false;orbitButton.setAttribute('aria-pressed','false')}

function render(){
 requestAnimationFrame(render);
 if(controls){
  if(cameraTween){
   const p=Math.min(1,(performance.now()-cameraTween.start)/cameraTween.duration);
   const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
   controls.object.position.lerpVectors(cameraTween.fromPosition,cameraTween.toPosition,e);
   controls.target.lerpVectors(cameraTween.fromTarget,cameraTween.toTarget,e);
   if(p===1){cameraTween=null;controls.autoRotate=autoRotate}
  }
  controls.update();
 }
 renderPass.camera=activeCamera;
 composer.render();
}
render();
</script>
</body>
</html>
