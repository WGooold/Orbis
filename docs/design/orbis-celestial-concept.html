          ${DOCK_CARTOON_SVGS[p.id] || ''}
          <span class="dock-badge ${badgeClass}">${badgeText}</span>
        </div>
        <span class="dock-name">${p.shortName}</span>
      `;
      btn.addEventListener('click', () => openPlanet(p.id));
      el.planetDock.appendChild(btn);
    }
  }

  function renderApprovalBanner() {
    const found = findFirstApproval();
    if (!found) { el.approvalBanner.classList.add('dismissed'); return; }
    el.approvalBanner.classList.remove('dismissed');
    el.approvalTitle.textContent = `${found.planet.name} ${found.session.title}`;
    el.approvalCmd.textContent = found.session.approvalCmd || '确认执行命令';
  }

  function renderPlanetSheet() {
    const p = currentPlanet();
    if (!p) return;
    el.planetMarkBox.innerHTML = AGENT_SVGS[p.id] || '';
    el.planetSheetTitle.textContent = p.name;
    el.planetSheetModel.textContent = p.model;
    const runningCount = p.sessions.filter(s => s.status === 'running').length;
    el.planetSheetStats.textContent = `${p.sessions.length} 颗卫星会话   ${runningCount > 0 ? `${runningCount} 运行中` : '全部待命'}`;

    const dirs = currentHost().dirs;
    if (!state.selectedDraftDir || !dirs.includes(state.selectedDraftDir)) state.selectedDraftDir = dirs[0];
    el.draftDirs.innerHTML = dirs.map(d =>
      `<button class="dir-chip ${d === state.selectedDraftDir ? 'active' : ''}" data-dir="${escapeHtml(d)}">${escapeHtml(d)}</button>`
    ).join('');
    el.draftDirs.querySelectorAll('.dir-chip').forEach(btn => {
      btn.addEventListener('click', () => { state.selectedDraftDir = btn.dataset.dir; renderPlanetSheet(); });
    });

    el.sessionList.innerHTML = '';
    for (const s of p.sessions) {
      const row = document.createElement('button');
      row.className = `session-row ${s.status === 'approval' ? 'approval' : ''}`;
      const statusLabel = s.status === 'running' ? '执行中' : s.status === 'approval' ? '待确认' : s.status === 'unread' ? '已完成' : '空闲';

      row.innerHTML = `
        <div class="session-row-top">
          <span class="session-row-title">${escapeHtml(s.title)}</span>
          <span class="session-row-state">
            <span class="orb-status ${s.status}" style="--status-color:${p.color}"><span class="core"></span><span class="arc"></span></span>
            <span>${statusLabel}</span>
          </span>
        </div>
        <div class="session-row-path">${escapeHtml(s.dir)}</div>
        <div class="session-row-foot">
          <span class="session-row-preview">${escapeHtml(s.preview)}</span>
          <span class="session-rate">${escapeHtml(s.rate)}</span>
        </div>
      `;
      row.addEventListener('pointerenter', () => { state.highlightedSessionId = s.id; });
      row.addEventListener('pointerleave', () => { if (state.highlightedSessionId === s.id) state.highlightedSessionId = null; });
      row.addEventListener('click', () => openSession(p.id, s.id));
      el.sessionList.appendChild(row);
    }
  }

  function renderSessionChat() {
    const p = currentPlanet();
    const s = currentSession();
    if (!p || !s) return;

    el.chatTitle.textContent = s.title;
    el.chatAgentLabel.textContent = `${p.name} ${p.model}`;
    el.chatDirLabel.textContent = s.dir;
    el.openDiffBtn.textContent = s.diffStat || '+0 -0';

    el.chatMessages.innerHTML = '';
    for (const msg of s.messages) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${msg.role}`;

      if (msg.tool) {
        const chip = document.createElement('button');
        chip.className = 'tool-chip';
        chip.innerHTML = `<span>◈ ${escapeHtml(msg.tool)}</span>${msg.diff ? `<span class="tool-diff-stat">${escapeHtml(msg.diff)}</span>` : ''}`;
        chip.addEventListener('click', openDiffModal);
        wrap.appendChild(chip);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatInlineCode(msg.text) + (msg.streaming ? '<span class="stream-caret"></span>' : '');
      wrap.appendChild(bubble);

      if (msg.approval && s.status === 'approval') {
        const card = document.createElement('div');
        card.className = 'approval-card';
        card.style.marginTop = '4px';
        card.innerHTML = `
          <div class="approval-cmd">${escapeHtml(s.approvalCmd || '')}</div>
          <div class="approval-actions">
            <button class="btn-tactile deny" data-act="deny">拒绝</button>
            <button class="btn-tactile allow" data-act="allow">允许执行</button>
          </div>
        `;
        card.querySelector('[data-act="allow"]').addEventListener('click', () => resolveApproval(p, s, true));
        card.querySelector('[data-act="deny"]').addEventListener('click', () => resolveApproval(p, s, false));
        wrap.appendChild(card);
      }

      el.chatMessages.appendChild(wrap);
    }
    el.chatMessages.scrollTop = el.chatMessages.scrollHeight;
  }

  function syncViewUI() {
    const host = currentHost();
    document.body.classList.toggle('host-linux', host.starType === 'blue');
    el.hostNameText.textContent = host.name;
    el.hostLatencyText.textContent = host.latency;

    if (state.view === 'overview') {
      el.backBtn.style.display = 'none';
      el.hostSwitcherBtn.style.display = 'inline-flex';
      el.overviewBottom.classList.remove('hidden');
      el.planetSheet.classList.remove('open');
      el.sessionSheet.classList.remove('open');
      state.draftOpen = false;
      el.draftPanel.classList.remove('open');
      renderDock();
      renderApprovalBanner();
    } else if (state.view === 'planet') {
      el.backBtn.style.display = 'inline-flex';
      el.backBtnLabel.textContent = '星系';
      el.hostSwitcherBtn.style.display = 'none';
      el.overviewBottom.classList.add('hidden');
      el.planetSheet.classList.add('open');
      el.sessionSheet.classList.remove('open');
      renderPlanetSheet();
    } else if (state.view === 'session') {
      const p = currentPlanet();
      el.backBtn.style.display = 'inline-flex';
      el.backBtnLabel.textContent = p ? p.shortName : '返回';
      el.hostSwitcherBtn.style.display = 'none';
      el.overviewBottom.classList.add('hidden');
      el.planetSheet.classList.remove('open');
      el.sessionSheet.classList.add('open');
      renderSessionChat();
    }
  }

  function goOverview() {
    state.view = 'overview';
    state.selectedPlanetId = null;
    state.selectedSessionId = null;
    state.highlightedSessionId = null;
    syncViewUI();
  }

  function openPlanet(planetId) {
    state.selectedPlanetId = planetId;
    state.selectedSessionId = null;
    state.highlightedSessionId = null;
    state.view = 'planet';
    const p = currentPlanet();
    if (p) {
      spawnDataPacket(p, 1, { speed: 0.9, size: 3.5, bright: true });
      spawnDataPacket(p, -1, { speed: 0.8, size: 3.2, bright: true });
    }
    syncViewUI();
  }

  function openSession(planetId, sessionId) {
    state.selectedPlanetId = planetId;
    state.selectedSessionId = sessionId;
    state.view = 'session';
    const p = currentPlanet();
    const s = currentSession();
    if (s && s.status === 'unread') { s.status = 'idle'; s.rate = '刚刚'; }
    if (p) {
      spawnDataPacket(p, 1, { speed: 0.95, size: 3.3 });
      spawnDataPacket(p, -1, { speed: 0.88, size: 3.0 });
    }
    syncViewUI();
  }

  function resolveApproval(planet, session, approved) {
    firePhoneCommandWave(planet, session, approved ? '#fbbf24' : '#fb7185');
    if (approved) {
      session.status = 'running';
      session.rate = '76 tok/s';
      session.preview = '正在运行测试套件 (14/14)…';
      session.messages.push({ role: 'assistant', text: '已收到放行指令，正在本机执行 `reconnect.test.ts`…', streaming: true });
      showToast(`已放行 ${planet.name} 执行命令`);

      setTimeout(() => {
        const last = session.messages[session.messages.length - 1];
        if (last && last.streaming) {
          last.streaming = false;
          last.text = '14 项弱网切换与退避抖动测试全部通过，平均重连耗时降至 `214ms`。';
        }
        session.status = 'unread';
        session.rate = '新回复';
        session.preview = '14/14 全部通过，平均重连 214ms';
        spawnBurstTraffic(planet);
        syncViewUI();
      }, 2800);
    } else {
      session.status = 'idle';
      session.rate = '已拒绝';
      session.preview = '命令已取消，等待下一步指示';
      session.messages.push({ role: 'assistant', text: '已取消该命令执行，保留当前未提交改动。' });
      showToast('已拒绝执行请求');
    }
    syncViewUI();
  }

  function launchNewSessionMoon() {
    const p = currentPlanet();
    if (!p) return;
    const promptText = el.draftInput.value.trim();
    const dir = state.selectedDraftDir || currentHost().dirs[0];
    const newId = `${p.id}-${Date.now()}`;
    const title = promptText ? promptText.slice(0, 18) : `新任务 ${p.sessions.length + 1}`;
    const maxR = p.sessions.reduce((acc, s) => Math.max(acc, s.orbitR), 30);

    const newMoon = {
      id: newId,
      title,
      dir,
      status: promptText ? 'running' : 'idle',
      rate: promptText ? '58 tok/s' : '刚创建',
      preview: promptText ? '正在载入工作区上下文…' : '卫星已入轨，随时发送任务',
      orbitR: Math.min(62, maxR + 9),
      angle: Math.random() * Math.PI * 2,
      speed: 0.62,
      size: 5.2,
      diffFile: `${dir}/index.ts`,
      diffStat: '+0 -0',
      diffLines: [{ t: 'ctx', s: '// 暂无代码变更' }],
      messages: promptText
        ? [
            { role: 'user', text: promptText },
            { role: 'assistant', text: `已接入 \`${dir}\`，正在分析目录结构并准备执行计划…`, streaming: true }
          ]
        : [{ role: 'assistant', text: `卫星会话已接入本机 \`${dir}\`，直接发送需求即可开始远控。` }]
    };

    p.sessions.unshift(newMoon);
    el.draftInput.value = '';
    state.draftOpen = false;
    el.draftPanel.classList.remove('open');

    firePhoneCommandWave(p, newMoon, p.color);
    const pPos = planetWorldPos(p);
    spawnRipple(pPos.x, pPos.y, '#FFFFFF', 46);
    spawnRipple(pPos.x, pPos.y, p.color, 64);
    showToast(`新卫星会话已入轨 ${p.shortName}`);
    openSession(p.id, newId);
    if (promptText) simulateAssistantReply(p, newMoon, promptText, true);
  }

  function sendChatMessage(rawText) {
    const text = (rawText ?? el.chatInput.value).trim();
    const p = currentPlanet();
    const s = currentSession();
    if (!text || !p || !s) return;

    el.chatInput.value = '';
    s.messages.push({ role: 'user', text });
    s.status = 'running';
    s.rate = `${55 + Math.floor(Math.random() * 38)} tok/s`;
    s.preview = '正在处理指令…';

    firePhoneCommandWave(p, s, p.color);
    s.messages.push({ role: 'assistant', text: '', streaming: true });
    renderSessionChat();
    simulateAssistantReply(p, s, text, false);
  }

  function simulateAssistantReply(planet, session, prompt, replaceLast) {
    const cannedReplies = [
      `已通过电脑端 \`${planet.name}\` 扫描 \`${session.dir}\`：核心链路状态健康，已同步补充边界校验并生成差异快照，可点右上角查看逐行改动。`,
      `正在本机执行验证：3 组关键路径延迟均稳定在阈值以内，同时已清理多余临时句柄，当前无未释放订阅。`,
      `已汇总本轮改动：聚焦于状态同步与主线程零阻塞优化，关键变更共 2 个文件，随时可继续下发下一步指令。`
    ];
    const fullText = prompt.includes('单测')
      ? '本机测试套件执行完毕：18 / 18 通过（耗时 1.42s），覆盖重连退避、状态对账与异常回滚。'
      : prompt.includes('总结')
        ? '本轮共收口 3 处改动：降低弱网重连首跳延迟、为流式行增加精确判等、并将阴影刷子缓存化，帧率稳定满帧。'
        : cannedReplies[Math.floor(Math.random() * cannedReplies.length)];

    const targetMsg = session.messages[session.messages.length - 1];
    let idx = 0;
    if (replaceLast) targetMsg.text = '';

    const streamTimer = setInterval(() => {
      idx += 3 + Math.floor(Math.random() * 4);
      targetMsg.text = fullText.slice(0, idx);
      spawnDataPacket(planet, -1, { speed: 0.78 + Math.random() * 0.25, size: 3.1 });
      spawnMoonSpark(planet.id, session.id, -1, planet.palette[0]);
      if (state.view === 'session' && state.selectedSessionId === session.id) renderSessionChat();
      if (idx >= fullText.length) {
        clearInterval(streamTimer);
        targetMsg.streaming = false;
        session.status = 'idle';
        session.rate = '刚刚';
        session.preview = fullText.slice(0, 26) + '…';
        if (state.view === 'session' && state.selectedSessionId === session.id) renderSessionChat();
        else syncViewUI();
      }
    }, 115);
  }

  function switchHost(nextIdx) {
    if (nextIdx === state.hostIdx) { closeModals(); return; }
    closeModals();
    state.warpProgress = 1.0;
    state.packets.length = 0;
    state.moonSparks.length = 0;
    state.ripples.length = 0;
    state.hostIdx = nextIdx;
    state.view = 'overview';
    state.selectedPlanetId = null;
    state.selectedSessionId = null;
    state.starFlare = 1.4;
    buildNebulaCache();
    seedInitialPackets();
    syncViewUI();
    spawnBurstTraffic();
    showToast(`已跃迁至 ${currentHost().name}`);
  }

  /* =========================================================
     12. MODALS & EVENT BINDINGS
     ========================================================= */
  function closeModals() {
    el.hostModal.classList.remove('open');
    el.diffModal.classList.remove('open');
    el.infoModal.classList.remove('open');
  }

  function openHostModal() {
    el.hostList.innerHTML = HOSTS.map((h, idx) => `
      <button class="host-option ${idx === state.hostIdx ? 'active' : ''}" data-host-idx="${idx}">
        <div class="host-opt-left">
          <div class="host-star-preview" style="background:radial-gradient(circle,${h.coreColor} 0%,${h.midColor} 55%,${h.coronaColor} 100%);box-shadow:0 0 18px ${h.coronaColor}"></div>
          <div>
            <div class="host-opt-name">${escapeHtml(h.name)}</div>
            <div class="host-opt-sub">${escapeHtml(h.sub)}</div>
          </div>
        </div>
        <span class="latency-tag">${escapeHtml(h.latency)}</span>
      </button>
    `).join('');
    el.hostList.querySelectorAll('.host-option').forEach(btn => {
      btn.addEventListener('click', () => switchHost(Number(btn.dataset.hostIdx)));
    });
    el.hostModal.classList.add('open');
  }

  function openDiffModal() {
    const s = currentSession();
    if (!s) return;
    el.diffFileName.textContent = s.diffFile || 'diff';
    el.diffContent.innerHTML = (s.diffLines || []).map(l =>
      `<div class="diff-line ${l.t}">${escapeHtml(l.s)}</div>`
    ).join('');
    el.diffModal.classList.add('open');
  }

  el.backBtn.addEventListener('click', () => {
    if (state.view === 'session') openPlanet(state.selectedPlanetId);
    else goOverview();
  });

  el.hostSwitcherBtn.addEventListener('click', openHostModal);
  document.getElementById('infoBtn').addEventListener('click', () => el.infoModal.classList.add('open'));
  document.getElementById('fluxPulseBtn').addEventListener('click', () => {
    spawnBurstTraffic(currentPlanet());
    showToast('已同步最新远控遥测流');
  });

  el.approvalBannerHead.addEventListener('click', () => {
    const found = findFirstApproval();
    if (found) openSession(found.planet.id, found.session.id);
  });
  el.bannerAllowBtn.addEventListener('click', () => {
    const found = findFirstApproval();
    if (found) resolveApproval(found.planet, found.session, true);
  });
  el.bannerDenyBtn.addEventListener('click', () => {
    const found = findFirstApproval();
    if (found) resolveApproval(found.planet, found.session, false);
  });

  document.getElementById('prevPlanetBtn').addEventListener('click', () => {
    const list = currentHost().planets;
    const idx = list.findIndex(p => p.id === state.selectedPlanetId);
    openPlanet(list[(idx - 1 + list.length) % list.length].id);
  });
  document.getElementById('nextPlanetBtn').addEventListener('click', () => {
    const list = currentHost().planets;
    const idx = list.findIndex(p => p.id === state.selectedPlanetId);
    openPlanet(list[(idx + 1) % list.length].id);
  });

  document.getElementById('toggleDraftBtn').addEventListener('click', () => {
    state.draftOpen = !state.draftOpen;
    el.draftPanel.classList.toggle('open', state.draftOpen);
    if (state.draftOpen) el.draftInput.focus();
  });

  el.launchSessionBtn.addEventListener('click', launchNewSessionMoon);
  el.draftInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') launchNewSessionMoon(); });

  el.openDiffBtn.addEventListener('click', openDiffModal);
  el.chatSendBtn.addEventListener('click', () => sendChatMessage());
  el.chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });

  document.getElementById('quickChips').querySelectorAll('.quick-chip').forEach(btn => {
    btn.addEventListener('click', () => sendChatMessage(btn.dataset.prompt));
  });

  document.querySelectorAll('.modal-backdrop').forEach(modal => {
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModals(); });
  });
  document.querySelectorAll('[data-close-modal]').forEach(btn => btn.addEventListener('click', closeModals));

  const burstToggleBtn = document.getElementById('burstToggleBtn');
  burstToggleBtn.addEventListener('click', () => {
    state.burstMode = !state.burstMode;
    burstToggleBtn.classList.toggle('active', state.burstMode);
    if (state.burstMode) spawnBurstTraffic();
    showToast(state.burstMode ? '高负载数据洪流已开启' : '恢复常规遥测速率');
  });

  document.getElementById('switchStarStageBtn').addEventListener('click', () => {
    switchHost((state.hostIdx + 1) % HOSTS.length);
  });

  const fullBleedBtn = document.getElementById('fullBleedBtn');
  fullBleedBtn.addEventListener('click', () => {
    const active = document.body.classList.toggle('full-bleed');
    fullBleedBtn.classList.toggle('active', active);
    setTimeout(resizeCanvas, 480);
    resizeCanvas();
  });

  /* =========================================================
     13. TELEMETRY METRICS, DEEP-LINK HASH & UTILITIES
     ========================================================= */
  function updateLiveMetrics() {
    const running = currentHost().planets.reduce(
      (sum, p) => sum + p.sessions.filter(s => s.status === 'running').length, 0
    );
    const mult = state.burstMode ? 3.4 : 1.0;
    el.txRate.textContent = ((0.5 + running * 0.5 + Math.random() * 0.7) * mult).toFixed(1);
    el.rxRate.textContent = ((2.8 + running * 4.6 + Math.random() * 3.8) * mult).toFixed(1);

    const now = new Date();
    document.getElementById('clockText').textContent =
      `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  }

  function hexAlpha(hex, alpha) {
    if (!hex || !hex.startsWith('#')) return hex;
    let c = hex.slice(1);
    if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
    const num = parseInt(c, 16);
    return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function formatInlineCode(str) {
    return escapeHtml(str).replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function applyInitialHash() {
    const hash = location.hash.replace(/^#/, '');
    if (!hash) return;
    const params = new URLSearchParams(hash);
    if (params.get('host') === 'linux') {
      state.hostIdx = 1;
      buildNebulaCache();
    }
    const planetId = params.get('planet');
    const sessionId = params.get('session');
    if (planetId && currentHost().planets.some(p => p.id === planetId)) {
      state.selectedPlanetId = planetId;
      state.view = 'planet';
      if (sessionId) {
        const p = currentPlanet();
        if (p && p.sessions.some(s => s.id === sessionId)) {
          state.selectedSessionId = sessionId;
          state.view = 'session';
        }
      }
      const t = computeCameraTarget();
      state.cam.x = t.x;
      state.cam.y = t.y;
      state.cam.zoom = t.zoom;
    }
  }

  /* =========================================================
     14. BOOTSTRAP
     ========================================================= */
  document.body.classList.add('booting');
  initStars();
  resizeCanvas();
  applyInitialHash();
  if (state.view === 'overview') {
    const t = computeCameraTarget();
    state.cam.x = t.x;
    state.cam.y = t.y;
    state.cam.zoom = t.zoom;
  }
  seedInitialPackets();
  syncViewUI();
  updateLiveMetrics();
  void document.body.offsetHeight;
  requestAnimationFrame(() => document.body.classList.remove('booting'));
  setInterval(updateLiveMetrics, 950);
  window.addEventListener('resize', resizeCanvas);

  requestAnimationFrame(tick);
})();
</script>
