<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Orbis — Cartoon Celestial Concept</title>
<style>
  :root {
    --void-0: #060916;
    --void-1: #0c1228;
    --glass-bg: rgba(14, 20, 40, 0.78);
    --glass-border: rgba(255, 255, 255, 0.13);
    --glass-border-hi: rgba(255, 255, 255, 0.26);
    --ink-0: #f8faff;
    --ink-1: rgba(235, 241, 255, 0.84);
    --ink-2: rgba(188, 202, 236, 0.60);
    --ink-3: rgba(154, 171, 212, 0.38);
    --accent-gold: #ffd466;
    --accent-amber: #fbbf24;
    --accent-emerald: #34d399;
    --accent-danger: #fb7185;
    --accent-cyan: #38bdf8;
    --radius-lg: 22px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    overflow: hidden;
    background-color: #040610;
    background-image: radial-gradient(circle at 50% 34%, #151e3d 0%, #080d1d 54%, #03050c 100%);
    color: var(--ink-0);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(660px 540px at 50% 38%, rgba(255, 206, 102, 0.11), transparent 64%),
      radial-gradient(560px 480px at 24% 68%, rgba(91, 124, 255, 0.12), transparent 64%),
      radial-gradient(520px 440px at 78% 26%, rgba(56, 217, 181, 0.10), transparent 64%);
    pointer-events: none;
  }

  body.host-linux .stage::before {
    background:
      radial-gradient(660px 540px at 50% 38%, rgba(110, 204, 255, 0.14), transparent 64%),
      radial-gradient(560px 480px at 24% 68%, rgba(139, 92, 246, 0.12), transparent 64%),
      radial-gradient(520px 440px at 78% 26%, rgba(56, 217, 181, 0.10), transparent 64%);
  }

  .stage-controls {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 40;
    display: flex;
    gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(14, 20, 40, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  }

  .stage-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .stage-btn:hover { background: rgba(255, 255, 255, 0.09); color: var(--ink-0); }
  .stage-btn:active { transform: scale(0.95); }
  .stage-btn.active { background: rgba(255, 212, 102, 0.2); color: var(--accent-gold); }

  /* Titanium Smartphone Shell */
  .phone-shell {
    position: relative;
    width: 393px;
    height: min(852px, calc(100vh - 40px));
    max-height: 852px;
    border-radius: 54px;
    padding: 11px;
    background: linear-gradient(145deg, #474e66 0%, #202536 24%, #111522 52%, #2c3246 84%, #4f566e 100%);
    box-shadow:
      0 42px 104px rgba(0, 0, 0, 0.8),
      0 14px 36px rgba(0, 0, 0, 0.56),
      inset 0 0 0 1px rgba(255, 255, 255, 0.24),
      inset 0 0 0 2.5px rgba(9, 11, 19, 0.92);
    transition: width 0.45s var(--ease-out), height 0.45s var(--ease-out), border-radius 0.45s var(--ease-out), padding 0.45s var(--ease-out);
    flex-shrink: 0;
  }

  .phone-shell::before {
    content: "";
    position: absolute;
    left: -3px;
    top: 158px;
    width: 3px;
    height: 52px;
    border-radius: 2px 0 0 2px;
    background: linear-gradient(180deg, #525972, #242838);
    box-shadow: 0 68px 0 #2e3447, 0 -46px 0 -0.5px #3c4359;
    pointer-events: none;
  }

  .phone-shell::after {
    content: "";
    position: absolute;
    right: -3px;
    top: 196px;
    width: 3px;
    height: 76px;
    border-radius: 0 2px 2px 0;
    background: linear-gradient(180deg, #525972, #242838);
    pointer-events: none;
  }

  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: var(--void-0);
    isolation: isolate;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  body.full-bleed .stage { padding: 0; }
  body.full-bleed .phone-shell {
    width: 100vw;
    height: 100vh;
    max-height: none;
    border-radius: 0;
    padding: 0;
    background: transparent;
    box-shadow: none;
  }
  body.full-bleed .phone-shell::before,
  body.full-bleed .phone-shell::after,
  body.full-bleed .dynamic-island { display: none; }
  body.full-bleed .phone-screen { border-radius: 0; }

  @media (max-width: 520px) {
    .stage { padding: 0; }
    .phone-shell {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      border-radius: 0;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    .phone-shell::before,
    .phone-shell::after,
    .dynamic-island,
    .stage-controls { display: none; }
    .phone-screen { border-radius: 0; }
  }

  #cosmos {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #cosmos:active { cursor: grabbing; }

  .cosmos-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(6, 9, 22, 0.5) 0%, rgba(6, 9, 22, 0) 16%, rgba(6, 9, 22, 0) 70%, rgba(6, 9, 22, 0.84) 100%);
    z-index: 2;
  }

  /* Status Bar + Dynamic Island */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    padding: 14px 26px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: rgba(248, 250, 255, 0.92);
    pointer-events: none;
    z-index: 30;
  }

  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 116px;
    height: 32px;
    border-radius: 20px;
    background: #03050c;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 11px;
    z-index: 31;
    pointer-events: none;
  }

  .island-lens {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2a3e72 0%, #090e1f 55%, #020308 100%);
  }

  .status-icons { display: flex; align-items: center; gap: 6px; }
  .battery {
    width: 23px;
    height: 11px;
    border-radius: 3.5px;
    border: 1.2px solid rgba(255, 255, 255, 0.72);
    padding: 1.5px;
    position: relative;
  }
  .battery::after {
    content: "";
    position: absolute;
    right: -3px;
    top: 2.5px;
    width: 1.8px;
    height: 4px;
    border-radius: 0 1px 1px 0;
    background: rgba(255, 255, 255, 0.65);
  }
  .battery-fill { width: 82%; height: 100%; border-radius: 1.5px; background: #f8fafc; }

  /* Top Floating HUD */
  .top-hud {
    position: absolute;
    top: 52px;
    left: 14px;
    right: 14px;
    z-index: 22;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
  }
  .top-hud > * { pointer-events: auto; }
  .hud-group { display: flex; align-items: center; gap: 7px; min-width: 0; }

  .glass-pill {
    appearance: none;
    border: 1.2px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--ink-0);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border-radius: 999px;
    height: 36px;
    padding: 0 12px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: transform 0.18s var(--ease-out), background 0.2s ease, border-color 0.2s ease;
    white-space: nowrap;
  }
  .glass-pill:hover { border-color: var(--glass-border-hi); background: rgba(22, 31, 58, 0.86); }
  .glass-pill:active { transform: scale(0.94); }
  .glass-pill.icon-only { width: 36px; padding: 0; justify-content: center; }

  .star-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff9dc 0%, #ffd059 60%, #ff8a3d 100%);
    box-shadow: 0 0 10px rgba(255, 208, 89, 0.95);
    flex-shrink: 0;
  }
  body.host-linux .star-dot {
    background: radial-gradient(circle at 35% 35%, #f4fbff 0%, #7dd3fc 60%, #3b82f6 100%);
    box-shadow: 0 0 10px rgba(125, 211, 252, 0.95);
  }

  .latency-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-emerald);
    background: rgba(52, 211, 153, 0.15);
    padding: 2px 6px;
    border-radius: 999px;
    font-weight: 700;
  }

  .flux-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-1);
    gap: 5px;
    padding: 0 10px;
  }
  .flux-arrow { font-size: 10px; }
  .flux-arrow.up { color: var(--accent-gold); }
  .flux-arrow.down { color: var(--accent-cyan); }

  /* Floating Moon Labels Layer (Planet Focus) */
  .canvas-labels {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    overflow: hidden;
  }

  .moon-float-tag {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    background: rgba(12, 18, 36, 0.86);
    border: 1.2px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink-0);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    transition: border-color 0.2s ease, background 0.2s ease, opacity 0.25s ease;
    max-width: 158px;
  }
  .moon-float-tag:hover,
  .moon-float-tag.highlighted {
    background: rgba(24, 34, 64, 0.95);
    border-color: rgba(255, 255, 255, 0.42);
  }
  .moon-float-tag.approval {
    border-color: rgba(251, 191, 36, 0.65);
    background: rgba(42, 28, 10, 0.90);
  }
  .moon-float-tag span.label-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* M28-inspired Status Orbit Indicator */
  .orb-status {
    position: relative;
    width: 12px;
    height: 12px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .orb-status .core { width: 5px; height: 5px; border-radius: 50%; background: var(--status-color, #94a3b8); }
  .orb-status.idle .core {
    background: transparent;
    border: 1.6px solid rgba(206, 218, 246, 0.6);
    width: 6.5px;
    height: 6.5px;
  }
  .orb-status.running .arc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.6px solid transparent;
    border-top-color: var(--status-color, #38bdf8);
    border-right-color: var(--status-color, #38bdf8);
    animation: spin-arc 1.1s linear infinite;
  }
  .orb-status.approval .core { background: var(--accent-amber); box-shadow: 0 0 8px rgba(251, 191, 36, 0.95); }
  .orb-status.approval .arc {
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 1.5px solid rgba(251, 191, 36, 0.82);
    animation: sonar-ring 1.45s ease-out infinite;
  }
  .orb-status.unread .core { background: #eef4ff; box-shadow: 0 0 8px rgba(224, 242, 254, 0.95); }

  @keyframes spin-arc { to { transform: rotate(360deg); } }
  @keyframes sonar-ring {
    0% { transform: scale(0.7); opacity: 0.95; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* LEVEL 1: SYSTEM OVERVIEW BOTTOM DOCK */
  .overview-bottom {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 20px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.28s var(--ease-out), opacity 0.2s ease;
  }
  .overview-bottom.hidden {
    transform: translateY(28px);
    opacity: 0;
    pointer-events: none;
  }

  body.booting .overview-bottom,
  body.booting .planet-sheet,
  body.booting .session-sheet { transition: none !important; }
  body.booting .msg { animation: none !important; }

  .approval-card {
    background: linear-gradient(135deg, rgba(46, 31, 12, 0.88) 0%, rgba(18, 21, 38, 0.90) 100%);
    border: 1.2px solid rgba(251, 191, 36, 0.42);
    border-radius: var(--radius-lg);
    padding: 11px 12px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 226, 154, 0.18);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .approval-card.dismissed { display: none; }
  .approval-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
  .approval-meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .approval-badge {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent-amber);
    background: rgba(251, 191, 36, 0.16);
    border: 1px solid rgba(251, 191, 36, 0.30);
    padding: 2px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .approval-title { font-size: 13px; font-weight: 600; color: var(--ink-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .approval-cmd {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: rgba(255, 240, 204, 0.92);
    background: rgba(0, 0, 0, 0.34);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 10px;
    padding: 6.5px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .approval-actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; }

  .btn-tactile {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.07);
    color: var(--ink-0);
    height: 35px;
    border-radius: 13px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn-tactile:active { transform: scale(0.95); }
  .btn-tactile.deny { color: #fda4af; border-color: rgba(251, 113, 133, 0.26); background: rgba(251, 113, 133, 0.10); }
  .btn-tactile.allow {
    color: #161004;
    border-color: transparent;
    background: linear-gradient(135deg, #fef08a 0%, #fbbf24 55%, #f59e0b 100%);
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.38);
  }

  /* Cartoon Planet Dock */
  .planet-dock {
    background: var(--glass-bg);
    border: 1.2px solid var(--glass-border);
    border-radius: 26px;
    padding: 7px 6px;
    backdrop-filter: blur(26px) saturate(155%);
    -webkit-backdrop-filter: blur(26px) saturate(155%);
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.13);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
  }

  .dock-planet {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-1);
    font-family: var(--font-sans);
    padding: 5px 2px 4px;
    border-radius: 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    transition: background 0.2s ease, transform 0.18s var(--ease-out), color 0.2s ease;
  }
  .dock-planet:hover { background: rgba(255, 255, 255, 0.08); color: var(--ink-0); }
  .dock-planet:active { transform: scale(0.92); }

  .dock-orb-wrap {
    position: relative;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dock-orb-wrap svg {
    width: 32px;
    height: 32px;
    overflow: visible;
    display: block;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
  }

  .dock-badge {
    position: absolute;
    top: -1px;
    right: -3px;
    min-width: 15px;
    height: 15px;
    padding: 0 3.5px;
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 800;
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.96);
    border: 1.2px solid rgba(255, 255, 255, 0.22);
    color: var(--ink-0);
  }
  .dock-badge.alert {
    background: var(--accent-amber);
    border-color: #fef08a;
    color: #161004;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.9);
  }
  .dock-badge.live {
    background: rgba(16, 28, 48, 0.96);
    border-color: var(--planet-color);
    color: var(--planet-color);
  }

  .dock-name {
    font-size: 10.5px;
    font-weight: 600;
    max-width: 66px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* LEVEL 2: PLANET FOCUS SHEET */
  .planet-sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50%;
    z-index: 19;
    background: linear-gradient(180deg, rgba(13, 19, 38, 0.88) 0%, rgba(8, 12, 26, 0.97) 100%);
    border-top: 1.2px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px 30px 0 0;
    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);
    box-shadow: 0 -22px 60px rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
    transform: translateY(105%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.5s var(--ease-out), opacity 0.32s ease;
  }
  .planet-sheet.open { transform: translateY(0); opacity: 1; pointer-events: auto; }

  .sheet-grabber {
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
    margin: 9px auto 6px;
    flex-shrink: 0;
  }

  .planet-sheet-header {
    padding: 4px 18px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }

  .planet-identity { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .agent-mark-box {
    width: 38px;
    height: 38px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.13);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .agent-mark-box svg { width: 22px; height: 22px; display: block; }
  .planet-title-col { min-width: 0; }
  .planet-title-row { display: flex; align-items: center; gap: 8px; }
  .planet-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink-0); }

  .model-chip {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-1);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.09);
    padding: 2px 7px;
    border-radius: 999px;
    max-width: 124px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .planet-stats {
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--ink-2);
    font-family: var(--font-mono);
  }

  .planet-header-actions { display: flex; align-items: center; gap: 6px; }
  .btn-circle {
    appearance: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.13);
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink-0);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 17px;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn-circle:hover { background: rgba(255, 255, 255, 0.16); }
  .btn-circle:active { transform: scale(0.92); }
  .btn-circle.primary { background: #ffffff; color: #090e1f; border-color: transparent; font-weight: 700; }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: none;
  }
  .session-list::-webkit-scrollbar { display: none; }

  .session-row {
    width: 100%;
    text-align: left;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(255, 255, 255, 0.045);
    border-radius: 18px;
    padding: 12px 13px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--ink-0);
    font-family: var(--font-sans);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.16s ease;
  }
  .session-row:hover { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.22); }
  .session-row:active { transform: scale(0.985); }
  .session-row.approval {
    background: linear-gradient(135deg, rgba(48, 32, 11, 0.6), rgba(255, 255, 255, 0.04));
    border-color: rgba(251, 191, 36, 0.42);
  }
  .session-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .session-row-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-row-state { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-1); flex-shrink: 0; }
  .session-row-path { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-row-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-1); }
  .session-row-preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.80; }
  .session-rate { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent-cyan); flex-shrink: 0; }

  .draft-panel {
    display: none;
    margin: 10px 14px 0;
    padding: 12px;
    border-radius: 18px;
    background: rgba(22, 32, 60, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.16);
    flex-direction: column;
    gap: 9px;
    animation: fade-slide-in 0.26s var(--ease-out);
  }
  .draft-panel.open { display: flex; }
  @keyframes fade-slide-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .draft-dirs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .draft-dirs::-webkit-scrollbar { display: none; }

  .dir-chip {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink-1);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .dir-chip.active { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.36); color: var(--ink-0); }
  .draft-input-row { display: flex; gap: 7px; }

  .text-input {
    flex: 1;
    min-width: 0;
    height: 38px;
    border-radius: 13px;
    border: 1px solid rgba(255, 255, 255, 0.13);
    background: rgba(6, 10, 22, 0.78);
    color: var(--ink-0);
    font-family: var(--font-sans);
    font-size: 13.5px;
    padding: 0 12px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  .text-input:focus { border-color: rgba(255, 255, 255, 0.36); }
  .text-input::placeholder { color: var(--ink-3); }

  /* LEVEL 3: SESSION COCKPIT */
  .session-sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 70%;
    z-index: 21;
    background: linear-gradient(180deg, rgba(11, 16, 33, 0.90) 0%, rgba(6, 10, 22, 0.98) 100%);
    border-top: 1.2px solid rgba(255, 255, 255, 0.15);
    border-radius: 28px 28px 0 0;
    backdrop-filter: blur(30px) saturate(155%);
    -webkit-backdrop-filter: blur(30px) saturate(155%);
    box-shadow: 0 -24px 64px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    transform: translateY(105%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.5s var(--ease-out), opacity 0.32s ease;
  }
  .session-sheet.open { transform: translateY(0); opacity: 1; pointer-events: auto; }

  .chat-header {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .chat-head-left { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .chat-session-name { font-size: 15px; font-weight: 700; color: var(--ink-0); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-session-sub {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--ink-2);
    font-family: var(--font-mono);
    white-space: nowrap;
    overflow: hidden;
  }
  .chat-session-sub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chatAgentLabel { flex-shrink: 0; color: var(--ink-1); }

  .diff-btn {
    appearance: none;
    height: 30px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid rgba(52, 211, 153, 0.34);
    background: rgba(52, 211, 153, 0.12);
    color: #6ee7b7;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 13px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    scrollbar-width: none;
  }
  .chat-messages::-webkit-scrollbar { display: none; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 92%;
    animation: msg-rise 0.3s var(--ease-out);
  }
  @keyframes msg-rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-end; max-width: 82%; }
  .msg.assistant { align-self: flex-start; }

  .msg-bubble {
    padding: 10px 13px;
    border-radius: 18px;
    font-size: 13.5px;
    line-height: 1.52;
    user-select: text;
    -webkit-user-select: text;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, rgba(255, 214, 118, 0.24), rgba(255, 179, 82, 0.13));
    border: 1px solid rgba(255, 212, 112, 0.36);
    border-bottom-right-radius: 6px;
    color: #fff9ec;
  }
  .msg.assistant .msg-bubble {
    background: rgba(255, 255, 255, 0.065);
    border: 1px solid rgba(255, 255, 255, 0.11);
    border-bottom-left-radius: 6px;
    color: rgba(246, 249, 255, 0.95);
  }
  .msg-bubble code {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.42);
    color: #93c5fd;
  }

  .tool-chip {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(16, 24, 46, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.11);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-1);
    max-width: 100%;
    text-align: left;
    cursor: pointer;
  }
  .tool-chip > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-diff-stat { color: var(--accent-emerald); flex-shrink: 0; white-space: nowrap; }

  .stream-caret {
    display: inline-block;
    width: 6px;
    height: 13px;
    margin-left: 3px;
    vertical-align: -2px;
    border-radius: 2px;
    background: var(--accent-gold);
    animation: blink-caret 0.85s ease-in-out infinite;
  }
  @keyframes blink-caret { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

  .composer-area {
    padding: 8px 12px 22px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(7, 11, 24, 0.9);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .quick-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .quick-chips::-webkit-scrollbar { display: none; }
  .quick-chip {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.11);
    background: rgba(255, 255, 255, 0.055);
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .quick-chip:hover { background: rgba(255, 255, 255, 0.13); color: var(--ink-0); }
  .composer-row { display: flex; align-items: center; gap: 8px; }

  .send-btn {
    appearance: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: linear-gradient(135deg, #fef08a 0%, #f59e0b 100%);
    color: #0b0f19;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(245, 158, 11, 0.38);
    transition: transform 0.16s ease;
  }
  .send-btn:active { transform: scale(0.9); }

  /* Modals */
  .modal-backdrop {
    position: absolute;
    inset: 0;
    z-index: 35;
    background: rgba(3, 5, 13, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s ease;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 14px;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal-card {
    width: 100%;
    background: rgba(14, 21, 42, 0.96);
    border: 1.2px solid rgba(255, 255, 255, 0.16);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.68);
    transform: translateY(20px);
    transition: transform 0.32s var(--ease-out);
  }
  .modal-backdrop.open .modal-card { transform: translateY(0); }
  .modal-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

  .host-option {
    width: 100%;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(255, 255, 255, 0.045);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 8px;
    color: var(--ink-0);
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .host-option:last-child { margin-bottom: 0; }
  .host-option.active { border-color: rgba(255, 212, 102, 0.48); background: rgba(255, 212, 102, 0.10); }
  .host-opt-left { display: flex; align-items: center; gap: 11px; text-align: left; }
  .host-star-preview { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
  .host-opt-name { font-size: 14px; font-weight: 600; }
  .host-opt-sub { font-size: 11.5px; color: var(--ink-2); font-family: var(--font-mono); margin-top: 2px; }

  .diff-viewer {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.55;
    background: rgba(5, 8, 18, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    overflow: hidden;
    max-height: 310px;
    overflow-y: auto;
  }
  .diff-line { padding: 2px 10px; white-space: pre; overflow-x: auto; }
  .diff-line.hunk { color: #93c5fd; background: rgba(59, 130, 246, 0.14); }
  .diff-line.add { color: #86efac; background: rgba(34, 197, 94, 0.15); }
  .diff-line.del { color: #fda4af; background: rgba(244, 63, 94, 0.15); }
  .diff-line.ctx { color: rgba(210, 220, 245, 0.68); }

  .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .legend-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    padding: 10px 11px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .legend-k { font-size: 12.5px; font-weight: 600; }
  .legend-v { font-size: 11px; color: var(--ink-2); margin-top: 1px; }

  .home-bar {
    position: absolute;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 4.5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.30);
    z-index: 36;
    pointer-events: none;
  }

  .toast {
    position: absolute;
    top: 98px;
    left: 50%;
    transform: translate(-50%, -10px);
    z-index: 34;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(16, 24, 46, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(16px);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-0);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s ease, transform 0.28s var(--ease-out);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone-shell">
    <div class="phone-screen" id="phoneScreen">
      <canvas id="cosmos"></canvas>
      <div class="cosmos-vignette"></div>
      <div class="canvas-labels" id="canvasLabels"></div>

      <!-- Status Bar + Dynamic Island -->
      <div class="status-bar">
        <span id="clockText">23:20</span>
        <div class="status-icons">
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
            <rect x="0.5" y="7" width="2.5" height="3.5" rx="0.8" fill="currentColor" opacity="0.9"/>
            <rect x="4.3" y="5" width="2.5" height="5.5" rx="0.8" fill="currentColor" opacity="0.9"/>
            <rect x="8.1" y="2.8" width="2.5" height="7.7" rx="0.8" fill="currentColor" opacity="0.9"/>
            <rect x="11.9" y="0.5" width="2.5" height="10" rx="0.8" fill="currentColor" opacity="0.9"/>
          </svg>
          <svg width="14" height="11" viewBox="0 0 16 12" fill="none">
            <path d="M8 9.6a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Zm-3.6-2a5.4 5.4 0 0 1 7.2 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M1.8 4.8a8.9 8.9 0 0 1 12.4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
          </svg>
          <div class="battery"><div class="battery-fill"></div></div>
        </div>
      </div>
      <div class="dynamic-island"><div class="island-lens"></div></div>

      <!-- Top Floating HUD -->
      <div class="top-hud">
        <div class="hud-group">
          <button class="glass-pill" id="backBtn" style="display:none" aria-label="返回">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M10 3.2 5.2 8 10 12.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="backBtnLabel">星系</span>
          </button>
          <button class="glass-pill" id="hostSwitcherBtn">
            <span class="star-dot"></span>
            <span id="hostNameText">MacBook Pro</span>
            <span class="latency-tag" id="hostLatencyText">4ms</span>
          </button>
        </div>

        <div class="hud-group">
          <button class="glass-pill flux-pill" id="fluxPulseBtn" title="触发数据脉冲">
            <span class="flux-arrow up">↑</span><span id="txRate">2.4</span>
            <span class="flux-arrow down">↓</span><span id="rxRate">18.6</span>
          </button>
          <button class="glass-pill icon-only" id="infoBtn" aria-label="星图图例">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
              <circle cx="8" cy="5.1" r="0.95" fill="currentColor"/>
              <path d="M8 7.5v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="toast" id="toast"></div>

      <!-- LEVEL 1: SYSTEM OVERVIEW BOTTOM DOCK -->
      <div class="overview-bottom" id="overviewBottom">
        <div class="approval-card" id="approvalBanner">
          <div class="approval-head" id="approvalBannerHead">
            <div class="approval-meta">
              <span class="orb-status approval"><span class="core"></span><span class="arc"></span></span>
              <span class="approval-title" id="approvalTitle">Claude Code 重构 WebSocket 断线重连</span>
            </div>
            <span class="approval-badge">待确认</span>
          </div>
          <div class="approval-cmd" id="approvalCmd">npx vitest run packages/relay/src/reconnect.test.ts</div>
          <div class="approval-actions">
            <button class="btn-tactile deny" id="bannerDenyBtn">拒绝</button>
            <button class="btn-tactile allow" id="bannerAllowBtn">允许执行</button>
          </div>
        </div>

        <div class="planet-dock" id="planetDock"></div>
      </div>

      <!-- LEVEL 2: PLANET FOCUS — SATELLITE CLUSTER SHEET -->
      <div class="planet-sheet" id="planetSheet">
        <div class="sheet-grabber"></div>
        <div class="planet-sheet-header">
          <div class="planet-identity">
            <div class="agent-mark-box" id="planetMarkBox"></div>
            <div class="planet-title-col">
              <div class="planet-title-row">
                <span class="planet-title" id="planetSheetTitle">Claude Code</span>
                <span class="model-chip" id="planetSheetModel">Opus 4.6</span>
              </div>
              <div class="planet-stats" id="planetSheetStats">3 颗卫星会话 1 运行中</div>
            </div>
          </div>
          <div class="planet-header-actions">
            <button class="btn-circle" id="prevPlanetBtn" aria-label="上一行星">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8 10 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="btn-circle" id="nextPlanetBtn" aria-label="下一行星">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="btn-circle primary" id="toggleDraftBtn" aria-label="新建会话">+</button>
          </div>
        </div>

        <div class="draft-panel" id="draftPanel">
          <div class="draft-dirs" id="draftDirs"></div>
          <div class="draft-input-row">
            <input class="text-input" id="draftInput" type="text" placeholder="输入首句或直接发射新卫星会话" />
            <button class="send-btn" id="launchSessionBtn" aria-label="启动会话">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 12.8V3.2M4.2 6.8 8 3l3.8 3.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="session-list" id="sessionList"></div>
      </div>

      <!-- LEVEL 3: SESSION COCKPIT — LIVE CHAT -->
      <div class="session-sheet" id="sessionSheet">
        <div class="sheet-grabber"></div>
        <div class="chat-header">
          <div class="chat-head-left">
            <div class="chat-session-name" id="chatTitle">重构 WebSocket 断线重连</div>
            <div class="chat-session-sub">
              <span id="chatAgentLabel">Claude Code</span>
              <span id="chatDirLabel">~/orbis/packages/relay</span>
            </div>
          </div>
          <button class="diff-btn" id="openDiffBtn">+42 -11</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="composer-area">
          <div class="quick-chips" id="quickChips">
            <button class="quick-chip" data-prompt="跑一遍相关单元测试">跑一遍单测</button>
            <button class="quick-chip" data-prompt="总结刚刚修改的核心逻辑">总结改动</button>
            <button class="quick-chip" data-prompt="检查边界条件和内存释放">查边界风险</button>
          </div>
          <div class="composer-row">

    hostIdx: 0,
    view: 'overview',
    selectedPlanetId: null,
