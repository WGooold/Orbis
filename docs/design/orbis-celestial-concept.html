  };

  function currentHost() { return HOSTS[state.hostIdx]; }
  function currentPlanet() { return currentHost().planets.find(p => p.id === state.selectedPlanetId) || null; }
  function currentSession() {
    const p = currentPlanet();
    return p ? (p.sessions.find(s => s.id === state.selectedSessionId) || null) : null;
  }

  /* =========================================================
     4. CANVAS & ILLUSTRATIVE COSMOS BACKDROP
     ========================================================= */
  const canvas = document.getElementById('cosmos');
  const ctx = canvas.getContext('2d', { alpha: false });
  const phoneScreen = document.getElementById('phoneScreen');
  const labelsLayer = document.getElementById('canvasLabels');

  let W = 371;
  let H = 830;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let nebulaCanvas = null;

  const stars = [];
  function initStars() {
    stars.length = 0;
    const colors = ['#ffffff', '#dbeafe', '#fef08a', '#ddd6fe', '#fed7aa', '#a7f3d0'];
    for (let i = 0; i < 165; i++) {
      const layer = i < 95 ? 0 : i < 142 ? 1 : 2;
      stars.push({
        x: Math.random(),
        y: Math.random(),
        r: layer === 0 ? 0.6 + Math.random() * 0.6 : layer === 1 ? 1.0 + Math.random() * 0.7 : 1.8 + Math.random() * 1.4,
        isSparkle: layer === 2 && Math.random() < 0.62, // cute 4-point cartoon twinkle stars!
        alpha: 0.28 + Math.random() * 0.68,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.9 + Math.random() * 2.2,
        depth: layer === 0 ? 0.25 : layer === 1 ? 0.55 : 1.0,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function buildNebulaCache() {
    nebulaCanvas = document.createElement('canvas');
    nebulaCanvas.width = Math.max(1, Math.floor(W * DPR));
    nebulaCanvas.height = Math.max(1, Math.floor(H * DPR));
    const nctx = nebulaCanvas.getContext('2d');
    nctx.scale(DPR, DPR);

    // Rich storybook twilight-indigo deep space
    const bg = nctx.createLinearGradient(0, 0, W * 0.35, H);
    bg.addColorStop(0, '#070b1c');
    bg.addColorStop(0.45, '#0c132d');
    bg.addColorStop(1, '#050814');
    nctx.fillStyle = bg;
    nctx.fillRect(0, 0, W, H);

    const host = currentHost();
    const clouds = host.starType === 'gold'
      ? [
          { x: W * 0.16, y: H * 0.22, r: W * 0.68, c0: 'rgba(99, 102, 241, 0.16)', c1: 'rgba(99, 102, 241, 0)' },
          { x: W * 0.85, y: H * 0.38, r: W * 0.64, c0: 'rgba(52, 211, 153, 0.11)', c1: 'rgba(52, 211, 153, 0)' },
          { x: W * 0.50, y: H * 0.36, r: W * 0.74, c0: 'rgba(251, 146, 60, 0.12)', c1: 'rgba(251, 146, 60, 0)' },
          { x: W * 0.24, y: H * 0.72, r: W * 0.58, c0: 'rgba(244, 114, 182, 0.08)', c1: 'rgba(244, 114, 182, 0)' }
        ]
      : [
          { x: W * 0.20, y: H * 0.20, r: W * 0.70, c0: 'rgba(59, 130, 246, 0.19)', c1: 'rgba(59, 130, 246, 0)' },
          { x: W * 0.82, y: H * 0.40, r: W * 0.64, c0: 'rgba(139, 92, 246, 0.15)', c1: 'rgba(139, 92, 246, 0)' },
          { x: W * 0.50, y: H * 0.36, r: W * 0.74, c0: 'rgba(56, 189, 248, 0.15)', c1: 'rgba(56, 189, 248, 0)' },
          { x: W * 0.30, y: H * 0.72, r: W * 0.56, c0: 'rgba(45, 212, 191, 0.09)', c1: 'rgba(45, 212, 191, 0)' }
        ];

    for (const c of clouds) {
      const g = nctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, c.c0);
      g.addColorStop(1, c.c1);
      nctx.fillStyle = g;
      nctx.fillRect(0, 0, W, H);
    }
  }

  function resizeCanvas() {
    const rect = phoneScreen.getBoundingClientRect();
    W = Math.max(280, rect.width);
    H = Math.max(480, rect.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    buildNebulaCache();
  }

  /* =========================================================
     5. 2.5D ORBITAL GEOMETRY & CAMERA PROJECTION
     ========================================================= */
  function getSystemMetrics() {
    const maxOrbitPx = Math.min(W * 0.455, H * 0.256);
    const squash = Math.max(0.48, Math.min(0.84, 0.70 + state.tiltY * 0.16));
    return { maxOrbitPx, squash };
  }

  function planetWorldPos(planet) {
    const { maxOrbitPx, squash } = getSystemMetrics();
    const r = planet.orbitRadius * maxOrbitPx;
    const ang = planet.angle + state.tiltX * 0.35;
    return {
      x: Math.cos(ang) * r,
      y: Math.sin(ang) * r * squash,
      z: Math.sin(ang),
      r,
      ang
    };
  }

  function moonWorldPos(planet, pPos, moon, focusExpand) {
    const baseR = moon.orbitR * (focusExpand ? 1.50 : 0.79);
    const squash = focusExpand ? 0.56 : 0.54;
    const cosT = Math.cos(planet.tilt);
    const sinT = Math.sin(planet.tilt);
    const lx = Math.cos(moon.angle) * baseR;
    const ly = Math.sin(moon.angle) * baseR * squash;
    return {
      x: pPos.x + (lx * cosT - ly * sinT),
      y: pPos.y + (lx * sinT + ly * cosT),
      z: Math.sin(moon.angle),
      orbitR: baseR,
      squash
    };
  }

  function worldToScreen(wx, wy) {
    return {
      x: (wx - state.cam.x) * state.cam.zoom + W * 0.5,
      y: (wy - state.cam.y) * state.cam.zoom + H * 0.5
    };
  }

  function computeCameraTarget() {
    if (state.view === 'overview') {
      const hasBanner = Boolean(findFirstApproval());
      const desiredStarY = hasBanner ? H * 0.378 : H * 0.43;
      return { x: 0, y: H * 0.5 - desiredStarY, zoom: 1.0 };
    }
    const p = currentPlanet();
    if (!p) return { x: 0, y: H * 0.12, zoom: 1.0 };
    const pPos = planetWorldPos(p);

    if (state.view === 'planet') {
      const zoom = 1.94;
      const desiredScreenY = H * 0.312;
      const offsetY = (H * 0.5 - desiredScreenY) / zoom;
      const starDirX = pPos.x === 0 ? 1 : Math.sign(pPos.x);
      return { x: pPos.x - starDirX * 14, y: pPos.y + offsetY, zoom };
    }

    const zoom = 2.08;
    const desiredScreenY = H * 0.18;
    const offsetY = (H * 0.5 - desiredScreenY) / zoom;
    return { x: pPos.x, y: pPos.y + offsetY, zoom };
  }

  /* =========================================================
     6. REMOTE-CONTROL DATA TRANSMISSION ENGINE
     ========================================================= */
  function quadraticBezier(p0, p1, p2, t) {
    const u = 1 - t;
    return {
      x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
      y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y
    };
  }

  function getConduitControlPoint(starPos, pPos, dir) {
    const mx = (starPos.x + pPos.x) * 0.5;
    const my = (starPos.y + pPos.y) * 0.5;
    const dx = pPos.x - starPos.x;
    const dy = pPos.y - starPos.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    const bow = Math.min(54, len * 0.28) * dir;
    return { x: mx + nx * bow, y: my + ny * bow };
  }

  function spawnDataPacket(planet, dir, opts = {}) {
    const host = currentHost();
    const color = dir === 1
      ? (host.starType === 'gold' ? '#FFE484' : '#A5E3FF')
      : planet.color;

    state.packets.push({
      planetId: planet.id,
      dir,
      t: opts.startT || 0,
      speed: opts.speed || (0.44 + Math.random() * 0.30),
      size: opts.size || (dir === 1 ? 3.4 : 3.0),
      color,
      tailLen: opts.tailLen || 0.20,
      targetSessionId: opts.targetSessionId || null,
      bright: Boolean(opts.bright),
      kind: Math.random() < 0.45 ? 'capsule' : 'orb' // stylized cartoon data capsules & glowing energy beads!
    });
  }

  function spawnMoonSpark(planetId, sessionId, dir, color) {
    state.moonSparks.push({
      planetId,
      sessionId,
      dir,
      t: 0,
      speed: 1.4 + Math.random() * 0.6,
      color
    });
  }

  function spawnRipple(wx, wy, color, maxR = 30) {
    state.ripples.push({ x: wx, y: wy, r: 4, maxR, alpha: 0.95, color });
  }

  function firePhoneCommandWave(planet, session, labelColor) {
    const host = currentHost();
    state.uplinkBeams.push({
      t: 0,
      speed: 2.35,
      color: labelColor || host.pulseColor,
      planetId: planet.id,
      sessionId: session ? session.id : null,
      dispatched: false
    });
  }

  function spawnBurstTraffic(targetPlanet) {
    const planets = targetPlanet ? [targetPlanet] : currentHost().planets;
    for (const p of planets) {
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          spawnDataPacket(p, 1, { speed: 0.86 + Math.random() * 0.24, size: 3.8, tailLen: 0.24, bright: true });
        }, i * 65);
        setTimeout(() => {
          spawnDataPacket(p, -1, { speed: 0.80 + Math.random() * 0.24, size: 3.4, tailLen: 0.22, bright: true });
        }, 140 + i * 75);
      }
    }
    state.starFlare = Math.min(1.5, state.starFlare + 0.95);
  }

  function seedInitialPackets() {
    state.packets.length = 0;
    for (const p of currentHost().planets) {
      const running = p.sessions.some(s => s.status === 'running');
      const approval = p.sessions.some(s => s.status === 'approval');
      if (running || approval) {
        spawnDataPacket(p, 1, { startT: 0.26 + Math.random() * 0.18, size: 3.5, tailLen: 0.22, bright: true });
        spawnDataPacket(p, -1, { startT: 0.50 + Math.random() * 0.20, size: 3.2, tailLen: 0.21, bright: true });
        spawnDataPacket(p, -1, { startT: 0.16 + Math.random() * 0.14, size: 2.9, tailLen: 0.18 });
      } else {
        spawnDataPacket(p, 1, { startT: 0.40, size: 2.5, tailLen: 0.15 });
      }
    }
  }

  /* =========================================================
     7. STYLIZED CARTOON CELESTIAL DRAWING ROUTINES
     ========================================================= */
  function drawFourPointStar(x, y, r, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.45);
    ctx.quadraticCurveTo(0, 0, r * 1.45, 0);
    ctx.quadraticCurveTo(0, 0, 0, r * 1.45);
    ctx.quadraticCurveTo(0, 0, -r * 1.45, 0);
    ctx.quadraticCurveTo(0, 0, 0, -r * 1.45);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawStarfield() {
    if (nebulaCanvas) ctx.drawImage(nebulaCanvas, 0, 0, W, H);
    else {
      ctx.fillStyle = '#060916';
      ctx.fillRect(0, 0, W, H);
    }

    const warp = state.warpProgress;
    const parallaxX = -state.cam.x * 0.12 - state.tiltX * 18;
    const parallaxY = -state.cam.y * 0.12 - state.tiltY * 14;

    for (const s of stars) {
      const sx = (s.x * W + parallaxX * s.depth + W * 4) % W;
      const sy = (s.y * H + parallaxY * s.depth + H * 4) % H;
      const tw = 0.58 + 0.42 * Math.sin(state.time * s.twinkleSpeed + s.twinklePhase);
      const a = s.alpha * tw;

      if (warp > 0.02) {
        const cx = W * 0.5;
        const cy = H * 0.36;
        const stretch = 1 + warp * 0.45 * s.depth;
        ctx.strokeStyle = s.color;
        ctx.globalAlpha = Math.min(1, a * (1 + warp * 0.85));
        ctx.lineWidth = s.r * 1.1;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(cx + (sx - cx) * stretch, cy + (sy - cy) * stretch);
        ctx.stroke();
      } else if (s.isSparkle) {
        drawFourPointStar(sx, sy, s.r * (0.85 + tw * 0.35), s.color, a);
      } else {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbits(starScreen) {
    const host = currentHost();
    const { maxOrbitPx, squash } = getSystemMetrics();
    const focusP = currentPlanet();

    ctx.save();
    for (const p of host.planets) {
      const r = p.orbitRadius * maxOrbitPx * state.cam.zoom;
      const isFocused = focusP && focusP.id === p.id;
      const hasRunning = p.sessions.some(s => s.status === 'running');
      const hasApproval = p.sessions.some(s => s.status === 'approval');

      ctx.beginPath();
      ctx.ellipse(starScreen.x, starScreen.y, r, r * squash, 0, 0, Math.PI * 2);
      ctx.setLineDash(isFocused ? [] : [5, 7]);

      if (isFocused) {
        ctx.strokeStyle = hexAlpha(p.color, 0.42);
        ctx.lineWidth = 1.5;
      } else if (state.view !== 'overview') {
        ctx.strokeStyle = 'rgba(180, 200, 245, 0.10)';
        ctx.lineWidth = 1.0;
      } else {
        ctx.strokeStyle = hasApproval
          ? 'rgba(251, 191, 36, 0.34)'
          : hasRunning
            ? 'rgba(196, 218, 255, 0.24)'
            : 'rgba(160, 182, 230, 0.14)';
        ctx.lineWidth = hasRunning || hasApproval ? 1.15 : 0.9;
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  /* ---- CARTOON HOST COMPUTER STAR (恒星 = 你的电脑) ---- */
  function drawCartoonStar(starScreen) {
    const host = currentHost();
    const zoom = state.cam.zoom;
    const baseR = 25 * zoom;
    const bounce = 1 + state.starFlare * 0.16 + Math.sin(state.time * 2.6) * 0.025;
    const r = baseR * bounce;

    ctx.save();
    ctx.translate(starScreen.x, starScreen.y);

    // 1. Soft stylized pastel glow aura
    const outerGlow = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 3.8);
    outerGlow.addColorStop(0, host.starType === 'gold' ? 'rgba(255, 216, 102, 0.56)' : 'rgba(125, 211, 252, 0.58)');
    outerGlow.addColorStop(0.4, host.starType === 'gold' ? 'rgba(255, 138, 61, 0.20)' : 'rgba(59, 130, 246, 0.22)');
    outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 3.8, 0, Math.PI * 2);
    ctx.fill();

    // 2. Playful animated cartoon scalloped sun-ray petals (Kurzgesagt-style wavy corona!)
    const petals = 12;
    ctx.save();
    ctx.rotate(state.time * 0.22);
    ctx.beginPath();
    for (let i = 0; i <= petals * 6; i++) {
      const a = (i / (petals * 6)) * Math.PI * 2;
      const wave = Math.sin(a * petals) * r * (0.14 + state.starFlare * 0.06);
      const rr = r * 1.24 + wave;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = host.starType === 'gold' ? 'rgba(255, 178, 64, 0.42)' : 'rgba(96, 165, 250, 0.44)';
    ctx.fill();
    ctx.strokeStyle = host.starType === 'gold' ? 'rgba(255, 236, 168, 0.72)' : 'rgba(186, 230, 253, 0.78)';
    ctx.lineWidth = Math.max(1.2, 1.6 * zoom * 0.65);
    ctx.stroke();
    ctx.restore();

    // Counter-rotating inner soft sun ring
    ctx.save();
    ctx.rotate(-state.time * 0.16);
    ctx.beginPath();
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * Math.PI * 2;
      const rr = r * 1.12 + Math.cos(a * 8) * r * 0.07;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = host.starType === 'gold' ? 'rgba(255, 214, 102, 0.55)' : 'rgba(147, 213, 255, 0.56)';
    ctx.fill();
    ctx.restore();

    // 3. Cel-shaded Sun Sphere Body
    const coreG = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.08, 0, 0, r);
    coreG.addColorStop(0, host.coreColor);
    coreG.addColorStop(0.55, host.midColor);
    coreG.addColorStop(1, host.coronaColor);
    ctx.fillStyle = coreG;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Crisp cartoon outline rim
    ctx.strokeStyle = host.starType === 'gold' ? '#FFF6D6' : '#E0F2FE';
    ctx.lineWidth = Math.max(1.5, r * 0.075);
    ctx.stroke();

    // Glossy candy top-left shine dot
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.42, -r * 0.44, r * 0.22, r * 0.12, -0.65, 0, Math.PI * 2);
    ctx.fill();

    // 4. SUPER CLEAR & CUTE COMPUTER EMBLEM INSIDE THE STAR CORE ("电脑 = 恒星" 一眼秒懂!)
    ctx.save();
    const s = r * 0.54;
    if (host.starType === 'gold') {
      // Cute stylized MacBook silhouette inside golden sun!
      ctx.fillStyle = '#4A2107';
      ctx.strokeStyle = '#FFF9E6';
      ctx.lineWidth = Math.max(1.1, r * 0.055);
      // Screen lid
      roundRectPath(ctx, -s * 0.78, -s * 0.62, s * 1.56, s * 1.02, s * 0.22);
      ctx.fill();
      ctx.stroke();
      // Glowing little screen interior
      ctx.fillStyle = '#FFE394';
      roundRectPath(ctx, -s * 0.58, -s * 0.44, s * 1.16, s * 0.66, s * 0.12);
      ctx.fill();
      // Cute tiny glowing code lines on the mini MacBook screen
      ctx.strokeStyle = '#9A3412';
      ctx.lineWidth = Math.max(1.0, r * 0.045);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-s * 0.34, -s * 0.20);
      ctx.lineTo(s * 0.22, -s * 0.20);
      ctx.moveTo(-s * 0.34, 0.02 * s);
      ctx.lineTo(s * 0.34, 0.02 * s);
      ctx.stroke();
      // Laptop keyboard base
      ctx.fillStyle = '#FFF7DC';
      roundRectPath(ctx, -s * 1.02, s * 0.42, s * 2.04, s * 0.24, s * 0.12);
      ctx.fill();
    } else {
      // Cute stylized Workstation Monitor / Terminal inside blue-white star!
      ctx.fillStyle = '#0F2557';
      ctx.strokeStyle = '#E0F2FE';
      ctx.lineWidth = Math.max(1.1, r * 0.055);
      roundRectPath(ctx, -s * 0.82, -s * 0.66, s * 1.64, s * 1.08, s * 0.22);
      ctx.fill();
      ctx.stroke();
      // Crisp glowing >_ inside monitor
      ctx.strokeStyle = '#7DD3FC';
      ctx.lineWidth = Math.max(1.2, r * 0.06);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, -s * 0.30);
      ctx.lineTo(-s * 0.10, -s * 0.10);
      ctx.lineTo(-s * 0.42, s * 0.10);
      ctx.moveTo(s * 0.08, s * 0.10);
      ctx.lineTo(s * 0.42, s * 0.10);
      ctx.stroke();
      // Stand foot
      ctx.fillStyle = '#E0F2FE';
      roundRectPath(ctx, -s * 0.38, s * 0.48, s * 0.76, s * 0.18, s * 0.09);
      ctx.fill();
    }
    ctx.restore();

    // 5. Little cartoon 4-point star sparkles orbiting the Sun!
    for (let i = 0; i < 3; i++) {
      const a = state.time * 0.85 + i * 2.09;
      const dist = r * (1.58 + 0.1 * Math.sin(state.time * 3 + i));
      drawFourPointStar(
        Math.cos(a) * dist,
        Math.sin(a) * dist * 0.72,
        Math.max(2.2, r * 0.13),
        '#FFFFFF',
        0.78 + 0.22 * Math.sin(state.time * 4 + i)
      );
    }

    ctx.restore();
  }

  /* ---- CARTOON AGENT PLANETS (每个星球附带每个 Agent 的鲜明卡通特色!) ---- */
  function drawCartoonRingHalf(pScr, p, r, isFront) {
    if (!p.ring) return;
    ctx.save();
    ctx.translate(pScr.x, pScr.y);
    ctx.rotate(p.tilt);

    const startA = isFront ? 0 : Math.PI;
    const endA = isFront ? Math.PI : Math.PI * 2;

    if (p.style === 'codex-cartoon') {
      // Chunky, glossy mint-cyan cartoon Saturn ring with scrolling dashed code ticks!
      const rx = r * 1.78;
      const ry = rx * 0.36;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, startA, endA);
      ctx.strokeStyle = isFront ? '#99FCE8' : 'rgba(110, 231, 210, 0.55)';
      ctx.lineWidth = Math.max(3.6, r * 0.27);
      ctx.lineCap = 'round';
      ctx.stroke();

      // Inner dark-teal accent stripe + sliding code dashes on ring!
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, startA, endA);
      ctx.strokeStyle = isFront ? '#0D5E59' : 'rgba(13, 94, 89, 0.45)';
      ctx.lineWidth = Math.max(1.3, r * 0.085);
      ctx.setLineDash([4, 6]);
      ctx.lineDashOffset = -state.time * 18;
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (p.style === 'pi-cartoon') {
      // Playful golden dashed Bauhaus orbit ring with floating tiny colored pixel blocks!
      const rx = r * 1.62;
      const ry = rx * 0.38;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, startA, endA);
      ctx.strokeStyle = isFront ? '#FDE08A' : 'rgba(253, 224, 138, 0.45)';
      ctx.lineWidth = Math.max(2.0, r * 0.12);
      ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = state.time * 14;
      ctx.stroke();
      ctx.setLineDash([]);

      // Tiny floating Bauhaus pixel tiles riding the ring
      const colors = ['#F09082', '#4D9ABF', '#F1BE58'];
      for (let i = 0; i < 3; i++) {
        const a = (state.time * 0.9 + i * 2.09) % (Math.PI * 2);
        const onFront = a >= 0 && a <= Math.PI;
        if (onFront !== isFront) continue;
        const bx = Math.cos(a) * rx;
        const by = Math.sin(a) * ry;
        const bs = Math.max(2.6, r * 0.19);
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(state.time * 1.4 + i);
        ctx.fillStyle = colors[i];
        ctx.strokeStyle = '#FFFBEB';
        ctx.lineWidth = 0.9;
        roundRectPath(ctx, -bs / 2, -bs / 2, bs, bs, bs * 0.25);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    ctx.restore();
  }

  function drawCartoonPlanet(pScr, starScreen, p, r) {
    ctx.save();
    ctx.translate(pScr.x, pScr.y);

    // Subtle pastel glow behind every cartoon planet
    const aura = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.85);
    aura.addColorStop(0, hexAlpha(p.color, 0.44));
    aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.85, 0, Math.PI * 2);
    ctx.fill();

    // Gentle cheerful bobbing wobble
    const bob = Math.sin(state.time * 2.2 + p.orbitRadius * 12) * (r * 0.04);
    ctx.translate(0, bob);

    if (p.style === 'claude-cartoon') {
      drawClaudeCartoonPlanet(r, p);
    } else if (p.style === 'codex-cartoon') {
      drawCodexCartoonPlanet(r, p);
    } else if (p.style === 'dsh-cartoon') {
      drawDeepSeekCartoonPlanet(r, p);
    } else if (p.style === 'pi-cartoon') {
      drawPiCartoonPlanet(r, p);
    } else if (p.style === 'openclaw-cartoon') {
      drawOpenClawCartoonPlanet(r, p);
    }

    // Focused planet playful dashed halo
    if (state.view === 'planet' && state.selectedPlanetId === p.id) {
      ctx.save();
      ctx.strokeStyle = hexAlpha(p.palette[0], 0.52);
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.32, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  // Helper: Crisp cel-shaded crescent shadow + glossy candy highlight on any sphere
  function drawCelShadingOverlay(r, darkColor, rimColor) {
    // Cel-shaded bottom-right shadow crescent
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = darkColor;
    ctx.globalAlpha = 0.34;
    ctx.beginPath();
    ctx.arc(r * 0.28, r * 0.26, r * 1.02, 0, Math.PI * 2);
    ctx.arc(-r * 0.16, -r * 0.18, r * 0.96, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
    ctx.globalAlpha = 1;

    // Glossy cartoon specular pill highlight (top-left)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.52)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.42, -r * 0.44, r * 0.24, r * 0.12, -0.68, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-r * 0.20, -r * 0.62, r * 0.065, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Crisp cartoon rim stroke
    ctx.strokeStyle = rimColor;
    ctx.lineWidth = Math.max(1.4, r * 0.085);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  /* --- 1. CLAUDE CODE: Warm Terracotta Starburst World --- */
  function drawClaudeCartoonPlanet(r, p) {
    // Warm coral-terracotta base
    const g = ctx.createRadialGradient(-r * 0.28, -r * 0.28, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#FFB58A');
    g.addColorStop(0.55, '#E57A50');
    g.addColorStop(1, '#B84723');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Cute soft cream cartoon clouds drifting across globe
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();
    const drift = Math.sin(state.time * 0.6) * r * 0.16;
    ctx.fillStyle = 'rgba(255, 239, 224, 0.24)';
    roundRectPath(ctx, -r * 1.1 + drift, -r * 0.56, r * 0.95, r * 0.24, r * 0.12);
    ctx.fill();
    roundRectPath(ctx, r * 0.15 - drift, r * 0.34, r * 1.0, r * 0.24, r * 0.12);
    ctx.fill();
    ctx.restore();

    drawCelShadingOverlay(r, '#5E1B08', '#FFD9BE');

    // Signature Claude Starburst Emblem shining playfully on center!
    ctx.save();
    const pulse = 1 + Math.sin(state.time * 2.8) * 0.05;
    const s = (r * 1.18 * pulse) / 24;
    ctx.rotate(Math.sin(state.time * 0.7) * 0.16);
    ctx.scale(s, s);
    ctx.translate(-12, -12);
    ctx.fillStyle = '#FFF5E6';
    ctx.shadowColor = 'rgba(255, 226, 184, 0.85)';
    ctx.shadowBlur = 8;
    ctx.fill(CLAUDE_PATH2D);
    ctx.restore();

    // Cute floating warm spark orbiting Claude
    const sa = state.time * 1.3;
    drawFourPointStar(Math.cos(sa) * r * 1.28, Math.sin(sa) * r * 0.95, Math.max(2.0, r * 0.15), '#FFE7C2', 0.9);
  }

  /* --- 2. CODEX: Mint-Teal Ringed Planet with Animated >_ Terminal Visor --- */
  function drawCodexCartoonPlanet(r, p) {
    const g = ctx.createRadialGradient(-r * 0.28, -r * 0.28, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#89FCE6');
    g.addColorStop(0.55, '#2AD1AE');
    g.addColorStop(1, '#0F8B7C');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    drawCelShadingOverlay(r, '#053B3B', '#BDFEF1');

    // Cute rounded dark-jade Terminal Visor Window right on Codex's face!
    const vw = r * 1.24;
    const vh = r * 0.84;
    ctx.save();
    ctx.fillStyle = '#08292B';
    ctx.strokeStyle = '#99FCE8';
    ctx.lineWidth = Math.max(1.2, r * 0.075);
    roundRectPath(ctx, -vw / 2, -vh / 2, vw, vh, vh * 0.36);
    ctx.fill();
    ctx.stroke();

    // Animated crisp >_ prompt!
    ctx.strokeStyle = '#6CFCE0';
    ctx.lineWidth = Math.max(1.5, r * 0.105);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.34, -r * 0.18);
    ctx.lineTo(-r * 0.08, 0);
    ctx.lineTo(-r * 0.34, r * 0.18);
    ctx.stroke();

    // Blinking underscore cursor!
    if (Math.sin(state.time * 5.2) > -0.35) {
      ctx.beginPath();
      ctx.moveTo(r * 0.06, r * 0.18);
      ctx.lineTo(r * 0.38, r * 0.18);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* --- 3. DEEPSEEK: Adorable Ocean Planet with DeepSeek Whale & Water-Spout --- */
  function drawDeepSeekCartoonPlanet(r, p) {
    // Glossy deep-sapphire ocean sphere
    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.30, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#85A7FF');
    g.addColorStop(0.55, '#4A6BFF');
    g.addColorStop(1, '#2038B8');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Playful animated cartoon ocean wave band across lower half!
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();
    const waveShift = state.time * 1.8;
    ctx.fillStyle = 'rgba(18, 34, 128, 0.52)';
    ctx.beginPath();
    ctx.moveTo(-r * 1.2, r * 0.22);
    for (let x = -r * 1.2; x <= r * 1.2; x += r * 0.2) {
      const y = r * 0.22 + Math.sin(x * 0.25 + waveShift) * r * 0.10;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(r * 1.2, r * 1.2);
    ctx.lineTo(-r * 1.2, r * 1.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    drawCelShadingOverlay(r, '#0D1759', '#C2D6FF');

    // Iconic DeepSeek Whale swimming joyfully across the planet!
    ctx.save();
    const swimBob = Math.sin(state.time * 2.4) * r * 0.06;
    const swimTilt = Math.sin(state.time * 2.4) * 0.08;
    ctx.translate(0, swimBob + r * 0.04);
    ctx.rotate(swimTilt);
    const scale = (r * 1.22) / 48.34;
    ctx.scale(scale, scale);
    ctx.translate(-25.1, -25.1);
    ctx.fillStyle = '#F0F6FF';
    ctx.shadowColor = 'rgba(147, 197, 253, 0.85)';
    ctx.shadowBlur = 6;
    ctx.fill(DSH_WHALE_PATH2D);
    ctx.restore();

    // Cute animated water-bubble fountain puffing from the top of DeepSeek planet!
    for (let i = 0; i < 3; i++) {
      const phase = (state.time * 0.85 + i * 0.33) % 1;
      const side = i === 0 ? 0 : i === 1 ? -1 : 1;
      const bx = side * phase * r * 0.38;
      const by = -r * 1.02 - phase * r * 0.56 + phase * phase * r * 0.16;
      const br = Math.max(1.4, r * 0.13 * (1 - phase * 0.45));
      ctx.save();
      ctx.globalAlpha = (1 - phase) * 0.92;
      ctx.fillStyle = '#BAE6FD';
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  /* --- 4. PI: Bauhaus Tri-Color Block Cartoon Planet --- */
  function drawPiCartoonPlanet(r, p) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();

    // Bold playful Bauhaus tri-color curved stripes (Pi's iconic coral / sunny yellow / cerulean!)
    ctx.rotate(-0.22);
    ctx.fillStyle = '#F49788';
    ctx.fillRect(-r * 1.2, -r * 1.2, r * 2.4, r * 0.88);
    ctx.fillStyle = '#F6C95E';
    ctx.fillRect(-r * 1.2, -r * 0.36, r * 2.4, r * 0.74);
    ctx.fillStyle = '#4FA0C8';
    ctx.fillRect(-r * 1.2, r * 0.34, r * 2.4, r * 0.96);

    // Crisp playful white divider lines between color blocks
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = Math.max(1.0, r * 0.06);
    ctx.beginPath();
    ctx.moveTo(-r * 1.2, -r * 0.34);
    ctx.lineTo(r * 1.2, -r * 0.34);
    ctx.moveTo(-r * 1.2, r * 0.35);
    ctx.lineTo(r * 1.2, r * 0.35);
    ctx.stroke();
    ctx.restore();

    drawCelShadingOverlay(r, '#19354A', '#FFF1C2');

    // Crisp geometric Pi badge right at the heart!
    ctx.save();
    const ps = r * 0.58;
    ctx.fillStyle = '#152538';
    ctx.strokeStyle = '#FFF9E6';
    ctx.lineWidth = Math.max(1.1, r * 0.065);
    roundRectPath(ctx, -ps * 0.82, -ps * 0.78, ps * 1.64, ps * 1.56, ps * 0.38);
    ctx.fill();
    ctx.stroke();

    // Draw mini Pi three-block mosaic mark cleanly inside badge!
    const u = ps * 0.34;
    ctx.fillStyle = '#F09082';
    ctx.fillRect(-u * 1.35, -u * 1.25, u * 2.1, u * 0.72);
    ctx.fillRect(u * 0.05, -u * 1.25, u * 0.7, u * 1.45);
    ctx.fillStyle = '#4D9ABF';
    ctx.fillRect(-u * 1.35, -u * 0.55, u * 0.72, u * 1.85);
    ctx.fillRect(-u * 1.35, u * 0.15, u * 1.45, u * 0.72);
    ctx.fillStyle = '#F1BE58';
    ctx.fillRect(u * 0.65, u * 0.15, u * 0.72, u * 1.15);
    ctx.restore();
  }

  /* --- 5. OPENCLAW: Expressive Cute Red Claw/Crab Planet with Blinking Cyan Eyes & Wiggling Pincers! --- */
  function drawOpenClawCartoonPlanet(r, p) {
    const snip = Math.sin(state.time * 3.8) * 0.18;

    // 1. Cute wiggling cartoon antennae on top!
    ctx.save();
    ctx.strokeStyle = '#FF7C7C';
    ctx.lineWidth = Math.max(1.6, r * 0.10);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.35, -r * 0.85);
    ctx.quadraticCurveTo(-r * 0.62, -r * 1.32, -r * 0.92, -r * 1.18 + Math.sin(state.time * 3) * r * 0.06);
    ctx.moveTo(r * 0.35, -r * 0.85);
    ctx.quadraticCurveTo(r * 0.62, -r * 1.32, r * 0.92, -r * 1.18 - Math.sin(state.time * 3) * r * 0.06);
    ctx.stroke();

    // 2. Plump iconic cartoon lobster/crab pincers raised joyfully on both sides!
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(side * r * 0.92, -r * 0.14);
      ctx.rotate(side * (-0.32 + snip));
      // Little arm stem
      ctx.strokeStyle = '#FF5252';
      ctx.lineWidth = Math.max(2.2, r * 0.14);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, r * 0.08);
      ctx.lineTo(side * r * 0.24, -r * 0.06);
      ctx.stroke();

      // Classic plump U-claw pincer with crisp open V-notch!
      ctx.translate(side * r * 0.34, -r * 0.14);
      ctx.scale(side, 1);
      ctx.fillStyle = '#FF4D4D';
      ctx.strokeStyle = '#FFC9C9';
      ctx.lineWidth = Math.max(1.1, r * 0.065);
      ctx.beginPath();
      ctx.moveTo(-r * 0.12, r * 0.14);
      ctx.quadraticCurveTo(-r * 0.24, -r * 0.28, r * 0.08, -r * 0.34);
      ctx.quadraticCurveTo(r * 0.02, -r * 0.12, r * 0.06, -r * 0.06);
      ctx.lineTo(r * 0.12, -r * 0.06);
      ctx.quadraticCurveTo(r * 0.14, -r * 0.14, r * 0.26, -r * 0.26);
      ctx.quadraticCurveTo(r * 0.38, r * 0.04, r * 0.08, r * 0.22);
      ctx.quadraticCurveTo(-r * 0.04, r * 0.24, -r * 0.12, r * 0.14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // 3. Plump glossy crimson body sphere
    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.28, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#FF8080');
    g.addColorStop(0.55, '#EC3E45');
    g.addColorStop(1, '#A61722');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    drawCelShadingOverlay(r, '#4C070E', '#FFC4C4');

    // 4. Signature OpenClaw Glowing Cyan Cartoon Eyes (with occasional adorable blink!)
    const blinkCycle = (state.time % 4.4);
    const isBlinking = blinkCycle > 4.22;

    for (const side of [-1, 1]) {
      const ex = side * r * 0.34;
      const ey = -r * 0.06;
      if (isBlinking) {
        ctx.strokeStyle = '#00F0D4';
        ctx.lineWidth = Math.max(1.6, r * 0.10);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(ex, ey + r * 0.04, r * 0.17, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      } else {
        // Dark eye socket
        ctx.fillStyle = '#090D1A';
        ctx.beginPath();
        ctx.arc(ex, ey, r * 0.22, 0, Math.PI * 2);
        ctx.fill();
        // Electric cyan iris glow!
        ctx.fillStyle = '#00F0D4';
        ctx.shadowColor = '#00E5CC';
        ctx.shadowBlur = 7;
        ctx.beginPath();
        ctx.arc(ex + r * 0.03, ey - r * 0.02, r * 0.125, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Cute white sparkle catchlight
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(ex - r * 0.04, ey - r * 0.07, r * 0.055, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Little confident cartoon smirk!
    ctx.strokeStyle = '#FFE4E6';
    ctx.lineWidth = Math.max(1.2, r * 0.075);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, r * 0.22, r * 0.20, 0.28, Math.PI - 0.28);
    ctx.stroke();
  }

  /* ---- CARTOON SESSION MOONS (卫星群 = 迷你卫星 / 泡泡卫星) ---- */
  function drawMoonOrbitRings(pScr, p, focusExpand) {
    const zoom = state.cam.zoom;
    ctx.save();
    ctx.translate(pScr.x, pScr.y);
    ctx.rotate(p.tilt);

    for (const m of p.sessions) {
      const rx = m.orbitR * (focusExpand ? 1.50 : 0.79) * zoom;
      const ry = rx * (focusExpand ? 0.56 : 0.54);
      const isSelected = state.selectedSessionId === m.id || state.highlightedSessionId === m.id;

      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.setLineDash(focusExpand ? [4, 5] : [2, 4]);
      ctx.strokeStyle = m.status === 'approval'
        ? 'rgba(251, 191, 36, 0.48)'
        : isSelected
          ? hexAlpha(p.color, 0.70)
          : focusExpand
            ? 'rgba(215, 228, 255, 0.26)'
            : 'rgba(210, 224, 255, 0.16)';
      ctx.lineWidth = isSelected ? 1.5 : 0.9;
      ctx.stroke();
      ctx.setLineDash([]);

      // Playful curved glowing tail behind running/approval moons
      if (m.status === 'running' || m.status === 'approval') {
        const wakeSpan = m.status === 'running' ? 0.76 : 0.48;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, m.angle - wakeSpan, m.angle);
        ctx.strokeStyle = m.status === 'approval' ? 'rgba(253, 224, 71, 0.80)' : hexAlpha(p.palette[0], 0.78);
        ctx.lineWidth = focusExpand ? 2.2 : 1.5;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawSingleCartoonMoon(mScr, pScr, p, m, focusExpand, planetDrawR) {
    const zoom = state.cam.zoom;
    const isHighlighted = state.highlightedSessionId === m.id || state.selectedSessionId === m.id;
    const r = m.size * (focusExpand ? 1.12 : 0.78) * Math.min(1.55, zoom * 0.82);

    ctx.save();

    // Cute dashed energy tether starting from planet EDGE so character faces stay 100% clean!
    if (m.status === 'running' || m.status === 'approval') {
      const dx = mScr.x - pScr.x;
      const dy = mScr.y - pScr.y;
      const dist = Math.hypot(dx, dy) || 1;
      const edgeOffset = Math.min(dist * 0.72, (planetDrawR || 20) * 1.06);
      const sx = pScr.x + (dx / dist) * edgeOffset;
      const sy = pScr.y + (dy / dist) * edgeOffset;
      if (dist > edgeOffset + r) {
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(mScr.x, mScr.y);
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = m.status === 'approval' ? 'rgba(251, 191, 36, 0.46)' : hexAlpha(p.color, 0.45);
        ctx.lineWidth = focusExpand ? 1.4 : 0.95;
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    ctx.translate(mScr.x, mScr.y);

    if (m.status === 'approval') {
      // Expanding cartoon amber sonar waves
      for (let k = 0; k < 2; k++) {
        const phase = (state.time * 0.92 + k * 0.5) % 1;
        ctx.beginPath();
        ctx.arc(0, 0, r + phase * r * 3.4, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(251, 191, 36, ${(1 - phase) * 0.92})`;
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
    } else if (m.status === 'running') {
      // Soft halo + tiny cute cartoon solar-wing paddles + spinning M28 arc!
      const halo = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.9);
      halo.addColorStop(0, hexAlpha(p.color, 0.68));
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.9, 0, Math.PI * 2);
      ctx.fill();

      // Tiny stylized satellite wings (visible clearly when zoomed or moderately sized!)
      ctx.save();
      ctx.rotate(m.angle + 0.5);
      ctx.fillStyle = '#93C5FD';
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 0.8;
      roundRectPath(ctx, -r * 1.95, -r * 0.34, r * 0.72, r * 0.68, r * 0.16);
      ctx.fill();
      ctx.stroke();
      roundRectPath(ctx, r * 1.23, -r * 0.34, r * 0.72, r * 0.68, r * 0.16);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      const arcStart = state.time * 3.6 + m.angle;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.65, arcStart, arcStart + 2.1);
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.stroke();
    } else if (m.status === 'unread') {
      const glow = ctx.createRadialGradient(0, 0, r * 0.25, 0, 0, r * 2.5);
      glow.addColorStop(0, 'rgba(224, 242, 254, 0.66)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Cel-shaded cartoon moon sphere
    if (m.status === 'idle') {
      ctx.fillStyle = '#182342';
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = isHighlighted ? '#FFFFFF' : '#B8C9F2';
      ctx.lineWidth = isHighlighted ? 1.9 : 1.4;
      ctx.stroke();
      // Cute tiny moon crater dot
      ctx.fillStyle = 'rgba(184, 201, 242, 0.35)';
      ctx.beginPath();
      ctx.arc(r * 0.26, -r * 0.18, r * 0.24, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const mg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      if (m.status === 'approval') {
        mg.addColorStop(0, '#FFFBEB');
        mg.addColorStop(0.55, '#FBBF24');
        mg.addColorStop(1, '#D97706');
      } else if (m.status === 'running') {
        mg.addColorStop(0, '#FFFFFF');
        mg.addColorStop(0.55, p.palette[0]);
        mg.addColorStop(1, p.color);
      } else {
        mg.addColorStop(0, '#FFFFFF');
        mg.addColorStop(0.65, '#DBEAFE');
        mg.addColorStop(1, '#60A5FA');
      }
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = Math.max(1.0, r * 0.18);
      ctx.stroke();

      // Cute crisp "!" badge inside approval moon when big enough
      if (m.status === 'approval' && r >= 5.2) {
        ctx.fillStyle = '#3B1D00';
        ctx.font = `800 ${Math.round(r * 1.25)}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', 0, 0.6);
      }
    }

    if (isHighlighted) {
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.35, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* ---- CARTOON ENERGY STREAMS & DATA CAPSULES (远控数据传递) ---- */
  function drawFluxConduits(starScreen, planetScreens) {
    const host = currentHost();
    const focusP = currentPlanet();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    if (state.view === 'overview') {
      const dockY = H - 108;
      const tetherG = ctx.createLinearGradient(starScreen.x, dockY, starScreen.x, starScreen.y + 26);
      tetherG.addColorStop(0, 'rgba(255, 255, 255, 0)');
      tetherG.addColorStop(0.55, host.starType === 'gold' ? 'rgba(255, 212, 102, 0.18)' : 'rgba(125, 211, 252, 0.20)');
      tetherG.addColorStop(1, host.starType === 'gold' ? 'rgba(255, 230, 150, 0.36)' : 'rgba(186, 230, 253, 0.38)');
      ctx.strokeStyle = tetherG;
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 8]);
      ctx.lineDashOffset = state.time * 26;
      ctx.beginPath();
      ctx.moveTo(starScreen.x, dockY);
      ctx.lineTo(starScreen.x, starScreen.y + 26);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const item of planetScreens) {
      const p = item.planet;
      const pScr = item.screen;
      const isFocused = focusP && focusP.id === p.id;
      const runningCount = p.sessions.filter(s => s.status === 'running').length;
      const hasApproval = p.sessions.some(s => s.status === 'approval');

      const activity = state.burstMode ? 1.0 : (runningCount > 0 ? 0.94 : hasApproval ? 0.74 : 0.26);
      const dimFactor = state.view !== 'overview' && !isFocused ? 0.18 : 1.0;

      for (const dir of [1, -1]) {
        const ctrl = getConduitControlPoint(starScreen, pScr, dir);

        // Soft glowing cartoon energy tube corridor
        if (activity > 0.35) {
          const auraG = ctx.createLinearGradient(starScreen.x, starScreen.y, pScr.x, pScr.y);
          auraG.addColorStop(0, dir === 1
            ? (host.starType === 'gold' ? `rgba(255, 210, 96, ${0.22 * activity * dimFactor})` : `rgba(125, 211, 252, ${0.24 * activity * dimFactor})`)
            : hexAlpha(p.color, 0.13 * activity * dimFactor));
          auraG.addColorStop(1, hexAlpha(p.color, 0.24 * activity * dimFactor));

          ctx.beginPath();
          ctx.moveTo(starScreen.x, starScreen.y);
          ctx.quadraticCurveTo(ctrl.x, ctrl.y, pScr.x, pScr.y);
          ctx.strokeStyle = auraG;
          ctx.lineWidth = isFocused ? 8.2 : 5.8;
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        // Core crisp stream path
        const grad = ctx.createLinearGradient(starScreen.x, starScreen.y, pScr.x, pScr.y);
        if (dir === 1) {
          grad.addColorStop(0, host.starType === 'gold' ? `rgba(255, 226, 130, ${0.70 * activity * dimFactor})` : `rgba(165, 232, 255, ${0.72 * activity * dimFactor})`);
          grad.addColorStop(0.5, hasApproval ? `rgba(251, 191, 36, ${0.60 * dimFactor})` : `rgba(255, 248, 214, ${0.38 * activity * dimFactor})`);
          grad.addColorStop(1, hexAlpha(p.color, 0.58 * activity * dimFactor));
        } else {
          grad.addColorStop(0, hexAlpha(p.color, 0.24 * activity * dimFactor));
          grad.addColorStop(0.5, hexAlpha(p.color, 0.52 * activity * dimFactor));
          grad.addColorStop(1, hexAlpha(p.color, 0.72 * activity * dimFactor));
        }

        ctx.beginPath();
        ctx.moveTo(starScreen.x, starScreen.y);
        ctx.quadraticCurveTo(ctrl.x, ctrl.y, pScr.x, pScr.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = (isFocused ? 2.4 : 1.55) * (0.72 + activity * 0.36);
        ctx.stroke();

        // Playful animated dotted energy stream dashes
        if (activity > 0.3) {
          ctx.beginPath();
          ctx.moveTo(starScreen.x, starScreen.y);
          ctx.quadraticCurveTo(ctrl.x, ctrl.y, pScr.x, pScr.y);
          ctx.strokeStyle = dir === 1
            ? (hasApproval ? `rgba(253, 224, 71, ${0.74 * dimFactor})` : `rgba(255, 248, 210, ${0.58 * dimFactor})`)
            : hexAlpha(p.palette[0], 0.64 * dimFactor);
          ctx.lineWidth = isFocused ? 2.0 : 1.4;
          ctx.lineCap = 'round';
          ctx.setLineDash([6, 14]);
          ctx.lineDashOffset = -dir * state.time * (state.burstMode ? 110 : 56);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }
    ctx.restore();
  }

  function drawPacketsAndRipples(starScreen, planetMap) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (const pkt of state.packets) {
      const pItem = planetMap.get(pkt.planetId);
      if (!pItem) continue;
      const pScr = pItem.screen;
      const from = pkt.dir === 1 ? starScreen : pScr;
      const to = pkt.dir === 1 ? pScr : starScreen;
      const ctrl = getConduitControlPoint(starScreen, pScr, pkt.dir);

      const head = quadraticBezier(from, ctrl, to, pkt.t);
      const prev = quadraticBezier(from, ctrl, to, Math.max(0, pkt.t - 0.03));
      const tail = quadraticBezier(from, ctrl, to, Math.max(0, pkt.t - pkt.tailLen));
      const mid = quadraticBezier(from, ctrl, to, Math.max(0, pkt.t - pkt.tailLen * 0.45));

      // Tapered pastel plasma wake
      const wakeGrad = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
      wakeGrad.addColorStop(0, 'rgba(0,0,0,0)');
      wakeGrad.addColorStop(0.55, hexAlpha(pkt.color, 0.50));
      wakeGrad.addColorStop(1, hexAlpha(pkt.color, 0.96));

      ctx.strokeStyle = wakeGrad;
      ctx.lineWidth = pkt.size * (pkt.bright ? 1.95 : 1.55);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tail.x, tail.y);
      ctx.quadraticCurveTo(mid.x, mid.y, head.x, head.y);
      ctx.stroke();

      // Stylized glossy glowing Data Capsule or Bubble Orb at head!
      const angle = Math.atan2(head.y - prev.y, head.x - prev.x);
      const glow = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, pkt.size * 3.4);
      glow.addColorStop(0, '#FFFFFF');
      glow.addColorStop(0.38, hexAlpha(pkt.color, 0.92));
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(head.x, head.y, pkt.size * 3.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(angle);
      ctx.fillStyle = '#FFFFFF';
      if (pkt.kind === 'capsule') {
        roundRectPath(ctx, -pkt.size * 1.4, -pkt.size * 0.62, pkt.size * 2.8, pkt.size * 1.24, pkt.size * 0.62);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, pkt.size * 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Planet <-> Moon micro-sparks
    for (const sp of state.moonSparks) {
      const pItem = planetMap.get(sp.planetId);
      if (!pItem) continue;
      const mObj = pItem.moons.find(m => m.moon.id === sp.sessionId);
      if (!mObj) continue;
      const from = sp.dir === 1 ? pItem.screen : mObj.screen;
      const to = sp.dir === 1 ? mObj.screen : pItem.screen;
      const hx = from.x + (to.x - from.x) * sp.t;
      const hy = from.y + (to.y - from.y) * sp.t;
      const tx = from.x + (to.x - from.x) * Math.max(0, sp.t - 0.34);
      const ty = from.y + (to.y - from.y) * Math.max(0, sp.t - 0.34);

      ctx.strokeStyle = sp.color;
      ctx.lineWidth = 2.0;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(hx, hy);
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(hx, hy, 2.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Phone -> Star Uplink Command Beam
    for (const beam of state.uplinkBeams) {
      const startPt = { x: W * 0.5, y: H - 54 };
      const ctrlPt = { x: W * 0.5 + (starScreen.x - W * 0.5) * 0.35, y: (startPt.y + starScreen.y) * 0.5 };
      const head = quadraticBezier(startPt, ctrlPt, starScreen, Math.min(1, beam.t));
      const tail = quadraticBezier(startPt, ctrlPt, starScreen, Math.max(0, beam.t - 0.30));

      const g = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
      g.addColorStop(0, 'rgba(255, 255, 255, 0)');
      g.addColorStop(0.65, hexAlpha(beam.color, 0.88));
      g.addColorStop(1, '#FFFFFF');

      ctx.strokeStyle = g;
      ctx.lineWidth = 4.0;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tail.x, tail.y);
      ctx.lineTo(head.x, head.y);
      ctx.stroke();

      drawFourPointStar(head.x, head.y, 9, '#FFFFFF', 0.95);
    }

    // Arrival ripples
    for (const rip of state.ripples) {
      const s = worldToScreen(rip.x, rip.y);
      ctx.beginPath();
      ctx.arc(s.x, s.y, rip.r * state.cam.zoom, 0, Math.PI * 2);
      ctx.strokeStyle = hexAlpha(rip.color, rip.alpha);
      ctx.lineWidth = 2.0;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawPlanetLabelsOverview(planetScreens) {
    if (state.view !== 'overview') return;
    ctx.save();
    ctx.textAlign = 'center';
    for (const item of planetScreens) {
      const { planet, screen, drawR } = item;
      const y = screen.y + drawR + (planet.ring ? 21 : 19);
      const hasApproval = planet.sessions.some(s => s.status === 'approval');

      ctx.font = '700 11.5px -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", sans-serif';
      ctx.fillStyle = 'rgba(5, 8, 20, 0.82)';
      ctx.fillText(planet.shortName, screen.x, y + 1.2);
      ctx.fillStyle = hasApproval ? '#FEF08A' : 'rgba(244, 248, 255, 0.94)';
      ctx.fillText(planet.shortName, screen.x, y);
    }
    ctx.restore();
  }

  function roundRectPath(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  /* =========================================================
     8. FLOATING NON-OVERLAPPING MOON TAGS (PLANET FOCUS)
     ========================================================= */
  const moonTagEls = new Map();

  function syncMoonFloatTags(focusedItem) {
    if (state.view !== 'planet' || !focusedItem) {
      if (labelsLayer.childElementCount > 0) {
        labelsLayer.innerHTML = '';
        moonTagEls.clear();
      }
      return;
    }

    const p = focusedItem.planet;
    const activeIds = new Set(p.sessions.map(s => s.id));
    for (const [id, elNode] of moonTagEls.entries()) {
      if (!activeIds.has(id)) {
        elNode.remove();
        moonTagEls.delete(id);
      }
    }

    const placed = [];
    for (const mObj of focusedItem.moons) {
      const m = mObj.moon;
      let tag = moonTagEls.get(m.id);
      if (!tag) {
        tag = document.createElement('button');
        tag.className = 'moon-float-tag';
        tag.innerHTML = `<span class="orb-status"><span class="core"></span><span class="arc"></span></span><span class="label-text"></span>`;
        tag.addEventListener('click', (e) => {
          e.stopPropagation();
          openSession(p.id, m.id);
        });
        labelsLayer.appendChild(tag);
        moonTagEls.set(m.id, tag);
      }

      tag.classList.toggle('approval', m.status === 'approval');
      tag.classList.toggle('highlighted', state.highlightedSessionId === m.id);
      const statusEl = tag.querySelector('.orb-status');
      statusEl.className = `orb-status ${m.status}`;
      statusEl.style.setProperty('--status-color', p.color);
      tag.querySelector('.label-text').textContent = m.title;

      const dx = mObj.screen.x - focusedItem.screen.x;
      const dy = mObj.screen.y - focusedItem.screen.y;
      const d = Math.hypot(dx, dy) || 1;
      let tx = mObj.screen.x + (dx / d) * 24;
      let ty = mObj.screen.y + (dy / d) * 22 - (dy < 0 ? 10 : -10);

      tx = Math.max(80, Math.min(W - 80, tx));
      ty = Math.max(116, Math.min(H * 0.456, ty));

      for (const prev of placed) {
        if (Math.abs(tx - prev.x) < 134 && Math.abs(ty - prev.y) < 32) {
          ty = ty >= prev.y ? prev.y + 33 : prev.y - 33;
          ty = Math.max(116, Math.min(H * 0.456, ty));
        }
      }
      placed.push({ x: tx, y: ty });

      tag.style.left = `${tx}px`;
      tag.style.top = `${ty}px`;
      tag.style.opacity = mObj.world.z < -0.45 ? '0.86' : '1';
    }
  }

  /* =========================================================
     9. MAIN 60FPS ANIMATION LOOP
     ========================================================= */
  let lastTs = performance.now();
  let lastRenderPlanets = [];
  let packetAccumulator = 0;

  function tick(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    state.time += dt;

    const targetSpeedScale = state.isTouchingCosmos
      ? 0.14
      : state.view === 'overview'
        ? 1.0
        : 0.22;
    state.orbitScaleTime += (targetSpeedScale - state.orbitScaleTime) * Math.min(1, dt * 6);

    const camTarget = computeCameraTarget();
    const camLerp = 1 - Math.exp(-dt * 6.8);
    state.cam.x += (camTarget.x - state.cam.x) * camLerp;
    state.cam.y += (camTarget.y - state.cam.y) * camLerp;
    state.cam.zoom += (camTarget.zoom - state.cam.zoom) * camLerp;

    const tiltLerp = 1 - Math.exp(-dt * 7);
    state.tiltX += (state.targetTiltX - state.tiltX) * tiltLerp;
    state.tiltY += (state.targetTiltY - state.tiltY) * tiltLerp;

    state.starFlare = Math.max(0, state.starFlare - dt * 1.45);
    if (state.warpProgress > 0) state.warpProgress = Math.max(0, state.warpProgress - dt * 1.75);

    const host = currentHost();
    for (const p of host.planets) {
      p.angle += p.orbitSpeed * dt * state.orbitScaleTime;
      for (const m of p.sessions) {
        const mBoost = m.status === 'running' ? 1.25 : m.status === 'approval' ? 0.65 : 0.72;
        m.angle += m.speed * mBoost * dt * (state.view === 'planet' ? 0.25 : 0.9);
      }
    }

    packetAccumulator += dt * (state.burstMode ? 4.4 : 1.35);
    if (packetAccumulator >= 0.14) {
      packetAccumulator = 0;
      for (const p of host.planets) {
        const runningSessions = p.sessions.filter(s => s.status === 'running');
        const approval = p.sessions.some(s => s.status === 'approval');
        if (state.burstMode || (runningSessions.length > 0 && Math.random() < 0.44 + runningSessions.length * 0.18)) {
          const dir = Math.random() < 0.38 ? 1 : -1;
          spawnDataPacket(p, dir, {
            speed: state.burstMode ? 0.84 + Math.random() * 0.28 : 0.46 + Math.random() * 0.28,
            size: dir === 1 ? 3.4 : 3.0
          });
          if (runningSessions.length > 0 && Math.random() < 0.55) {
            const targetM = runningSessions[Math.floor(Math.random() * runningSessions.length)];
            spawnMoonSpark(p.id, targetM.id, dir, dir === 1 ? '#FFE484' : p.palette[0]);
          }
        } else if (approval && Math.random() < 0.22) {
          spawnDataPacket(p, -1, { speed: 0.36, size: 3.0 });
        }
      }
    }

    for (let i = state.packets.length - 1; i >= 0; i--) {
      const pkt = state.packets[i];
      pkt.t += pkt.speed * dt;
      if (pkt.t >= 1) {
        const p = host.planets.find(x => x.id === pkt.planetId);
        if (p) {
          if (pkt.dir === 1) {
            const pPos = planetWorldPos(p);
            spawnRipple(pPos.x, pPos.y, pkt.bright ? '#fde68a' : p.color, pkt.bright ? 38 : 26);
            const activeM = p.sessions.find(s => s.id === pkt.targetSessionId) || p.sessions.find(s => s.status === 'running');
            if (activeM) spawnMoonSpark(p.id, activeM.id, 1, '#FFF3C4');
          } else {
            state.starFlare = Math.min(1.25, state.starFlare + 0.09);
          }
        }
        state.packets.splice(i, 1);
      }
    }

    for (let i = state.moonSparks.length - 1; i >= 0; i--) {
      state.moonSparks[i].t += state.moonSparks[i].speed * dt;
      if (state.moonSparks[i].t >= 1) state.moonSparks.splice(i, 1);
    }

    for (let i = state.uplinkBeams.length - 1; i >= 0; i--) {
      const b = state.uplinkBeams[i];
      b.t += b.speed * dt;
      if (b.t >= 0.96 && !b.dispatched) {
        b.dispatched = true;
        state.starFlare = Math.min(1.5, state.starFlare + 1.05);
        spawnRipple(0, 0, b.color, 56);
        const p = host.planets.find(x => x.id === b.planetId);
        if (p) {
          for (let k = 0; k < 5; k++) {
            setTimeout(() => {
              spawnDataPacket(p, 1, {
                speed: 1.06 + k * 0.08,
                size: 3.8,
                tailLen: 0.24,
                bright: true,
                targetSessionId: b.sessionId
              });
            }, k * 55);
          }
        }
      }
      if (b.t >= 1.32) state.uplinkBeams.splice(i, 1);
    }

    for (let i = state.ripples.length - 1; i >= 0; i--) {
      const r = state.ripples[i];
      r.r += (r.maxR - r.r) * Math.min(1, dt * 5.2) + dt * 16;
      r.alpha -= dt * 1.45;
      if (r.alpha <= 0.01) state.ripples.splice(i, 1);
    }

    // ---- RENDER ----
    ctx.save();
    ctx.scale(DPR, DPR);

    drawStarfield();

    const starScreen = worldToScreen(0, 0);
    drawOrbits(starScreen);

    const planetScreens = [];
    const planetMap = new Map();
    for (const p of host.planets) {
      const pWorld = planetWorldPos(p);
      const pScr = worldToScreen(pWorld.x, pWorld.y);
      const depthScale = 0.88 + (pWorld.z + 1) * 0.12;
      const isFocused = state.view !== 'overview' && state.selectedPlanetId === p.id;
      const drawR = p.radius * depthScale * state.cam.zoom * (isFocused ? 1.15 : 1.0);

      const moons = p.sessions.map(m => {
        const mWorld = moonWorldPos(p, pWorld, m, isFocused);
        return { moon: m, world: mWorld, screen: worldToScreen(mWorld.x, mWorld.y) };
      });

      const entry = { planet: p, world: pWorld, screen: pScr, drawR, focusExpand: isFocused, moons };
      planetScreens.push(entry);
      planetMap.set(p.id, entry);
    }
    lastRenderPlanets = planetScreens;

    drawFluxConduits(starScreen, planetScreens);

    const renderQueue = [
      { kind: 'star', z: 0 },
      ...planetScreens.map(item => ({ kind: 'planet', z: item.world.z, item }))
    ].sort((a, b) => a.z - b.z);

    for (const node of renderQueue) {
      if (node.kind === 'star') {
        drawCartoonStar(starScreen);
      } else {
        const { planet, screen, drawR, focusExpand, moons } = node.item;
        drawMoonOrbitRings(screen, planet, focusExpand);

        for (const mObj of moons.filter(m => m.world.z < 0).sort((a, b) => a.world.z - b.world.z)) {
          drawSingleCartoonMoon(mObj.screen, screen, planet, mObj.moon, focusExpand, drawR);
        }
        drawCartoonRingHalf(screen, planet, drawR, false);
        drawCartoonPlanet(screen, starScreen, planet, drawR);
        drawCartoonRingHalf(screen, planet, drawR, true);
        for (const mObj of moons.filter(m => m.world.z >= 0).sort((a, b) => a.world.z - b.world.z)) {
          drawSingleCartoonMoon(mObj.screen, screen, planet, mObj.moon, focusExpand, drawR);
        }
      }
    }

    drawPacketsAndRipples(starScreen, planetMap);
    drawPlanetLabelsOverview(planetScreens);

    ctx.restore();

    const focusedItem = state.selectedPlanetId ? planetMap.get(state.selectedPlanetId) : null;
    syncMoonFloatTags(focusedItem);

    requestAnimationFrame(tick);
  }

  /* =========================================================
     10. TOUCH & POINTER INTERACTION
     ========================================================= */
  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const pt = canvasCoords(e);
    state.pointerDown = true;
    state.pointerMoved = false;
    state.isTouchingCosmos = true;
    state.pointerStart = pt;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.pointerDown) return;
    const pt = canvasCoords(e);
    const dx = pt.x - state.pointerStart.x;
    const dy = pt.y - state.pointerStart.y;
    if (Math.hypot(dx, dy) > 7) state.pointerMoved = true;
    if (state.pointerMoved) {
      state.targetTiltX = Math.max(-0.85, Math.min(0.85, state.targetTiltX + dx * 0.0042));
      state.targetTiltY = Math.max(-0.85, Math.min(0.85, state.targetTiltY + dy * 0.0042));
      state.pointerStart = pt;
    }
  });

  canvas.addEventListener('pointerup', (e) => {
    if (!state.pointerDown) return;
    const pt = canvasCoords(e);
    state.pointerDown = false;
    state.isTouchingCosmos = false;
    if (!state.pointerMoved) handleCosmosTap(pt.x, pt.y);
  });

  canvas.addEventListener('pointercancel', () => {
    state.pointerDown = false;
    state.isTouchingCosmos = false;
  });

  function handleCosmosTap(x, y) {
    if (state.view === 'session') { openPlanet(state.selectedPlanetId); return; }
    if (state.view === 'planet') {
      const focused = lastRenderPlanets.find(item => item.planet.id === state.selectedPlanetId);
      if (focused) {
        let bestMoon = null;
        let bestDist = 38;
        for (const mObj of focused.moons) {
          const d = Math.hypot(x - mObj.screen.x, y - mObj.screen.y);
          if (d < bestDist) { bestDist = d; bestMoon = mObj.moon; }
        }
        if (bestMoon) { openSession(focused.planet.id, bestMoon.id); return; }
      }
      const starScr = worldToScreen(0, 0);
      if (Math.hypot(x - starScr.x, y - starScr.y) < 44) { goOverview(); return; }
      return;
    }

    let hitPlanet = null;
    let bestD = 44;
    for (const item of lastRenderPlanets) {
      const d = Math.hypot(x - item.screen.x, y - item.screen.y);
      const threshold = Math.max(38, item.drawR + 18);
      if (d < threshold && d < bestD) { bestD = d; hitPlanet = item.planet; }
    }
    if (hitPlanet) { openPlanet(hitPlanet.id); return; }

    const starScr = worldToScreen(0, 0);
    if (Math.hypot(x - starScr.x, y - starScr.y) < 46) openHostModal();
  }

  function renderDock() {
