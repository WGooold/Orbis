<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbis 环港</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone screen; the canvas is the world (ring port + orbiting fleets), glass HUD floats over it. Single dark look by choice. */
:root{
  --void:#04060a;
  --ink:#e9eef6;
  --mute:#94a0b4;
  --faint:#5d677a;
  --line:rgba(190,210,255,.14);
  --glass:rgba(9,13,21,.56);
  --glass-hi:rgba(14,19,29,.80);
  --amber:#ffb547;
  --go:#72e4a7;
  --idle:#7f8a9e;
  --display:'Saira Semi Condensed','DIN Condensed','Arial Narrow',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --body:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
  --top:58px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#0d131d 0%,var(--void) 60%);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:16px}
.phone{position:relative;height:min(844px,calc(100% - 40px));aspect-ratio:390/844;max-width:100%;border-radius:56px;padding:11px;background:#07090d;box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 2px #1a1e26,0 50px 140px rgba(0,0,0,.75)}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;overflow:clip;background:#000;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{font:400 11px/1 var(--mono);letter-spacing:.08em;color:var(--faint)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}

.vignette{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.28) 12%,rgba(0,0,0,0) 22%),
  linear-gradient(0deg,rgba(0,0,0,.66) 0%,rgba(0,0,0,0) 24%),
  radial-gradient(130% 90% at 50% 46%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%)}
.grain{position:absolute;inset:-60px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-22px,14px)}40%{transform:translate(18px,-26px)}60%{transform:translate(-10px,30px)}80%{transform:translate(26px,8px)}100%{transform:translate(0,0)}}

/* status bar (framed preview only) */
.sbar{position:absolute;inset:0 0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 38px;font:600 15px/1 -apple-system,'SF Pro Text',var(--body);z-index:10;pointer-events:none}
.island{position:absolute;left:50%;top:11px;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000}
.sicons{display:flex;gap:6px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:var(--ink);border-radius:1px}
.bat{width:24px;height:11px;border:1.4px solid rgba(233,238,246,.5);border-radius:3.5px;padding:1px;position:relative}.bat::after{content:"";position:absolute;right:-3.5px;top:3px;width:1.6px;height:4px;border-radius:0 1px 1px 0;background:rgba(233,238,246,.5)}.bat i{display:block;height:100%;width:78%;background:var(--ink);border-radius:1.5px}

/* top HUD */
.hud{position:absolute;left:0;right:0;top:var(--top);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));z-index:4;pointer-events:none;transition:opacity .4s var(--ease),transform .5s var(--ease)}
.hud>*{pointer-events:auto}
.host{display:flex;align-items:center;gap:10px;min-width:0}
.host svg{flex:none}
.host b{display:block;font:600 17px/1.1 var(--display);letter-spacing:.02em}
.host{text-shadow:0 1px 12px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
.host small{display:block;margin-top:4px;font:500 10.5px/1 var(--mono);color:#c3ccda;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.host small i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go);margin-right:6px;vertical-align:1px}
.alert{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:16px;background:rgba(255,181,71,.13);border:1px solid rgba(255,181,71,.38);color:var(--amber);font:500 12px/1 var(--mono);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
.alert i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:beat 1.4s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,181,71,.7)}100%{box-shadow:0 0 0 9px rgba(255,181,71,0)}}

/* bottom fleet rail */
.rail{position:absolute;left:0;right:0;bottom:0;padding:0 0 calc(22px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:10px;z-index:4;transition:transform .5s var(--ease),opacity .35s}
.rail.away{transform:translateY(120%);opacity:0;pointer-events:none}
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 4px max(16px,env(safe-area-inset-left,0px));scroll-padding-left:16px;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:8px;row-gap:5px;align-items:center;padding:8px 12px 8px 8px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);transition:background .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip img{grid-row:1/3;width:46px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.chip b{font:600 13px/1 var(--display);letter-spacing:.03em;color:var(--c);white-space:nowrap}
.chip b em{font:500 11px/1 var(--mono);font-style:normal;color:var(--mute);margin-left:6px}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.dots i[data-s=run]{background:var(--go);box-shadow:0 0 6px var(--go)}
.dots i[data-s=wait]{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.launch{flex:none;width:56px;height:56px;margin-right:max(16px,env(safe-area-inset-right,0px));border-radius:50%;display:grid;place-items:center;background:rgba(233,238,246,.92);color:#0b0f16;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 6px rgba(233,238,246,.08);transition:transform .15s}
.launch:active{transform:scale(.92)}

/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;border-radius:30px 30px 0 0;background:var(--glass-hi);border-top:1px solid var(--line);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);transform:translateY(105%);transition:transform .52s var(--ease);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(233,238,246,.22);margin:9px auto 0}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.sh-head h2{margin:0;font:700 26px/1 var(--display);letter-spacing:.01em;color:var(--c)}
.sh-head p{margin:7px 0 0;font:400 11px/1.2 var(--mono);color:var(--mute);letter-spacing:.04em}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(233,238,246,.08);flex:none}
.tally{display:flex;gap:8px;padding:14px 20px 4px}
.tally span{display:flex;align-items:baseline;gap:6px;padding:7px 10px;border-radius:10px;background:rgba(233,238,246,.05);font:400 11px/1 var(--body);color:var(--mute)}
.tally b{font:600 15px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.tally span[data-s=run] b{color:var(--go)}.tally span[data-s=wait] b{color:var(--amber)}
.list{list-style:none;margin:0;padding:6px 12px 8px;overflow-y:auto;flex:1;min-height:0}
.row{width:100%;display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px 8px;border-radius:14px;transition:background .2s}
.row:hover,.row.hl{background:rgba(233,238,246,.06)}
.row.hl{box-shadow:inset 0 0 0 1px var(--line)}
.st{width:9px;height:9px;border-radius:50%;justify-self:center;background:var(--idle)}
.st[data-s=run]{background:var(--go);box-shadow:0 0 0 3px rgba(114,228,167,.16),0 0 10px var(--go)}
.st[data-s=wait]{background:var(--amber);animation:beat 1.4s ease-out infinite}
.row b{display:block;font:500 15px/1.3 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;margin-top:4px;font:400 11px/1 var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small em{font-style:normal;color:var(--amber)}
.fuel{display:grid;gap:5px;justify-items:end;font:400 10px/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.fuel i{display:block;width:42px;height:4px;border-radius:2px;background:rgba(233,238,246,.1);overflow:hidden}
.fuel i::after{content:"";display:block;height:100%;width:var(--f);background:var(--c)}
.newbtn{margin:4px 20px 18px;height:48px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);font:600 15px/1 var(--body);display:flex;align-items:center;justify-content:center;gap:8px;background:color-mix(in srgb,var(--c) 8%,transparent)}
#fleet{height:52%}
#launchSheet{height:auto;max-height:80%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px 20px;overflow-y:auto;min-height:0}
.ship{display:grid;gap:5px;justify-items:start;padding:10px 12px;border-radius:16px;background:rgba(233,238,246,.04);border:1px solid var(--line);text-align:left;transition:background .2s,transform .15s}
.ship:hover{background:rgba(233,238,246,.08)}.ship:active{transform:scale(.97)}
.ship img{width:100%;height:46px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.ship b{font:600 14px/1 var(--display);letter-spacing:.03em;color:var(--c)}
.ship small{font:400 10.5px/1 var(--mono);color:var(--mute)}

/* session */
.sess{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(5,8,13,.72),rgba(5,8,13,.9) 40%);backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);transform:translateY(100%);transition:transform .55s var(--ease)}
.sess.on{transform:none}
.s-top{padding:calc(var(--top) - 6px) max(14px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:40px 64px 1fr;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.s-top .hero{width:64px;height:40px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));animation:hover 5s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-2px) rotate(-1deg)}}
.s-top h3{margin:0;font:600 16px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-top p{margin:3px 0 0;display:flex;gap:8px;align-items:center;font:400 11px/1 var(--mono);color:var(--mute);white-space:nowrap}
.s-top p b{font-weight:500;color:var(--c)}
.s-top p .st{flex:none;width:7px;height:7px}
.log{flex:1;min-height:0;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.m-u{align-self:flex-end;max-width:82%;padding:10px 14px;border-radius:18px 18px 6px 18px;background:rgba(233,238,246,.12);font:400 14.5px/1.5 var(--body)}
.m-a{max-width:92%;font:400 14.5px/1.6 var(--body);color:#d8dfea}
.m-a code,.tool code{font:400 12px/1.5 var(--mono)}
.tool{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);font:400 12px/1.4 var(--mono);color:var(--mute)}
.tool b{color:var(--c);font-weight:500}
.tool code{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tool .ok{color:var(--go)}
.tool .spin{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(233,238,246,.2);border-top-color:var(--go);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.typing{display:flex;gap:4px;padding:6px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:ty 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ask{margin:0 12px 10px;padding:14px;border-radius:18px;background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.32)}
.ask header{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--amber)}
.ask header i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:beat 1.4s ease-out infinite}
.ask pre{margin:10px 0 12px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.45);font:400 12px/1.5 var(--mono);color:var(--ink);white-space:pre-wrap;word-break:break-all}
.ask div{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.ask button{height:44px;border-radius:12px;font:600 15px/1 var(--body)}
.deny{background:rgba(233,238,246,.08)}
.allow{background:var(--amber);color:#1b1205}
.comp{display:flex;gap:8px;align-items:flex-end;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.comp textarea{flex:1;min-width:0;resize:none;height:46px;max-height:120px;padding:12px 16px;border-radius:23px;border:1px solid var(--line);background:rgba(233,238,246,.06);color:var(--ink);font:400 15px/1.4 var(--body)}
.comp textarea::placeholder{color:var(--faint)}
.send{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c);color:#0b0f16;transition:opacity .2s,transform .15s}
.send:disabled{opacity:.3}
.send:active{transform:scale(.92)}

.toast{position:absolute;left:50%;top:calc(var(--top) + 52px);z-index:9;transform:translate(-50%,-10px);opacity:0;padding:9px 14px;border-radius:14px;background:var(--glass-hi);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font:500 13px/1.2 var(--body);white-space:nowrap;transition:opacity .3s,transform .4s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:520px){
  .stage{padding:0;gap:0}
  .phone{height:100%;width:100%;aspect-ratio:auto;padding:0;border-radius:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .sbar,.hint{display:none}
  :root{--top:calc(env(safe-area-inset-top,0px) + 14px)}
}
@media (max-height:620px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){.grain{animation:none}.alert i,.st[data-s=wait],.ask header i{animation:none}.s-top .hero{animation:none}}
</style>

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen">
      <canvas id="scene" aria-label="环港：Agent 舰队绕电脑运行"></canvas>
      <div class="vignette"></div>
      <div class="grain" id="grain"></div>

      <div class="sbar" aria-hidden="true"><span>9:41</span><div class="island"></div>
        <span class="sicons"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
        <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .6 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7 7 0 0 0 8 3.9a7 7 0 0 0-4.8 1.8l1.1 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.3c.6 0 1.1.2 1.5.6L8 11 6.5 9.4c.4-.4.9-.6 1.5-.6Z" fill="#e9eef6"/></svg>
        <span class="bat"><i></i></span></span>
      </div>

      <header class="hud" id="hud">
        <div class="host">
          <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><ellipse cx="15" cy="15" rx="12.5" ry="7" transform="rotate(-28 15 15)" fill="none" stroke="#e9eef6" stroke-width="1.6"/><ellipse cx="15" cy="15" rx="8" ry="4.2" transform="rotate(-28 15 15)" fill="none" stroke="#e9eef6" stroke-opacity=".45" stroke-width="1.2"/><circle cx="15" cy="15" r="2" fill="#e9eef6"/></svg>
          <div><b>MacBook Pro</b><small><i></i><span id="hostSub">在轨 12 · 18 ms</span></small></div>
        </div>
        <button class="alert" id="alert" type="button" hidden><i></i><span id="alertN">2 待批准</span></button>
      </header>

      <nav class="rail" id="rail" aria-label="舰队">
        <div class="chips" id="chips"></div>
        <button class="launch" id="launchBtn" type="button" aria-label="新会话"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 3v16M3 11h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </nav>

      <section class="sheet" id="fleet" aria-label="舰队详情"></section>
      <section class="sheet" id="launchSheet" aria-label="新会话">
        <div class="grab"></div>
        <div class="sh-head" style="--c:var(--ink)"><div><h2>出港</h2></div>
          <button class="x" type="button" data-close aria-label="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
        <div class="grid" id="shipGrid"></div>
      </section>
      <section class="sess" id="sess" aria-label="会话"></section>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
  <div class="hint">点舰船查看 · 拖动转动轨道 · 滚轮或双指缩放</div>
</div>

<script>
(()=>{
'use strict';
const A='orbital-port/';
const W=1220,H=2152,HUB={x:646,y:1046},F=1600;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const TAU=Math.PI*2;

/* Agent fleets: hull art, ink (UI) and engine (glow) colours, sprite size in station-image px, engine anchor, orbit shell */
const AG={
  claude:  {name:'Claude Code', hull:'白灰分段装甲', ink:'#f0b48c',eng:'#ff9550',file:'claude-code', size:250,ex:.985,ey:.47, o:{R:470,pitch:.30,roll:-.42,w:.050,th:.55}},
  codex:   {name:'Codex',       hull:'折叠云壳',     ink:'#77d6c7',eng:'#38f0da',file:'codex',       size:205,ex:.93, ey:.60, o:{R:350,pitch:.44,roll:-.28,w:.066,th:2.5}},
  deepseek:{name:'DeepSeek',    hull:'银蓝流线双翼', ink:'#a9bbff',eng:'#5a7dff',file:'deepseek',    size:235,ex:.975,ey:.42, o:{R:575,pitch:.22,roll:-.52,w:.041,th:4.1}},

/* projection */
function proj(f,th,R,y0){
  const x=R*Math.cos(th),z=R*Math.sin(th),y=y0;

  const y1=y*cp-z*sp,z1=y*sp+z*cp;
  const cr=Math.cos(f.roll),sr=Math.sin(f.roll);
  const k=F/(F+z1);
  return{x:f.cx+(x*cr-y1*sr)*k,y:f.cy+(x*sr+y1*cr)*k,z:z1,s:k};
}

      out.push({s,a,ag,img,x:p.x,y:p.y,z:p.z,ps:p.s,w,h,kf,rot,sx,gx,gy,lead:i===0,front,ux:dx,uy:dy});
    });
  }

}

function update(dt){

function draw(){

    ctx.globalAlpha=1;
  }
  if(S.sel&&S.view!=='launch'){const sh=SHIPS.find(x=>x.s.id===S.sel);if(sh){const [x,y]=toS(sh.x,sh.y);const hw=Math.max(sh.w*sh.kf*sc*.5,22)+10+2*Math.sin(S.t*3),hh=Math.max(sh.h*sc*.5,16)+10+2*Math.sin(S.t*3);const L=11;
    ctx.strokeStyle=sh.ag.ink;ctx.lineWidth=1.5;ctx.globalAlpha=.9;ctx.beginPath();
    for(const [ax,ay] of [[-1,-1],[1,-1],[1,1],[-1,1]]){const px=x+ax*hw,py=y+ay*hh;ctx.moveTo(px-ax*L,py);ctx.lineTo(px,py);ctx.lineTo(px,py-ay*L)}
    ctx.stroke();ctx.globalAlpha=1}}
  // dust
  ctx.globalCompositeOperation='lighter';
  for(const d of DUST){let x=((d.x-S.cam.x/W*d.d*.6)%1+1)%1*vw,y=((d.y-S.cam.y/H*d.d*.35)%1+1)%1*vh;const r=d.r*(1+d.d)*2.2;ctx.globalAlpha=d.a*(.6+.4*Math.sin(S.t*.8+d.x*20));ctx.drawImage(glow('#dfe9ff'),x-r,y-r,2*r,2*r)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function tickDust(dt){for(const d of DUST){d.x+=d.v*dt*.4;d.y-=d.v*dt*.25}}

let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);tickDust(dt);draw();requestAnimationFrame(frame)}

/* hit test */
function hit(px,py){
  const sc=base()*S.cam.z;const list=SHIPS.slice().sort((a,b)=>a.z-b.z);let best=null,bd=1e9;
  for(const sh of list){if(S.t<sh.s.warp+.6)continue;const x=(sh.x-S.cam.x)*sc+vw/2,y=(sh.y-S.cam.y)*sc+vh/2;
    const vis=sh.front||sh.z<-70||frontAlpha(sh)>.5||!occluded(sh.x,sh.y);if(!vis)continue;
    const rx=Math.max(sh.w*sh.kf*sc*.5,20)+8,ry=Math.max(sh.h*sc*.5,20)+8;const d=((px-x)/rx)**2+((py-y)/ry)**2;if(d<1&&d<bd){bd=d;best=sh}}
  return best;
}

/* pointer: drag spins the orbits, pinch / wheel zooms, tap selects */
const ptrs=new Map();let pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)S.drag={x0:e.clientX,y0:e.clientY,lx:e.clientX,lt:performance.now(),moved:false};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:S.zoomU};S.drag=null}});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&!ptrs.size){const r=screen.getBoundingClientRect();S.par.x=((e.clientX-r.left)/r.width-.5)*-30;S.par.y=((e.clientY-r.top)/r.height-.5)*-30}
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];if(!S.focus)S.zoomU=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,1,2.3);return}
  const d=S.drag;if(!d)return;if(Math.abs(e.clientX-d.x0)+Math.abs(e.clientY-d.y0)>7)d.moved=true;
  if(d.moved){const now=performance.now();const dth=(e.clientX-d.lx)/vw*2.4;for(const a in FLEETS){FLEETS[a].tw=null;FLEETS[a].th+=dth}const dtt=Math.max(.008,(now-d.lt)/1000);S.spin=S.spin*.5+(dth/dtt)*.5;d.lx=e.clientX;d.lt=now}
});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  const d=S.drag;if(d&&ptrs.size===0){if(!d.moved){const r=screen.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top);S.spin=0}S.drag=null;S.spin=clamp(S.spin,-2.5,2.5)}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{if(!ptrs.size){S.par.x=0;S.par.y=0}});
cv.addEventListener('wheel',e=>{e.preventDefault();if(S.focus)return;S.zoomU=clamp(S.zoomU*Math.exp(-e.deltaY*.0015),1,2.3)},{passive:false});
function tap(x,y){
  if(S.view==='session')return;
  if(S.view==='launch'){closeLaunch();return}
  const sh=hit(x,y);
  if(sh)focusFleet(sh.a,sh.s.id);
  else if(S.focus)unfocus();
}

/* focus: the fleet swings round to the near side, camera follows the chosen ship */
function focusFleet(a,sid){
  const f=FLEETS[a];if(!f)return;const ms=members(a);const s=ms.find(m=>m.id===sid)||ms[0];
  S.focus=a;S.sel=s.id;S.view='fleet';
  const i=ms.indexOf(s),sl=slot(i);const want=-Math.PI/2+.32-sl.dt;
  let diff=((want-f.th)%TAU+TAU)%TAU;if(diff>TAU-.5)diff-=TAU;
  if(Math.abs(diff)>.06)f.tw={from:f.th,to:f.th+diff,t0:S.t,d:RM?.01:.9+Math.abs(diff)*.32};
  renderFleet();$('#fleet').classList.add('on');$('#rail').classList.add('away');closeLaunch(true);renderRail();
}
function unfocus(){S.focus=null;S.sel=null;S.view='orbit';$('#fleet').classList.remove('on');$('#rail').classList.remove('away');renderRail()}

/* time */
function age(s){const m=Math.max(0,Math.round((now()-s.born)/60000));if(m<1)return'刚刚';if(m<60)return m+' 分钟';const h=Math.floor(m/60);return h+' 小时'+(m%60?` ${m%60} 分`:'')}

/* UI: rail */
function renderRail(){
  const chips=$('#chips');const as=ORDER.filter(a=>members(a).length);
  as.sort((p,q)=>(members(q).some(s=>s.st==='wait')-members(p).some(s=>s.st==='wait')));
  chips.innerHTML=as.map(a=>{const ag=AG[a],ms=members(a);return`<button class="chip" type="button" data-a="${a}" style="--c:${ag.ink}" aria-label="${esc(ag.name)}，${ms.length} 个会话"><img src="${A}ships/${ag.file}.png" alt=""><b>${esc(ag.name)}<em>${ms.length}</em></b><span class="dots">${ms.map(s=>`<i data-s="${s.st}"></i>`).join('')}</span></button>`}).join('');
  const waits=SESS.filter(s=>s.st==='wait');$('#alert').hidden=!waits.length;$('#alertN').textContent=`${waits.length} 待批准`;
  $('#hostSub').textContent=`在轨 ${SESS.length} · 18 ms`;
}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)focusFleet(b.dataset.a)});
$('#alert').addEventListener('click',()=>{const s=SESS.find(x=>x.st==='wait');if(!s)return;focusFleet(s.a,s.id);setTimeout(()=>{if(S.sel===s.id)openSession(s.id)},RM?0:1100)});

/* UI: fleet sheet */
const X_ICON='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function renderFleet(){
  const a=S.focus;if(!a)return;const ag=AG[a],ms=members(a);const n=st=>ms.filter(s=>s.st===st).length;
  const el=$('#fleet');el.style.setProperty('--c',ag.ink);
  el.innerHTML=`<div class="grab"></div>
  <div class="sh-head"><div><h2>${esc(ag.name)}</h2><p>${esc(ag.hull)} · ${ms.length} 艘在轨</p></div><button class="x" type="button" data-close aria-label="关闭">${X_ICON}</button></div>
  <div class="tally"><span data-s="run"><b>${n('run')}</b>运行中</span><span data-s="wait"><b>${n('wait')}</b>待批准</span><span><b>${n('idle')}</b>空闲</span></div>
  <ul class="list">${ms.map(s=>`<li><button class="row${s.id===S.sel?' hl':''}" type="button" data-s="${s.id}">
    <span class="st" data-s="${s.st}"></span>
    <span style="min-width:0"><b>${esc(s.title)}</b><small>${s.st==='wait'?'<em>待批准</em> · ':''}${esc(s.path)} · ${age(s)}</small></span>
    <span class="fuel" style="--f:${Math.round(s.ctx*100)}%"><i></i>${Math.round(s.ctx*100)}%</span></button></li>`).join('')}</ul>
  <button class="newbtn" type="button" data-new="${a}"><svg width="14" height="14" viewBox="0 0 22 22"><path d="M11 3v16M3 11h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>新会话</button>`;
}
$('#fleet').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){unfocus();return}
  const r=e.target.closest('.row');if(r){const id=r.dataset.s;if(S.sel!==id){focusFleet(S.focus,id);setTimeout(()=>openSession(id),RM?0:420)}else openSession(id);return}
  const n=e.target.closest('[data-new]');if(n)launch(n.dataset.new);
});

/* UI: session */
let OPEN=null;
function msgHTML(m,ag){
  if(m.u)return`<div class="m-u">${esc(m.u)}</div>`;
  if(m.a)return`<div class="m-a">${esc(m.a)}</div>`;
  if(m.typing)return`<div class="typing"><i></i><i></i><i></i></div>`;
  if(m.t)return`<div class="tool"><b>${esc(m.t)}</b><code>${esc(m.c)}</code>${m.ok?'<span class="ok">✓</span>':'<span class="spin"></span>'}</div>`;
  return'';
}
function renderSession(){
  const s=SESS.find(x=>x.id===OPEN);if(!s)return;const ag=AG[s.a];const el=$('#sess');el.style.setProperty('--c',ag.ink);
  el.innerHTML=`<div class="s-top"><button class="back" type="button" data-back aria-label="返回"><svg width="11" height="18" viewBox="0 0 11 18"><path d="M9.5 1.5 2 9l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <img class="hero" src="${A}ships/${ag.file}.png" alt="">
    <div style="min-width:0"><h3>${esc(s.title)}</h3><p><b>${esc(ag.name)}</b><span class="st" data-s="${s.st}"></span>${WORD[s.st]} · ${esc(s.path)}</p></div></div>
  <div class="log" id="log">${s.msgs.map(m=>msgHTML(m,ag)).join('')}</div>
  ${s.st==='wait'?`<div class="ask"><header><i></i>需要批准</header><pre>${esc(s.ask)}</pre><div><button class="deny" type="button" data-deny>拒绝</button><button class="allow" type="button" data-allow>允许</button></div></div>`:''}
  <form class="comp" id="comp"><textarea id="msg" rows="1" placeholder="给 ${esc(ag.name)} 发消息" aria-label="消息"></textarea><button class="send" type="submit" aria-label="发送" disabled><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 15V3M3.5 8.5 9 3l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>`;
  const log=$('#log');log.scrollTop=log.scrollHeight;
}
function openSession(id){OPEN=id;S.view='session';renderSession();$('#sess').classList.add('on')}
function closeSession(){$('#sess').classList.remove('on');S.view=S.focus?'fleet':'orbit';OPEN=null;renderFleet()}
function beam(s){S.beams.push({id:s.id,t0:S.t,c:AG[s.a].eng})}
function setStatus(s,st){s.st=st;renderRail();if(S.focus)renderFleet();if(OPEN===s.id)renderSession()}
$('#sess').addEventListener('click',e=>{
  const s=SESS.find(x=>x.id===OPEN);if(!s)return;
  if(e.target.closest('[data-back]')){closeSession();return}
  if(e.target.closest('[data-allow]')){s.msgs.push({t:'Bash',c:s.ask});s.ask=null;setStatus(s,'run');beam(s);toast(`已允许 · ${AG[s.a].name} 继续执行`);
    setTimeout(()=>{const last=s.msgs[s.msgs.length-1];if(last&&last.t){last.ok=1;s.msgs.push({a:'命令执行完成，结果正常，继续下一步。'});if(OPEN===s.id)renderSession()}},2600);return}
  if(e.target.closest('[data-deny]')){s.ask=null;s.msgs.push({a:'好的，跳过这一步。需要时再告诉我。'});setStatus(s,'idle');toast('已拒绝');return}
});
$('#sess').addEventListener('input',e=>{if(e.target.id==='msg'){const b=$('#comp .send');b.disabled=!e.target.value.trim();e.target.style.height='46px';e.target.style.height=Math.min(120,e.target.scrollHeight+2)+'px'}});
$('#sess').addEventListener('keydown',e=>{if(e.target.id==='msg'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#comp').requestSubmit()}});
$('#sess').addEventListener('submit',e=>{e.preventDefault();const s=SESS.find(x=>x.id===OPEN);const v=$('#msg').value.trim();if(!s||!v)return;
  s.msgs.push({u:v});const ty={typing:1};s.msgs.push(ty);setStatus(s,s.st==='wait'?'wait':'run');beam(s);
  setTimeout(()=>{const i=s.msgs.indexOf(ty);if(i>=0)s.msgs.splice(i,1,{a:'收到，按这个方向调整。我先改实现，再补对应测试。'});if(OPEN===s.id)renderSession()},1300)});

/* UI: launch */
function renderGrid(){$('#shipGrid').innerHTML=ORDER.map(a=>{const ag=AG[a];return`<button class="ship" type="button" data-a="${a}" style="--c:${ag.ink}"><img src="${A}ships/${ag.file}.png" alt=""><b>${esc(ag.name)}</b><small>${esc(ag.hull)}</small></button>`}).join('')}
function openLaunch(){if(S.focus)unfocus();S.view='launch';$('#launchSheet').classList.add('on');$('#rail').classList.add('away')}
function closeLaunch(keep){$('#launchSheet').classList.remove('on');if(!keep){S.view=S.focus?'fleet':'orbit';if(!S.focus)$('#rail').classList.remove('away')}}
$('#launchBtn').addEventListener('click',openLaunch);
$('#launchSheet').addEventListener('click',e=>{if(e.target.closest('[data-close]')){closeLaunch();return}const b=e.target.closest('.ship');if(b)launch(b.dataset.a)});
function launch(a){
  const f=fleetOf(a);const fresh=!members(a).length;
  if(fresh){f.th=-Math.PI/2+.5-f.w*2}
  const s=mk(a,'新会话','orbis','run',.02,0,{msgs:[]});s.warp=0;s.spawn=S.t;SESS.push(s);
  S.flashes.push({x:HUB.x,y:HUB.y,t0:S.t,c:AG[a].eng});
  closeLaunch(true);if(S.focus)unfocus();S.view='orbit';$('#rail').classList.remove('away');renderRail();
  toast(`${AG[a].name} 已出港`);
  setTimeout(()=>{focusFleet(a,s.id);setTimeout(()=>openSession(s.id),RM?0:700)},RM?0:1900);
}

/* toast */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* live: running sessions occasionally ask for approval */
setInterval(()=>{const waits=SESS.filter(s=>s.st==='wait').length;if(waits>=3)return;const c=SESS.filter(s=>s.st==='run'&&s.id!==OPEN&&s.spawn==null);if(!c.length)return;const s=c[Math.random()*c.length|0];s.ask=ASKS[Math.random()*ASKS.length|0];s.msgs.push({a:'下一步需要执行一条命令，等你确认。'});setStatus(s,'wait')},26000);
setInterval(()=>{if(S.focus&&S.view==='fleet')renderFleet()},30000);

document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.view==='session')closeSession();else if(S.view==='launch')closeLaunch();else if(S.focus)unfocus()});

renderRail();renderGrid();
/* shareable start states: #still #fleet #session #launch */
const H0=location.hash.slice(1);
if(H0){S.intro=99;SESS.forEach(s=>s.warp=-2)}
ready.then(()=>{buildMaps();
  if(H0==='fleet')focusFleet('claude');
  if(H0==='session'){const s=SESS.find(x=>x.st==='wait');focusFleet(s.a,s.id);openSession(s.id)}
  if(H0==='launch')openLaunch();
  requestAnimationFrame(t=>{last=t;frame(t)})});
})();
</script>
