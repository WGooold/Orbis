<body>
<canvas id="scene" aria-label="可旋转查看的深空飞船三维模型"></canvas>
<div id="loading"><div>构建深空载舰 <div class="loadline"></div></div></div>
<div class="hud">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><p class="eyebrow">ORBITAL PORT · VESSEL 01</p><h1 class="title">深空载舰 / 结构推演</h1><p class="sub">MODULAR CARRIER · EXTERIOR STUDY</p></div></div>
    <div class="actions"><button class="action" id="auto" type="button" aria-pressed="false"><span class="icon">⟳</span>自动环绕</button><button class="action" id="reset" type="button"><span class="icon">⌖</span>重置视角</button></div>
  </header>
  <footer class="bottom"><p class="hint">拖动旋转 <span style="color:#bd8cff">·</span> 滚轮缩放</p><div class="readout"><div><strong>REFERENCE STUDY</strong><span class="rule"></span>01 / 01</div><div>ARMOR · ENERGY BRIDGE · DRIVE ARRAY</div></div></footer>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const canvas=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#05060b');
scene.fog=new THREE.FogExp2('#05060b',.0015);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,180);
const initialCamera=new THREE.Vector3(22,-10,28);
camera.position.copy(initialCamera);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.14;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const controls=new OrbitControls(camera,canvas);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=.055;
controls.minDistance=15;controls.maxDistance=58;controls.minPolarAngle=.38;controls.maxPolarAngle=2.78;
controls.autoRotate=false;controls.autoRotateSpeed=.48;

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.72,.62,.72));
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x9aa9d5,0x17131f,1.55));
const key=new THREE.DirectionalLight(0xdce4ff,3.7);key.position.set(-12,18,16);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-24;key.shadow.camera.right=24;key.shadow.camera.top=24;key.shadow.camera.bottom=-24;key.shadow.bias=-.00015;scene.add(key);
const cool=new THREE.DirectionalLight(0x8298ff,2.2);cool.position.set(14,7,-15);scene.add(cool);
const under=new THREE.PointLight(0x9561ff,26,36,2);under.position.set(-2,-3,0);scene.add(under);
const edgeLight=new THREE.PointLight(0xd1c3ff,38,46,2);edgeLight.position.set(3,7,10);scene.add(edgeLight);

const mat=(color,roughness=.38,metalness=.56,extra={})=>new THREE.MeshStandardMaterial({color,roughness,metalness,...extra});
const hull=mat('#b9b9c8',.31,.72);
const hullLight=mat('#d8d6e0',.29,.68);
const hullShadow=mat('#777989',.38,.72);
const graphite=mat('#171a24',.34,.78);
const dark=mat('#090c13',.25,.68);
const black=mat('#05070c',.2,.48);
const violet=mat('#a775ff',.26,.4,{emissive:'#7e35ed',emissiveIntensity:2.4});
const cold=mat('#d4e0ff',.22,.35,{emissive:'#97b7ff',emissiveIntensity:2.2});
const warm=mat('#f6cba0',.24,.42,{emissive:'#ffc37d',emissiveIntensity:1.15});
const trimMat=mat('#454957',.3,.82);
const ship=new THREE.Group();scene.add(ship);
const animated=[];
const boxGeo=new THREE.BoxGeometry(1,1,1);
function addBox(parent,material,size,pos,rot=0,cast=true){const mesh=new THREE.Mesh(boxGeo,material);mesh.scale.set(size[0],size[1],size[2]);mesh.position.set(pos[0],pos[1],pos[2]);mesh.rotation.y=rot;mesh.castShadow=cast;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function bevelShape(points,height,bevel=.18){const s=new THREE.Shape();points.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:height,bevelEnabled:bevel>0,bevelSegments:3,steps:1,bevelSize:bevel,bevelThickness:Math.min(bevel,height*.2),curveSegments:1});g.rotateX(Math.PI/2);g.translate(0,height/2,0);g.computeVertexNormals();return g}
function addShape(parent,points,height,material,pos=[0,0,0],bevel=.18){const mesh=new THREE.Mesh(bevelShape(points,height,bevel),material);mesh.position.set(...pos);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function rectPoints(x1,x2,z1,z2,c=.2){return [[x1+c,z1],[x2-c,z1],[x2,z1+c],[x2,z2-c],[x2-c,z2],[x1+c,z2],[x1,z2-c],[x1,z1+c]]}
function roundedPlate(parent,w,d,h,material,x,y,z,rotation=0,c=.22){const pts=rectPoints(-w/2,w/2,-d/2,d/2,Math.min(c,w*.22,d*.22));const m=addShape(parent,pts,h,material,[x,y,z],Math.min(c,h*.22));m.rotation.y=rotation;return m}
function pointLight(color,intensity,distance,pos){const l=new THREE.PointLight(color,intensity,distance,2);l.position.set(...pos);ship.add(l);return l}

// Four interlocking, open-corner armor modules leave the rectangular flight aperture clear.
const pods=[
 {id:'NW',points:[[-10,-6.2],[-.24,-6.2],[-.24,-2.38],[-5.72,-2.38],[-5.72,-.22],[-10,-.22]],h:[[-9.35,1.1,-5.6,7.25,2.55],[-7.86,1.1,-1.27,3.1,1.78]],sx:-1,sz:-1},
 {id:'NE',points:[[.24,-6.2],[10,-6.2],[10,-.22],[5.72,-.22],[5.72,-2.38],[.24,-2.38]],h:[[5.18,1.1,-5.6,7.25,2.55],[7.86,1.1,-1.27,3.1,1.78]],sx:1,sz:-1},
 {id:'SW',points:[[-10,.22],[-5.72,.22],[-5.72,2.38],[-.24,2.38],[-.24,6.2],[-10,6.2]],h:[[-9.35,1.1,5.6,7.25,2.55],[-7.86,1.1,1.27,3.1,1.78]],sx:-1,sz:1},
 {id:'SE',points:[[5.72,.22],[10,.22],[10,6.2],[-.24,6.2],[-.24,2.38],[5.72,2.38]],h:[[5.18,1.1,5.6,7.25,2.55],[7.86,1.1,1.27,3.1,1.78]],sx:1,sz:1}
];
for(const p of pods){
 const base=p.points.map(([x,z])=>[x*1.015,z*1.03]);
 addShape(ship,base,1.65,graphite,[0,-.82,0],.2);
 addShape(ship,p.points,2.0,hull,[0,.08,0],.24);
 addShape(ship,p.points.map(([x,z])=>[x*.982,z*.98]),.2,hullShadow,[0,-.99,0],.12);
 for(const [x,y,z,w,d] of p.h){
   roundedPlate(ship,w,d,.54,hullLight,x,y,z,p.id==='NE'?.035:p.id==='SW'?-.035:0,.28);
   roundedPlate(ship,w*.78,d*.66,.2,hull,x-p.sx*.22,y+.35,z-p.sz*.08,0,.16);
   // Recessed black machinery channel under each armor cap.
   addBox(ship,graphite,[w*.86,.18,d*.13],[x,y-.36,z+p.sz*d*.38]);
   for(let i=0;i<7;i++){
     const xx=x-w*.34+i*w*.113;
     addBox(ship,i%3===0?warm:trimMat,[.055,.045,d*.105],[xx,y-.245,z+p.sz*d*.38]);
   }
   // Fine panel seams and service hatches on the pale shell.
   const seamX=x+p.sx*w*.34;
   addBox(ship,trimMat,[.035,.016,d*.72],[seamX,y+.285,z]);
   roundedPlate(ship,w*.13,d*.25,.12,hullShadow,x-p.sx*w*.27,y+.36,z-p.sz*d*.23,0,.09);
   for(let j=0;j<3;j++)addBox(ship,dark,[w*.035,.025,.06],[x-p.sx*w*.27+(j-1)*w*.055,y+.435,z-p.sz*d*.23]);
 }
 // Dark, segmented outer rim reinforces the modular silhouette.
 const outerX=p.sx*9.53,outerZ=p.sz*5.92;
 addBox(ship,black,[.2,1.2,2.5],[outerX,-.52,outerZ]);
 for(let i=0;i<4;i++)addBox(ship,trimMat,[.16,.08,.22],[outerX,-.27,outerZ-p.sz*.74+i*.48]);
}

// A raised, asymmetrical command/drive block dominates the aft side like the source image.
const stern=new THREE.Group();stern.position.set(8.05,.2,0);ship.add(stern);
roundedPlate(stern,3.8,6.35,3.15,graphite,0,-.06,0,0,.42);
roundedPlate(stern,3.25,5.72,2.38,hullShadow,.16,.74,0,0,.43);
roundedPlate(stern,2.85,5.1,1.55,hullLight,.18,1.62,0,0,.45);
// Layered armor faces, inset black gills, and spine rails.
for(const s of [-1,1]){
 roundedPlate(stern,1.0,4.35,.44,hull,s*1.23,2.56,0,s*.025,.22);
 roundedPlate(stern,.56,3.8,.2,hullLight,s*1.22,2.84,0,0,.18);
 addBox(stern,graphite,[.38,1.0,3.95],[s*1.82,1.35,0]);
 for(let i=0;i<9;i++)addBox(stern,i%3?dark:warm,[.12,.09,3.2],[s*1.7,1.82-i*.17,0]);
 addBox(stern,trimMat,[.12,2.6,5.12],[s*1.83,1.5,0]);
 for(let i=0;i<5;i++)addBox(stern,cold,[.07,.07,.34],[s*1.94,2.72,i*1.55-3.1]);
}
roundedPlate(stern,1.6,4.7,.38,dark,0,2.87,0,0,.24);
roundedPlate(stern,1.1,3.5,.18,hullLight,0,3.12,0,0,.16);
for(let z=-1.35;z<=1.36;z+=.9)addBox(stern,trimMat,[2.5,.12,.12],[0,3.24,z]);
// Command block side wall: stacked ribs and tiny amber status windows.
for(let i=0;i<13;i++){
 const z=-2.68+i*.445;
 addBox(stern,i%4===0?warm:dark,[.09,.78,.24],[1.98,.63,z]);
 addBox(stern,trimMat,[.16,.07,.28],[2.02,1.08,z]);
}

// Four engine bells on the aft edge, with layered rings and violet plasma cores.
const engineMat=mat('#222631',.25,.88);
const nozzleCore=new THREE.MeshStandardMaterial({color:'#d8b9ff',emissive:'#8d3dff',emissiveIntensity:4.5,metalness:.15,roughness:.2});
for(const z of [-4.4,-1.5,1.5,4.4]){
 const eg=new THREE.Group();eg.position.set(10.03,-.82,z);ship.add(eg);
 const bell=new THREE.Mesh(new THREE.CylinderGeometry(.34,.68,.95,20,1,true),engineMat);bell.rotation.z=-Math.PI/2;bell.position.x=.34;bell.castShadow=true;eg.add(bell);
 const rim=new THREE.Mesh(new THREE.TorusGeometry(.64,.12,10,28),hullShadow);rim.rotation.y=Math.PI/2;rim.position.x=.78;eg.add(rim);
 const inner=new THREE.Mesh(new THREE.CircleGeometry(.44,28),nozzleCore);inner.rotation.y=Math.PI/2;inner.position.x=.79;eg.add(inner);
 const center=new THREE.Mesh(new THREE.CircleGeometry(.2,20),cold);center.rotation.y=Math.PI/2;center.position.x=.795;eg.add(center);
 const glow=new THREE.PointLight(0x9d52ff,8,8,2);glow.position.set(1.2,0,0);eg.add(glow);animated.push({light:glow,phase:z*1.4});
 for(let i=0;i<4;i++){
  const fin=addBox(eg,trimMat,[.86,.08,.1],[.28,.46,Math.sin(i*Math.PI/2)*.48],i*Math.PI/2,false);
 }
}
// Underside machinery: keel, heat sinks, armor skirts, and service panels.
addBox(ship,dark,[13.7,.62,1.2],[0,-1.55,0]);
for(let s of [-1,1]){
 addBox(ship,graphite,[13,.42,.48],[0,-1.47,s*2.85]);
 for(let i=0;i<18;i++){
   const x=-6.3+i*.74;
   addBox(ship,i%5===0?trimMat:dark,[.36,.18,.62],[x,-1.55,s*2.86]);
   if(i%3===0)addBox(ship,cold,[.22,.07,.025],[x,-1.44,s*3.11]);
 }
}
// Bottom armor panels and violet landing/utility lamps.
for(let x=-8;x<=8;x+=4){
 for(let z of [-5.2,5.2]){
   roundedPlate(ship,2.4,1.0,.32,hullShadow,x,-1.63,z,(x<0?.08:-.06),.16);
   for(let k=-1;k<=1;k++){
     const l=addBox(ship,violet,[.28,.06,.22],[x+k*.46,-1.83,z]);animated.push({mesh:l,phase:x*.3+k});
   }
 }
}
// Exposed ribs along the lower perimeter.
for(let x=-9.1;x<=9.2;x+=.55){
 if(Math.abs(x)<5.4)continue;
 addBox(ship,x%2<.2?warm:trimMat,[.11,.56,.14],[x,-1.42,6.05]);
}

// Violet transparent transfer bridge around the open central bay.
const bridgeMat=new THREE.MeshBasicMaterial({color:0xa978ff,transparent:true,opacity:.24,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
const bridgeGlow=new THREE.MeshBasicMaterial({color:0xe0c9ff,transparent:true,opacity:.58,depthWrite:false,blending:THREE.AdditiveBlending});
const bridgeGroup=new THREE.Group();ship.add(bridgeGroup);
function bridgeBar(length,width,x,z,alongX=true){
 const geo=new THREE.BoxGeometry(alongX?length:width,.18,alongX?width:length);
 const m=new THREE.Mesh(geo,bridgeMat);m.position.set(x,-.02,z);bridgeGroup.add(m);
 const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xc69aff,transparent:true,opacity:.8}));edge.position.copy(m.position);bridgeGroup.add(edge);
 const pts=[];const step=.36;
 if(alongX){for(let xx=-length/2;xx<=length/2+.01;xx+=step){pts.push(xx,-.18,-width/2,xx,-.18,width/2)}for(let zz=-width/2;zz<=width/2+.01;zz+=step){pts.push(-length/2,-.18,zz,length/2,-.18,zz)}}
 else{for(let zz=-length/2;zz<=length/2+.01;zz+=step){pts.push(-width/2,-.18,zz,width/2,-.18,zz)}for(let xx=-width/2;xx<=width/2+.01;xx+=step){pts.push(xx,-.18,-length/2,xx,-.18,length/2)}}
 const grid=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(Array.from({length:pts.length/3},(_,i)=>new THREE.Vector3(pts[i*3],pts[i*3+1],pts[i*3+2]))),new THREE.LineBasicMaterial({color:0x9d5cff,transparent:true,opacity:.4}));grid.position.set(x,0,z);bridgeGroup.add(grid);
 const core=new THREE.Mesh(new THREE.BoxGeometry(alongX?length*.84:width*.84,.035,alongX?.08:length*.08),bridgeGlow);core.position.set(x,.095,z);bridgeGroup.add(core);animated.push({mesh:m,phase:x*.2+z});
}
bridgeBar(11.7,.62,0,-2.62,true);bridgeBar(11.7,.62,0,2.62,true);
bridgeBar(5.05,.62,-5.98,0,false);bridgeBar(5.05,.62,5.98,0,false);
for(const [x,z] of [[-5.7,-2.55],[5.7,-2.55],[-5.7,2.55],[5.7,2.55]]){
 const joint=new THREE.Mesh(new THREE.OctahedronGeometry(.38,1),violet);joint.position.set(x,-.02,z);bridgeGroup.add(joint);animated.push({mesh:joint,phase:x+z});
 pointLight(0x9e51ff,3,5,[x,-.05,z]);
}

// Small faceted sensor dish and aerials on the command deck.
for(let i=0;i<5;i++){
 const x=6.8+i*.54;
 const mast=new THREE.Mesh(new THREE.CylinderGeometry(.045,.07,.6+i%2*.3,7),trimMat);mast.position.set(x,2.3,0);stern.add(mast);
 const tip=new THREE.Mesh(new THREE.SphereGeometry(.095,10,8),i%2?violet:cold);tip.position.set(x,2.66+i%2*.3,0);stern.add(tip);animated.push({mesh:tip,phase:i*.7});
}
const dish=new THREE.Mesh(new THREE.SphereGeometry(.76,24,12,0,Math.PI*2,0,Math.PI/2),hullLight);dish.rotation.x=Math.PI;dish.position.set(-.4,2.48,-1.5);stern.add(dish);
addBox(stern,trimMat,[.12,.08,1.65],[0,2.53,-1.5],.3);

// A procedural clouded planet gives the silhouette a cool atmospheric rim without external images.
function planetTexture(){
 const c=document.createElement('canvas');c.width=1024;c.height=512;const ctx=c.getContext('2d');
 const grd=ctx.createLinearGradient(0,0,0,512);grd.addColorStop(0,'#152447');grd.addColorStop(.5,'#2a6092');grd.addColorStop(1,'#10203d');ctx.fillStyle=grd;ctx.fillRect(0,0,1024,512);
 let seed=73;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
 const landShapes=[[[100,130],[165,93],[230,108],[260,152],[229,183],[212,231],[174,248],[143,209],[111,191]],[[241,267],[295,245],[339,267],[355,310],[325,361],[298,400],[274,367],[264,321]],[[422,112],[484,91],[519,125],[558,118],[597,156],[570,194],[533,181],[511,224],[476,205],[460,164]],[[520,253],[575,239],[622,261],[638,294],[602,319],[576,354],[547,326],[529,292]],[[721,111],[772,99],[819,119],[850,151],[825,178],[783,169],[760,201],[733,171]],[[802,282],[856,265],[904,286],[930,326],[897,347],[872,382],[842,356],[819,328]],[[44,336],[92,310],[139,330],[155,360],[126,386],[80,382]],[[663,367],[706,345],[742,364],[755,398],[724,417],[686,402]]];

function stars(count,size,color,alpha){const arr=new Float32Array(count*3);for(let i=0;i<count;i++){const r=45+Math.random()*90,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);arr[i*3]=r*Math.sin(p)*Math.cos(t);arr[i*3+1]=r*Math.cos(p);arr[i*3+2]=r*Math.sin(p)*Math.sin(t)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));const m=new THREE.PointsMaterial({color,size,transparent:true,opacity:alpha,sizeAttenuation:true,depthWrite:false,fog:false});const pts=new THREE.Points(g,m);scene.add(pts);return pts}
