/* Orbis components — every value comes from tokens.css; nothing here declares a token name. */

/* ---------- base ---------- */
html { background: var(--surface-base); }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 24px;
  color: var(--ink);
  background: var(--surface-base);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  transition: background-color var(--dur-panel) var(--ease-out), color var(--dur-panel) var(--ease-out);
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.ob-stage { padding: var(--space-24) var(--space-20); display: flex; flex-wrap: wrap; gap: var(--space-24); align-items: flex-start; }
.ob-stack { display: flex; flex-direction: column; gap: var(--space-12); }
.ob-row { display: flex; align-items: center; gap: var(--space-12); flex-wrap: wrap; }
.ob-caption { font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ob-label { font-size: 13px; line-height: 20px; color: var(--ink-muted); }
.ob-mono { font-family: var(--font-mono); }
.ob-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- icons ---------- */
.ob-icon { display: inline-block; flex: none; width: var(--icon-md); height: var(--icon-md); fill: currentColor; }
.ob-icon--sm { width: var(--icon-sm); height: var(--icon-sm); }
.ob-icon--xs { width: var(--icon-xs); height: var(--icon-xs); }
.ob-icon--inline { width: var(--icon-inline); height: var(--icon-inline); }
/* Optical baseline: an icon beside text sits 0.125em lower (S07). */
.ob-icon--text { position: relative; top: 0.125em; }
.ob-glyph {
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform var(--dur-release) var(--ease-emphasized), opacity var(--dur-release) var(--ease-emphasized);
}

/* ---------- surface & depth morph ----------
   A recess is the same material pushed in: it never changes color (its fill is the face of the
   surface it sits in), only the inner half of the paired shadow shows that it is lower.
   Raised and inset are written as one four-shadow list so the browser can interpolate
   between them: pressing passes raised → flat → inset instead of jumping (MOT new: depth morph). */
.ob-surface {
  --ob-rest: var(--raised-md), inset 0 0 0 transparent, inset 0 0 0 transparent;
  --ob-down: 0 0 0 transparent, 0 0 0 transparent, var(--inset-md);
  position: relative;
  background: var(--surface-base);
  border-radius: var(--radius-lg);
  box-shadow: var(--ob-rest);
  transition:
    box-shadow var(--dur-release) var(--ease-emphasized),
    background-color var(--dur-state) var(--ease-out),
    color var(--dur-state) var(--ease-out);
}
.ob-surface--sm { --ob-rest: var(--raised-sm), inset 0 0 0 transparent, inset 0 0 0 transparent; --ob-down: 0 0 0 transparent, 0 0 0 transparent, var(--inset-sm); }
.ob-surface--lg { --ob-rest: var(--raised-lg), inset 0 0 0 transparent, inset 0 0 0 transparent; }
.ob-surface--inset { background: transparent; box-shadow: var(--ob-down); }
.ob-surface--pad { padding: var(--space-16); }

/* Interactive surfaces */
.ob-press { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.ob-press:active:not([disabled]):not([aria-disabled="true"]),
.ob-press[data-pressed="true"] {
  box-shadow: var(--ob-down);
  transition-duration: var(--dur-press), var(--dur-state), var(--dur-state);
}
.ob-press:active:not([disabled]) .ob-glyph,
.ob-press[data-pressed="true"] .ob-glyph {
  transform: scale(var(--scale-press));
  opacity: var(--opacity-glyph-pressed);
  transition-duration: var(--dur-press);
}
.ob-surface .ob-press:active:not([disabled]), .ob-surface .ob-press[data-pressed="true"] { background: transparent; }
@media (hover: hover) {
  .ob-press:hover:not([disabled]):not(:active) { background: var(--surface-lift); }
  .ob-surface--inset.ob-press:hover:not([disabled]) { background: transparent; }
}
.ob-press:focus-visible, .ob-focusable:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
/* Disabled = flattened: shadows go, a hairline contour keeps the shape, content turns ink-faint. */
.ob-press[disabled], .ob-press[aria-disabled="true"] {
  cursor: default; box-shadow: 0 0 0 transparent, 0 0 0 transparent, inset 0 0 0 1px var(--hairline), inset 0 0 0 transparent;
  color: var(--ink-faint);
}
.ob-press[disabled] .ob-glyph, .ob-press[aria-disabled="true"] .ob-glyph { color: var(--ink-faint); }

/* ---------- button ---------- */
.ob-btn {
  border: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8);
  min-height: var(--control-height); padding: 0 var(--space-20);
  border-radius: var(--radius-md);
  font-size: 15px; line-height: 24px; font-weight: 600; color: var(--ink);
  white-space: nowrap;
}
.ob-btn--primary { color: var(--accent); }
.ob-btn--danger { color: var(--danger); }
.ob-btn--sm { min-height: var(--control-height-sm); padding: 0 var(--space-16); gap: var(--space-6); border-radius: var(--radius-sm); font-size: 13px; line-height: 20px; }
.ob-btn--block { width: 100%; min-height: var(--field-height); }
.ob-btn--selected { box-shadow: var(--ob-down); color: var(--accent); }
.ob-btn .ob-slot { position: relative; display: inline-grid; place-items: center; }
.ob-btn .ob-slot > * { grid-area: 1 / 1; }
.ob-spinner {
  width: var(--icon-xs); height: var(--icon-xs); border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: ob-spin var(--dur-loop) var(--ease-linear) infinite;
}
@keyframes ob-spin { to { transform: rotate(360deg); } }
.ob-link {
  display: inline-flex; align-items: center; gap: var(--space-4); border: 0; background: none; padding: 0;
  min-height: var(--touch-target); color: var(--accent); font-size: 15px; line-height: 24px; font-weight: 600; cursor: pointer;
}
.ob-link--sm { font-size: 13px; line-height: 20px; min-height: 32px; gap: var(--space-2); position: relative; }
/* Compact to look at, still a 48 target: the hit area extends 8px above and below. */
.ob-link--sm::before { content: ""; position: absolute; left: 0; right: 0; top: calc((32px - var(--touch-target)) / 2); bottom: calc((32px - var(--touch-target)) / 2); }
.ob-link:active .ob-glyph { transform: scale(var(--scale-press)); opacity: var(--opacity-glyph-pressed); transition-duration: var(--dur-press); }

/* ---------- icon button ---------- */
.ob-iconbtn {

  position: relative; width: 100%; padding: var(--space-8) var(--space-16) var(--space-24); display: flex; flex-direction: column; gap: var(--space-12);

.ob-notice {
  display: flex; align-items: center; gap: var(--space-12); min-height: var(--control-height); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-16);

/* ---------- cards & rows ---------- */
.ob-card { padding: var(--space-16); border-radius: var(--radius-lg); }

.ob-sessioncard-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.ob-sessioncard-title { min-height: 48px; font-size: 15px; line-height: 24px; font-weight: 600; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ob-sessioncard-path { font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ob-listrow { display: flex; align-items: center; gap: var(--space-12); min-height: var(--control-height); padding: var(--space-6) 0; width: 100%; background: none; border: 0; text-align: left; color: var(--ink); font-size: 15px; line-height: 24px; }
.ob-listrow + .ob-listrow { border-top: 0; }

.ob-listrow-action { display: inline-flex; align-items: center; gap: var(--space-6); color: var(--accent); font-size: 13px; line-height: 20px; font-weight: 600; background: none; border: 0; min-height: var(--touch-target); padding: 0 var(--space-4); cursor: pointer; }

/* directory group (drawer) */
.ob-collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-collapse) var(--ease-standard), opacity var(--dur-state) var(--ease-out); opacity: 0; }

.ob-chat { display: flex; flex-direction: column; gap: var(--space-16); max-width: var(--reading-width); }
.ob-usermsg { align-self: flex-end; max-width: 85%; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-4); }
.ob-usermsg-bubble { padding: var(--space-12) var(--space-16); border-radius: var(--radius-lg); background: transparent; box-shadow: var(--inset-md); font-size: 15px; line-height: 24px; color: var(--ink); }
.ob-usermsg-status { display: flex; align-items: center; gap: var(--space-4); font-size: 12px; line-height: 18px; color: var(--ink-muted); min-height: var(--touch-target); }
.ob-usermsg-status--failed { color: var(--danger); }
.ob-usermsg[data-arriving="true"] .ob-usermsg-bubble { animation: ob-arrive var(--dur-send) var(--ease-emphasized) both; transform-origin: bottom right; }
@keyframes ob-arrive { 0% { transform: translate(-24px, 40px) scale(0.86); opacity: 0.6; } 64% { transform: scale(0.86); opacity: 1; } 100% { transform: none; } }
.ob-assist { display: flex; flex-direction: column; gap: var(--space-12); padding: var(--space-16); border-radius: var(--radius-lg); animation: ob-rise-in var(--dur-panel) var(--ease-emphasized) both; }
.ob-assist-head { display: flex; align-items: center; justify-content: space-between; margin: calc(-1 * var(--space-8)) calc(-1 * var(--space-8)) calc(-1 * var(--space-4)) 0; }
.ob-assist-body > * { margin: 0; }
.ob-assist-body > * + * { margin-top: var(--space-12); }
.ob-assist-body ul { padding-left: var(--space-20); }
.ob-assist-foot { display: flex; align-items: center; gap: var(--space-8); font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ob-code { border-radius: var(--radius-sm); background: transparent; box-shadow: var(--inset-sm); overflow: hidden; }
.ob-code-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4) 0 var(--space-12); min-height: 40px; font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ob-code pre { margin: 0; padding: 0 var(--space-12) var(--space-12); overflow-x: auto; font-family: var(--font-mono); font-size: 13px; line-height: 20px; color: var(--ink); }
.ob-tools { border-radius: var(--radius-sm); background: var(--surface-lift); }
.ob-tools-head { display: flex; align-items: center; gap: var(--space-8); width: 100%; min-height: var(--control-height); padding: 0 var(--space-12); border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; border-radius: var(--radius-sm); font-size: 13px; line-height: 20px; }
.ob-tools-head .ob-glyph { color: var(--ink-muted); }
.ob-tools-title { flex: 1; font-weight: 600; }
.ob-tools-chev { transition: transform var(--dur-collapse) var(--ease-standard); }
.ob-tools[data-open="true"] .ob-tools-chev { transform: rotate(180deg); }
.ob-tool { display: flex; align-items: center; gap: var(--space-8); padding: var(--space-8) var(--space-12); font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ob-tool + .ob-tool { box-shadow: inset 0 1px 0 var(--hairline); }
.ob-tool-name { color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 20px; font-weight: 600; flex: none; }
.ob-tool-arg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ob-tool-more { padding: var(--space-4) var(--space-12) var(--space-8); }

/* composer */
.ob-composer { display: flex; flex-direction: column; gap: var(--space-8); padding: var(--space-8) var(--space-8) var(--space-12); background: var(--surface-base); }
.ob-composer-info { display: flex; align-items: center; gap: var(--space-8); padding: 0 var(--space-12); font-size: 12px; line-height: 18px; color: var(--ink-muted); min-height: 32px; }
.ob-composer-info .ob-mono { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ob-composer-row { display: flex; align-items: flex-end; gap: 0; }
.ob-composer-field { flex: 1; min-width: 0; min-height: var(--field-height); max-height: 168px; display: flex; align-items: center; padding: 0 var(--space-16); border-radius: var(--radius-md); background: transparent; box-shadow: var(--inset-md), 0 0 0 0 transparent, 0 0 0 0 transparent; transition: box-shadow var(--dur-state) var(--ease-out); margin: 0 var(--space-4) var(--space-4); }
.ob-composer-field:focus-within { box-shadow: var(--inset-md), var(--focus-halo); }
.ob-composer-field textarea { flex: 1; border: 0; outline: 0; background: transparent; resize: none; font: inherit; font-size: 15px; line-height: 24px; color: var(--ink); padding: var(--space-16) 0; height: 56px; }
.ob-composer-field textarea::placeholder { color: var(--ink-muted); }
.ob-composer-row .ob-iconbtn { margin-bottom: var(--space-4); }

/* ---------- motion lab ---------- */
.ob-lab { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-24); padding: var(--space-24) var(--space-20); }
.ob-lab-cell { display: flex; flex-direction: column; gap: var(--space-12); min-height: 220px; }
.ob-lab-title { font-size: 15px; line-height: 24px; font-weight: 600; margin: 0; }
.ob-lab-spec { font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--ink-muted); margin: 0; }
.ob-lab-view { position: relative; flex: 1; min-height: 132px; border-radius: var(--radius-lg); background: var(--surface-base); box-shadow: inset 0 0 0 1px var(--hairline); overflow: hidden; }
.ob-lab-page { position: absolute; inset: 0; padding: var(--space-16); background: var(--surface-base); display: flex; flex-direction: column; gap: var(--space-8); }
.ob-lab-page--push { transform: translateX(calc(100% + 32px)); transition: transform var(--dur-page) var(--ease-page); box-shadow: var(--raised-lg); }
.ob-lab-page--push[data-in="true"] { transform: none; }
.ob-lab-shade { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity var(--dur-page) var(--ease-page); pointer-events: none; }
.ob-lab-shade[data-in="true"] { opacity: var(--opacity-scrim); }
.ob-lab-under { position: absolute; inset: 0; transition: transform var(--dur-page) var(--ease-page); }
.ob-lab-under[data-in="true"] { transform: translateX(-24px); }
.ob-skel { height: 12px; border-radius: var(--radius-full); background: transparent; box-shadow: var(--inset-sm); opacity: var(--opacity-skeleton); position: relative; overflow: hidden; }
.ob-skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--highlight), transparent); transform: translateX(-100%); animation: ob-skel var(--dur-loop) var(--ease-linear) infinite; opacity: 0.6; }
@keyframes ob-skel { to { transform: translateX(100%); } }

/* ---------- provider dial ----------
   One raised wheel whose centre sits just inside the left edge, read from the centre out: a small
   hollow at the very middle (recess = parent colour + inner shadow), then — with groups — a raised hub
   that carries the agents past a fixed window, a same-colour seam, and the outer wheel whose ticks and
   dots belong to that agent's profiles. Profile names sit outside the rim like a tuner scale, upright;
   a fixed agent-coloured pip on the rim marks the chosen one. */
.ob-dial { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; min-height: 300px; }
.ob-dial:active { cursor: grabbing; }
.ob-dial.is-cropped { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); }
.ob-dial-disc, .ob-dial-groove, .ob-dial-face, .ob-dial-seam, .ob-dial-hub, .ob-dial-hole { position: absolute; border-radius: 50%; }
.ob-dial-disc { background: var(--surface-base); box-shadow: var(--raised-lg); outline: none; }
.ob-dial-groove, .ob-dial-seam { background: transparent; box-shadow: var(--inset-sm); pointer-events: none; }
.ob-dial-face { background: var(--surface-base); box-shadow: var(--raised-sm); pointer-events: none; }
.ob-dial-hub { background: var(--surface-base); box-shadow: var(--raised-sm); outline: none; transition: box-shadow var(--dur-state) var(--ease-standard), opacity var(--dur-state) var(--ease-standard); }
.ob-dial-hole { background: transparent; box-shadow: var(--inset-md); pointer-events: none; }
.ob-dial-disc:focus-visible, .ob-dial-hub:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
.ob-dial-rotor { position: absolute; pointer-events: none; overflow: visible; }
.ob-dial-tick { stroke: var(--ink-faint); stroke-width: 1; stroke-linecap: round; }
.ob-dial-tick.is-major { stroke: var(--ink-muted); stroke-width: 1.5; }
.ob-dial-knurl { fill: var(--ink-faint); }
.ob-dial-dot { fill: var(--ink-faint); }
.ob-dial-dot.is-current { fill: var(--success); }
.ob-dial-window { position: absolute; width: 42px; height: 42px; border-radius: var(--radius-full); box-shadow: var(--inset-sm); pointer-events: none; }
.ob-dial-window.is-pulse { animation: ob-window var(--dur-state) var(--ease-emphasized); }
@keyframes ob-window { 40% { transform: scale(1.08); } }
.ob-dial-agents, .ob-dial-labels { position: absolute; inset: 0; pointer-events: none; transition: opacity var(--dur-state) var(--ease-standard); }
.ob-dial-labels { animation: ob-dial-in var(--dur-state) var(--ease-emphasized); }
@keyframes ob-dial-in { from { opacity: 0; } }
.ob-dial-agent { position: absolute; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: none; border-radius: var(--radius-full);
  pointer-events: auto; cursor: pointer; opacity: var(--opacity-dim); filter: grayscale(1); transition: opacity var(--dur-state) var(--ease-standard), filter var(--dur-state) var(--ease-standard); }
.ob-dial-agent .ob-agent-mark { width: 20px; height: 20px; }
.ob-dial-agent::before { content: ""; position: absolute; inset: calc((36px - var(--touch-target)) / 2); border-radius: var(--radius-full); }
.ob-dial-agent.is-on { opacity: 1; filter: none; }
.ob-dial-label { pointer-events: auto; }
/* Hold feedback: the ring under the finger stays lit, the other one steps back. */
.ob-dial[data-grab="agent"] .ob-dial-labels { opacity: var(--opacity-dim); }
.ob-dial[data-grab="agent"] .ob-dial-hub { box-shadow: var(--raised-md); }
.ob-dial[data-grab="item"] .ob-dial-agents, .ob-dial[data-grab="item"] .ob-dial-hub { opacity: var(--opacity-dim); }
.ob-dial-pip { position: absolute; width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--accent); box-shadow: 0 0 0 3px var(--surface-base), var(--raised-sm); pointer-events: none; }
.ob-dial-pip.is-pulse { animation: ob-pip var(--dur-state) var(--ease-emphasized); }
@keyframes ob-pip { 40% { transform: scale(1.5); } }
.ob-dial-label {
  position: absolute; display: flex; flex-direction: column; align-items: flex-start; gap: 0;
  min-height: var(--touch-target); justify-content: center;
  padding: var(--space-4) 0; border: 0; background: none; text-align: left; color: var(--ink-muted);
  transform-origin: left center; cursor: pointer; font: inherit; white-space: nowrap;
}
.ob-dial-label.is-on { color: var(--ink); }
.ob-dial-label::before { content: ""; position: absolute; inset: calc(var(--space-8) * -1) calc(var(--space-8) * -1); }  /* neighbours shrink to 78%; keep them a 48 target */
.ob-dial-group { font-size: 12px; line-height: 18px; color: var(--ink-muted); overflow: hidden; }
.ob-dial-name { font-size: 20px; line-height: 28px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ob-dial-sub { font-size: 13px; line-height: 20px; color: var(--ink-muted); overflow: hidden; }
.ob-dial-current { display: inline-flex; align-items: center; gap: var(--space-4); font-size: 12px; line-height: 18px; color: var(--success); overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .ob-dial-labels, .ob-dial-window.is-pulse, .ob-dial-pip.is-pulse { animation: none; } }

/* ---------- directory (sidebar) ----------
   The drawer is the only raised surface; directories are flat 48 rows on it. Names are label-strong
   (13/600), sessions are label (13) on one line, meta is caption. Hierarchy = indent + one hairline
   guide; the open session is the only thing pressed in. */
.ob-dir { display: flex; flex-direction: column; }
.ob-dir-head, .ob-dir-item {
  display: flex; align-items: center; width: 100%; min-height: var(--touch-target); border: 0; background: transparent;
  border-radius: var(--radius-sm); font: inherit; text-align: left; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: box-shadow var(--dur-release) var(--ease-emphasized);
}
.ob-dir-head:active, .ob-dir-item:active { box-shadow: var(--inset-sm); transition-duration: var(--dur-press); }
.ob-dir-head:focus-visible, .ob-dir-item:focus-visible, .ob-dir-more:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.ob-dir-head { gap: var(--space-6); padding: 0 var(--space-8); }
.ob-dir-glyph { color: var(--ink-muted); }
.ob-dir[data-open="true"] .ob-dir-glyph { color: var(--ink); }
.ob-dir-name { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ob-dir-count { font-size: 12px; line-height: 18px; color: var(--ink-muted); font-variant-numeric: tabular-nums; margin-left: var(--space-4); }
.ob-dir-chev { color: var(--ink-muted); transition: transform var(--dur-collapse) var(--ease-standard); }
.ob-dir[data-open="true"] .ob-dir-chev { transform: rotate(90deg); }
.ob-dir-tree { margin: 0 0 var(--space-8) var(--space-16); padding-left: 0; border-left: 1px solid var(--hairline); display: flex; flex-direction: column; }
.ob-dir-item { gap: var(--space-8); padding: 0 var(--space-8) 0 calc(var(--space-16) - 1px); }  /* 16 from the guide, minus the guide itself */
.ob-dir-item .ob-agent-mark { width: var(--icon-inline); height: var(--icon-inline); flex: none; }
.ob-dir-item-title { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ob-dir-item-meta { display: inline-flex; align-items: center; gap: var(--space-4); flex: none; font-size: 12px; line-height: 18px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.ob-dir-item[aria-current="true"] { box-shadow: var(--inset-sm); }
.ob-dir-item[aria-current="true"] .ob-dir-item-title { color: var(--accent); font-weight: 600; }
.ob-dir-tree-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--space-4) 0 calc(var(--space-12) - 1px); }
.ob-dir-more { display: inline-flex; align-items: center; gap: var(--space-4); min-height: var(--touch-target); padding: 0 var(--space-4); border: 0; background: none; font: inherit; font-size: 12px; line-height: 18px; color: var(--ink-muted); cursor: pointer; }
.ob-dir-more:first-child { color: var(--accent); }

/* Icon slot: a 40 recess for a leading glyph in list rows (folders in pickers). */
.ob-dir-icon { width: var(--disc-md); height: var(--disc-md); border-radius: var(--radius-sm); display: grid; place-items: center; background: transparent; box-shadow: var(--inset-sm); color: var(--ink-muted); flex: none; }

/* ---------- session draft ----------
   New session = a card that rises out of the list. Choreography (driven by data-phase):
   slot  — a groove opens in the material (the wrapper's height grows, the card is still pressed in);
   risen — the material pushes up: inset → flat → raised in one depth morph, contents rise in after it;
   sink  — the reverse, then the groove closes. Sending grows the card into the chat page. */
.ob-draft-wrap { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 0fr; transition: grid-template-rows var(--dur-collapse) var(--ease-standard); }
.ob-draft-wrap[data-open="true"] { grid-template-rows: 1fr; }
.ob-draft-wrap > div { min-height: 0; min-width: 0; overflow: hidden; padding: var(--space-8) var(--space-8) var(--space-12); margin: calc(var(--space-8) * -1) calc(var(--space-8) * -1) 0; }
.ob-draft {
  display: flex; flex-direction: column; gap: var(--space-12); padding: var(--space-16); border-radius: var(--radius-lg);
  transition: box-shadow var(--dur-selection) var(--ease-emphasized);
}
.ob-draft[data-phase="slot"], .ob-draft[data-phase="sink"] { box-shadow: var(--ob-down); }
.ob-draft > * { transition: opacity var(--dur-state) var(--ease-out), transform var(--dur-state) var(--ease-out); }
.ob-draft[data-phase="risen"] > * { transition-delay: 120ms; }
.ob-draft[data-phase="slot"] > *, .ob-draft[data-phase="sink"] > * { opacity: 0; transform: translateY(var(--space-4)); transition-delay: 0ms; }
.ob-draft-head { display: flex; align-items: center; gap: var(--space-12); }
.ob-draft-agents { display: flex; gap: var(--space-4); }
.ob-draft-agent {
  position: relative; width: var(--disc-sm); height: var(--disc-sm); border-radius: var(--radius-full); border: 0; padding: 0; background: transparent;
  display: grid; place-items: center; cursor: pointer; opacity: var(--opacity-dim); filter: grayscale(1);
  transition: box-shadow var(--dur-selection) var(--ease-emphasized), opacity var(--dur-state) var(--ease-out), filter var(--dur-state) var(--ease-out);
}
.ob-draft-agent::before { content: ""; position: absolute; inset: calc((var(--disc-sm) - var(--touch-target)) / 2) -2px; }
.ob-draft-agent .ob-agent-mark { width: var(--icon-sm); height: var(--icon-sm); }
.ob-draft-agent.is-on { box-shadow: var(--inset-sm); opacity: 1; filter: none; }
.ob-draft-agent:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.ob-draft-name { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--agent, var(--ink)); }
.ob-draft-variant-trigger { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; margin-left: auto; padding: 0 4px; border: 0; background: transparent; color: var(--agent, var(--ink)); font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.ob-draft-variant-trigger:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-xs); }
.ob-draft-dir { display: inline-flex; align-items: center; gap: var(--space-6); align-self: flex-start; max-width: 100%; min-height: 32px; position: relative;
  padding: 0 var(--space-8); margin-left: calc(var(--space-8) * -1); border: 0; border-radius: var(--radius-xs); background: none; cursor: pointer;
  color: var(--ink-muted); font: inherit; font-size: 12px; line-height: 18px; }
.ob-draft-dir::before { content: ""; position: absolute; left: 0; right: 0; top: calc((32px - var(--touch-target)) / 2); bottom: calc((32px - var(--touch-target)) / 2); }
.ob-draft-dir:active { box-shadow: var(--inset-sm); }
.ob-draft-path { font-family: var(--font-mono); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ob-draft-row { display: flex; align-items: flex-end; gap: var(--space-8); }
.ob-draft-field { flex: 1; min-width: 0; display: flex; align-items: center; min-height: var(--field-height); padding: 0 var(--space-16); border-radius: var(--radius-md);
  box-shadow: var(--inset-md), 0 0 0 0 transparent; transition: box-shadow var(--dur-state) var(--ease-out); }
.ob-draft-field:focus-within { box-shadow: var(--inset-md), var(--focus-halo); }
.ob-draft-field textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; font: inherit; font-size: 15px; line-height: 24px; color: var(--ink);
  padding: var(--space-16) 0; field-sizing: content; min-height: 56px; max-height: 144px; }
.ob-draft-field textarea::placeholder { color: var(--ink-muted); }
.ob-draft-row .ob-iconbtn { margin-bottom: var(--space-4); }
.ob-draft-note { font-size: 12px; line-height: 18px; color: var(--ink-muted); padding-left: var(--space-4); }
/* The + that opened it turns into × while the draft is up. */
.ob-newbtn .ob-icon { transition: transform var(--dur-selection) var(--ease-emphasized); }
.ob-newbtn[aria-pressed="true"] .ob-icon { transform: rotate(45deg); }

/* ---------- radio ---------- */
.ob-radio { width: var(--checkbox); height: var(--checkbox); flex: none; border-radius: var(--radius-full); display: inline-grid; place-items: center; box-shadow: var(--inset-sm); }
.ob-radio::after { content: ""; width: 10px; height: 10px; border-radius: var(--radius-full); background: var(--accent); transform: scale(0); transition: transform var(--dur-selection) var(--ease-pop); }
.ob-radio.is-on::after { transform: scale(1); }

/* ---------- choice list: short choices with optional info ---------- */
.ob-choices { display: flex; flex-direction: column; gap: var(--space-4); }
.ob-choice-container { display: flex; flex-direction: column; min-width: 0; }
.ob-choice-row { display: flex; align-items: center; gap: var(--space-4); }
.ob-choice-row .ob-choice { flex: 1; }
.ob-choice {
  display: flex; align-items: flex-start; gap: var(--space-12); width: 100%; min-height: var(--control-height); padding: var(--space-12);
  border: 0; border-radius: var(--radius-md); background: transparent; text-align: left; color: var(--ink); font: inherit; cursor: pointer;
  transition: box-shadow var(--dur-selection) var(--ease-emphasized);
}
.ob-choice.is-on { box-shadow: var(--inset-sm); }
.ob-choice.is-on .ob-choice-title { color: var(--accent); }
.ob-choice:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.ob-choice-main { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.ob-choice-title { display: flex; align-items: center; gap: var(--space-8); font-size: 15px; line-height: 24px; font-weight: 600; }
.ob-choice-tag { font-size: 12px; line-height: 18px; font-weight: 400; color: var(--ink-muted); }
.ob-choice-sub { font-size: 13px; line-height: 20px; color: var(--ink-muted); }

/* ---------- theme preview & appearance picker ----------
   Selection follows the system rule: the chosen tile or swatch is pressed in (inset) and its words
   turn accent + 600; nothing gets an outline. */
.ob-tpv {
  display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-8); border-radius: var(--radius-sm);
  background: var(--surface-base); color: var(--ink); width: 100%; height: 112px; overflow: hidden;
}

  }

  function PermissionSheet(p) {
    var v = useState(p.value);
    var opts = [['只读', '只能读取文件和运行只读命令'], ['工作区写入', '可以修改工作目录里的文件'], ['完全访问', '可以访问整台电脑，谨慎使用']];
    return h(O.Sheet, { title: '下一轮的权限' },
      h(O.ChoiceList, { label: '下一轮的权限', value: v[0], onChange: v[1], options: opts.map(function (o) { return { value: o[0], title: o[0], sub: o[1] }; }) }),
      h(O.Button, { size: 'block', variant: 'primary', onClick: function () { p.onApply(v[0]); } }, '应用到下一轮'));
  }

  function HistorySheet(p) {
    var turns = [['第 3 轮', '草稿也按会话隔离吗？'], ['第 2 轮', '聊天输入和滚动也要保持一致。'], ['第 1 轮', '对齐移动端的使用体验']];
    return h(O.Sheet, { title: '历史与分支' },
      h(O.ListGroup, null, turns.map(function (t, i) {
        return h(O.ListRow, { key: t[0], title: t[1], sub: t[0] + (i === 0 ? '，当前' : ''), trailing: i === 0 ? null : h(O.RowAction, { icon: 'history', onClick: p.onPick }, '回退') });
      })));
  }

  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();

</script>

</body></html>
