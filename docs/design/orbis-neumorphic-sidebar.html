function archivedSessions(){const ids=new Set(visibleFolders().map(f=>f.id));return sessions.filter(s=>ids.has(s.folder)&&s.archived).sort((a,b)=>b.archivedAt-a.archivedAt||a.id.localeCompare(b.id))}
function archiveLabel(s){const days=Math.max(0,Math.floor((Date.now()-s.archivedAt)/86400000));return days===0?'今天归档':days===1?'昨天归档':`${days} 天前归档`}
function archiveRow(s){const f=folders.find(f=>f.id===s.folder);return `<div class="archive-item"><button class="session ${s.id===state.selected?'active':''}" data-session="${esc(s.id)}" ${s.id===state.selected?'aria-current="page"':''} aria-label="查看归档：${esc(s.title)}，${esc(f.name)}"><span class="session-mark">${esc(agents[s.agent].mark)}</span><span class="session-text"><strong class="session-title">${esc(s.title)}</strong><span class="session-context"><span class="context-folder" title="${esc(f.path)}">${esc(f.name)}</span><span>·</span><time datetime="${new Date(s.archivedAt).toISOString()}">${esc(archiveLabel(s))}</time></span></span></button><button class="restore-button" data-restore="${esc(s.id)}" title="恢复到 ${esc(f.name)}" aria-label="恢复 ${esc(s.title)} 到 ${esc(f.name)}">${icon('restore')}</button></div>`}
function archiveEmpty(){return `<div class="archive-empty">${icon('archive')}<strong>还没有归档会话</strong>归档后的会话会保留在这里，<br>随时可以恢复到原目录。</div>`}
function renderArchive(){$('#archive-count').textContent=archivedSessions().length}
function row(s){return `<button class="session ${s.id===state.selected?'active':''}" data-session="${s.id}" ${s.id===state.selected?'aria-current="page"':''}><span class="session-mark">${esc(agents[s.agent].mark)}</span><span class="session-text"><strong class="session-title">${esc(s.title)}</strong><span class="session-sub">${['运行中','等待审批'].includes(s.status)?`<i class="status-dot ${s.status==='等待审批'?'waiting':''}"></i>`:''}${esc(s.status)}<span>·</span>${esc(s.time)}</span></span><i class="active-pin" aria-hidden="true"></i></button>`}
function render(){renderRecent();renderArchive();renderWorkspace();const fs=visibleFolders(),q=state.query.trim().toLowerCase(),matches=sessions.filter(s=>fs.some(f=>f.id===s.folder)&&!s.archived&&(!q||[s.title,folders.find(f=>f.id===s.folder).name,agents[s.agent].name].some(t=>t.toLowerCase().includes(q))));$('#list-label').textContent=q?'搜索结果':'工作目录';$('#list-count').textContent=q?String(matches.length).padStart(2,'0')+' RESULTS':String(fs.length).padStart(2,'0')+' SPACES';$('[data-action="clear"]').hidden=!state.query;$('#host-name').textContent=machines.find(h=>h.id===state.host).name;$('#host-status').innerHTML=(machines.find(h=>h.id===state.host).online?'<i class="status-dot"></i>':'')+machines.find(h=>h.id===state.host).status;
if(q){$('#folders').innerHTML=`<div class="search-results">${matches.slice(0,SEARCH_LIMIT).map(row).join('')||'<div class="empty">这里还没有会话。<br>换个关键词，找回那条思路。</div>'}${matches.length>SEARCH_LIMIT?`<button class="preview-more" data-all="search">查看全部 ${matches.length} 条${icon('chevron')}</button>`:''}</div>`;return}
const preview=fs.slice(0,DIRECTORY_LIMIT),visible=fs.some(f=>f.id===state.expanded)&&!preview.some(f=>f.id===state.expanded)?[...preview.slice(0,DIRECTORY_LIMIT-1),fs.find(f=>f.id===state.expanded)]:preview;
$('#folders').innerHTML=visible.map(f=>{const items=matches.filter(s=>s.folder===f.id),open=f.id===state.expanded,previewItems=items.slice(0,PREVIEW_LIMIT),selected=items.find(s=>s.id===state.selected);if(selected&&!previewItems.includes(selected))previewItems[PREVIEW_LIMIT-1]=selected;return `<section class="folder-card ${open?'expanded':''}" data-card="${f.id}"><div class="folder-head"><button class="folder-toggle" data-folder="${f.id}" aria-expanded="${open}" aria-controls="folder-${f.id}"><span class="folder-icon">${icon('folder')}</span><span class="folder-copy"><strong>${esc(f.name)}</strong><small>${esc(f.desc)}</small></span><span class="folder-count">${items.length}</span>${icon('chevron')}</button><button class="folder-add" data-new-folder="${f.id}" aria-label="在 ${esc(f.name)} 中新建会话">${icon('plus')}</button></div><div class="folder-detail" id="folder-${f.id}" ${open?'':'inert'} aria-hidden="${!open}"><div class="folder-clip"><div class="session-list">${previewItems.map(row).join('')}${items.length>PREVIEW_LIMIT?`<button class="preview-more" data-all="${f.id}">查看全部 ${items.length} 条${icon('chevron')}</button>`:''}<div class="folder-foot"><span>${esc(f.path)}</span>${icon('folder')}</div></div></div></div></section>`}).join('')+(fs.length>DIRECTORY_LIMIT?`<button class="preview-more" data-all="directories">查看全部 ${fs.length} 个工作目录${icon('chevron')}</button>`:'')}
function toggleFolder(id){state.expanded=state.expanded===id?null:id;document.querySelectorAll('[data-card]').forEach(el=>{const open=el.dataset.card===state.expanded;el.classList.toggle('expanded',open);el.querySelector('.folder-toggle').setAttribute('aria-expanded',String(open));const detail=el.querySelector('.folder-detail');detail.inert=!open;detail.setAttribute('aria-hidden',String(!open))})}
function fullMatches(){if(!state.full)return[];const q=state.fullQuery.trim().toLowerCase(),folder=state.full;if(folder==='directories')return visibleFolders().filter(f=>[f.name,f.path,f.desc].some(t=>t.toLowerCase().includes(q)));if(folder==='recent'||folder==='archive')return (folder==='archive'?archivedSessions():recentSessions()).filter(s=>[s.title,agents[s.agent].name,folders.find(f=>f.id===s.folder).name,folders.find(f=>f.id===s.folder).path].some(t=>t.toLowerCase().includes(q)));return sessions.filter(s=>folders.some(f=>f.id===s.folder&&f.host===state.host)&&!s.archived&&(folder==='search'||s.folder===folder)&&(!q||[s.title,agents[s.agent].name,folders.find(f=>f.id===s.folder).name].some(t=>t.toLowerCase().includes(q))))}
function directoryRow(f){const count=sessions.filter(s=>s.folder===f.id&&!s.archived).length;return `<button class="directory-result" data-full-dir="${esc(f.id)}"><span class="folder-icon">${icon('folder')}</span><span class="directory-result-copy"><strong>${esc(f.name)}</strong><small>${esc(f.path)}</small></span><span class="directory-result-count">${count}</span>${icon('chevron')}</button>`}
function renderFull(){const matches=fullMatches(),shown=matches.slice(0,state.shown),directories=state.full==='directories',recent=state.full==='recent',archive=state.full==='archive',name=folders.find(f=>f.id===state.full)?.name;$('#all-title').textContent=directories?'全部工作目录':recent?'最近会话':name|| (state.full==='archive'?'已归档的会话':'搜索结果');$('#all-subtitle').textContent=`${machines.find(h=>h.id===state.host).name} · 共 ${matches.length} ${directories?'个目录':'条会话'}`;if(recent||archive)$('#all-subtitle').textContent+=archive?' · 最近归档优先':' · 最近打开优先';$('#all-query').placeholder=directories?'搜索目录名称或路径':recent||archive?'搜索会话、目录或 Agent':'搜索当前会话';$('#all-sessions').setAttribute('aria-label',archive?'归档会话列表':'完整会话列表');$('#all-query').setAttribute('aria-label',directories?'搜索全部工作目录':'搜索完整会话列表');$('#all-scroll').innerHTML=shown.length?shown.map(directories?directoryRow:archive?archiveRow:recent?recentRow:row).join(''):archive&&!state.fullQuery.trim()?archiveEmpty():`<div class="empty">没有匹配的${directories?'工作目录':'会话'}。</div>`;$('#all-count').textContent=matches.length?`已显示 ${shown.length} / ${matches.length} ${directories?'个':'条'}`:'';$('#all-more').hidden=shown.length>=matches.length;$('#all-more').textContent=`再看 ${Math.min(PAGE_SIZE,matches.length-shown.length)} ${directories?'个':'条'}`}
let viewTimer=0,viewFrame=0,viewToken=0;
function cancelViewMotion(){viewToken++;clearTimeout(viewTimer);cancelAnimationFrame(viewFrame);$('#all-sessions').classList.remove('view-entering','view-leaving','view-deeper','view-return','view-entering-back');$('#all-sessions').inert=!state.full||!!state.sheet}
function animateListIn(){const panel=$('#all-sessions');cancelViewMotion();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const token=viewToken;panel.classList.add('view-entering');viewFrame=requestAnimationFrame(()=>{if(token!==viewToken)return;viewFrame=requestAnimationFrame(()=>{if(token===viewToken)panel.classList.remove('view-entering')})})}
function switchFullView(update,forward){const panel=$('#all-sessions');cancelViewMotion();if(matchMedia('(prefers-reduced-motion: reduce)').matches){update();return}const token=viewToken;panel.classList.add(forward?'view-deeper':'view-return');viewTimer=setTimeout(()=>{if(token!==viewToken)return;panel.classList.remove('view-deeper','view-return');panel.classList.add(forward?'view-entering':'view-entering-back');update();requestAnimationFrame(()=>{viewFrame=requestAnimationFrame(()=>panel.classList.remove('view-entering','view-entering-back'))})},140)}
function openFull(mode){state.fullOrigin=state.tools?$('#tools-trigger'):document.activeElement;state.tools=false;cancelViewMotion();state.directoryReturn=null;state.full=mode;state.fullQuery=['directories','recent','archive'].includes(mode)?'':state.query;state.shown=PAGE_SIZE;$('#all-query').value=state.fullQuery;renderFull();$('#all-scroll').scrollTop=0;sync();$('#sidebar').classList.add('behind-list');animateListIn();$('#all-query').focus({preventScroll:true})}
function openDirectorySessions(id){const previous={query:state.fullQuery,shown:state.shown,scroll:$('#all-scroll').scrollTop};switchFullView(()=>{state.directoryReturn=previous;state.full=id;state.fullQuery='';state.shown=PAGE_SIZE;$('#all-query').value='';renderFull();$('#all-scroll').scrollTop=0;$('#all-query').focus({preventScroll:true})},true)}
function focusFullOrigin(){const origin=state.fullOrigin;const target=origin?.isConnected&&!origin.closest('[hidden],[inert]')?origin:$('#search');target.focus({preventScroll:true})}
function closeFull(){if(state.directoryReturn){const previous=state.directoryReturn;switchFullView(()=>{state.directoryReturn=null;state.full='directories';state.fullQuery=previous.query;state.shown=previous.shown;$('#all-query').value=previous.query;renderFull();$('#all-scroll').scrollTop=previous.scroll;$('#all-query').focus({preventScroll:true})},false);return}const panel=$('#all-sessions');cancelViewMotion();const token=viewToken;panel.classList.add('view-leaving');panel.inert=true;$('#sidebar').classList.remove('behind-list');if(matchMedia('(prefers-reduced-motion: reduce)').matches){state.full=null;sync();focusFullOrigin();return}viewTimer=setTimeout(()=>{if(token!==viewToken)return;panel.classList.remove('view-leaving','view-open');state.full=null;sync();focusFullOrigin()},260)}
function sync(){const modal=!!state.sheet||state.tools;$('#phone').classList.toggle('drawer-open',state.open);$('#sidebar').inert=!state.open||!!state.full||modal;$('#all-sessions').hidden=!state.full;$('#all-sessions').inert=!state.full||modal;$('#all-sessions').classList.toggle('view-open',!!state.full);$('#workspace').inert=state.open||modal;$('.dimmer').inert=!state.open||!!state.full||modal;$('#sheet-layer').hidden=!state.sheet;$('#tools-layer').hidden=!state.tools;$('#tools-panel').inert=!state.tools;$('#tools-trigger').setAttribute('aria-expanded',String(state.tools))}
function toggleTools(open){state.tools=open;sync();(open?$('#tools-panel [data-action="close-tools"]'):$('#tools-trigger')).focus({preventScroll:true})}
function setOpen(open){cancelViewMotion();state.tools=false;state.open=open;if(!open){state.full=null;state.directoryReturn=null;$('#sidebar').classList.remove('behind-list')}sync();(open?$('.brand-row [data-action="close"]'):$('.workspace-head button')).focus({preventScroll:true})}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2100)}
function showSheet(type,title,subtitle,body){if(!state.sheet){returnFocus=state.tools?$('#tools-trigger'):document.activeElement;state.toolsOrigin=state.tools?document.activeElement:null}state.tools=false;state.sheet=type;$('#sheet-title').textContent=title;$('#sheet-sub').textContent=subtitle;$('#sheet-body').innerHTML=body;sync();$('.sheet-head button').focus({preventScroll:true})}
function dismiss(){state.sheet=null;if(state.toolsOrigin){const origin=state.toolsOrigin;state.toolsOrigin=null;state.tools=true;sync();origin.focus({preventScroll:true});return}sync();if(returnFocus?.isConnected&&!returnFocus.closest('[inert],[hidden]'))returnFocus.focus({preventScroll:true})}
function showNew(folder){state.newFolder=folder||visibleFolders()[0].id;state.newAgent='codex';showSheet('new','开启新会话','给一个想法，留一小块空间。',`<form id="new-form"><label class="field" for="new-title">会话名称</label><input class="field-input" id="new-title" placeholder="今天想做点什么？" maxlength="100" autocomplete="off"><label class="field" for="new-folder">工作目录</label><select class="field-input" id="new-folder">${visibleFolders().map(f=>`<option value="${esc(f.id)}" ${f.id===state.newFolder?'selected':''}>${esc(f.name)} · ${esc(f.path)}</option>`).join('')}</select><span class="field">选择 Agent</span><div class="options">${Object.entries(agents).map(([id,a])=>`<button type="button" class="option" data-agent="${id}" aria-pressed="${id===state.newAgent}">${esc(a.name)}</button>`).join('')}</div><button type="submit" class="submit">创建演示会话 ${icon('plus')}</button></form>`)}
function renderWorkspace(){const s=sessions.find(s=>s.id===state.selected),button=$('#workspace-archive');button.hidden=!s;button.title=s?s.title:'';if(!s){$('#workspace-title').textContent='你的工作空间';$('#workspace-sub').textContent='选择一条会话继续';return}$('#workspace-title').textContent=s.title;$('#workspace-sub').textContent=agents[s.agent].name+' · '+folders.find(f=>f.id===s.folder).name+(s.archived?' · 已归档':'');button.innerHTML=icon(s.archived?'restore':'archive')+`<span>${s.archived?'恢复当前会话':'归档当前会话'}</span>`}
function setArchived(id,archived){const s=sessions.find(s=>s.id===id);if(!s||!visibleFolders().some(f=>f.id===s.folder)||!!s.archived===archived)return;const position=$('#all-scroll').scrollTop,sidebarTop=$('#sidebar-scroll').scrollTop,origin=state.fullOrigin,focused=document.activeElement,restoreButtons=[...$('#all-scroll').querySelectorAll('[data-restore]')],restoreIndex=restoreButtons.indexOf(focused);if(archived){s.previousStatus=s.status;s.status='已归档';s.archivedAt=Date.now();s.archived=true}else{s.archived=false;s.status=s.previousStatus||'历史';delete s.archivedAt;state.expanded=s.folder}render();$('#sidebar-scroll').scrollTop=sidebarTop;if(state.full){renderFull();$('#all-scroll').scrollTop=position;if(restoreIndex>=0){const remaining=[...$('#all-scroll').querySelectorAll('[data-restore]')];(remaining[Math.min(restoreIndex,remaining.length-1)]||$('#all-query')).focus({preventScroll:true})}else if(!focused?.isConnected)$('#all-query').focus({preventScroll:true});if(origin?.dataset.all)state.fullOrigin=$(`[data-all="${origin.dataset.all}"]`)}else if(!focused?.isConnected)($(`[data-all="archive"]`)||$('#search')).focus({preventScroll:true});toast(archived?'已归档，可在归档页恢复':'已恢复到 '+folders.find(f=>f.id===s.folder).name)}
function selectSession(id){const s=sessions.find(s=>s.id===id);if(!s||!visibleFolders().some(f=>f.id===s.folder))return;if(!s.archived)touchRecent(s);state.expanded=s.folder;state.selected=id;render();setOpen(false)}
function hosts(){showSheet('hosts','切换电脑','每台电脑，各自一个工作空间。',machines.map(h=>`<button class="choice" data-host="${h.id}" aria-pressed="${h.id===state.host}">${icon('computer')}<span class="choice-text"><strong>${h.name}</strong><small>${h.status}</small></span>${h.id===state.host?icon('check'):icon('chevron')}</button>`).join(''))}
function choosePalette(name){if(!Object.hasOwn(paletteNames,name))return;state.palette=name;document.body.dataset.palette=name;$('#palette-name').textContent=paletteNames[name];document.querySelectorAll('.palette-swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.palette===name)))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.restore){setArchived(d.restore,false);return}if(d.fullDir){openDirectorySessions(d.fullDir);return}if(d.all){openFull(d.all);return}if(d.palette){choosePalette(d.palette);return}if(d.folder){toggleFolder(d.folder);return}if(d.session){selectSession(d.session);return}if(d.newFolder){showNew(d.newFolder);return}if(d.agent){state.newAgent=d.agent;document.querySelectorAll('[data-agent]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.agent===state.newAgent)));return}if(d.host){state.host=d.host;state.expanded=visibleFolders()[0].id;state.query='';$('#search').value='';state.selected=sessions.find(s=>s.folder===state.expanded)?.id||null;state.full=null;state.directoryReturn=null;dismiss();render();toast('已切换到 '+machines.find(h=>h.id===state.host).name);return}switch(d.action){case'tools':toggleTools(true);break;case'close-tools':toggleTools(false);break;case'back-list':closeFull();break;case'more-list':{const position=$('#all-scroll').scrollTop;state.shown+=PAGE_SIZE;renderFull();$('#all-scroll').scrollTop=position;break}case'open':setOpen(true);break;case'close':setOpen(false);break;case'clear':state.query='';$('#search').value='';render();$('#search').focus();break;case'new':showNew();break;case'archive':openFull('archive');break;case'archive-current':{const current=sessions.find(s=>s.id===state.selected);if(current)setArchived(current.id,!current.archived);break}case'dismiss':dismiss();break;case'hosts':hosts();break;case'downloads':showSheet('downloads','下载','来自 Studio MacBook 的示例文件',`<div class="choice">${icon('download')}<span class="choice-text"><strong>interaction-notes.txt</strong><small>本地示例 · 1 KB</small></span></div><button class="submit" data-action="save">保存示例文件 ${icon('download')}</button>`);break;case'save':{const url=URL.createObjectURL(new Blob(['Orbis · Neumorphic Sidebar\n本地设计稿下载示例。'],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='interaction-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已生成示例文件');break}case'settings':showSheet('settings','外观与手感','同色表面，用光和阴影区分层次。',`<p style="margin:0 9px 16px">当前配色：${paletteNames[state.palette]}</p><p style="margin:0 9px 4px">目录可展开，选中项向内凹陷。<br>所有会话和电脑都是本地演示数据。</p>`);break}});
$('#search').addEventListener('input',e=>{state.query=e.target.value;render()});
$('#all-query').addEventListener('input',e=>{state.fullQuery=e.target.value;state.shown=PAGE_SIZE;renderFull();$('#all-scroll').scrollTop=0});
document.addEventListener('submit',e=>{if(e.target.id!=='new-form')return;e.preventDefault();const title=$('#new-title').value.trim()||'一个新的想法',id='n'+Date.now();state.newFolder=$('#new-folder').value;sessions.unshift({id,folder:state.newFolder,title,agent:state.newAgent,status:'本地草稿',time:'刚刚'});touchRecent(sessions[0]);state.expanded=state.newFolder;state.selected=id;state.full=null;state.directoryReturn=null;state.query='';$('#search').value='';dismiss();render();$('#sidebar-scroll').scrollTop=0;toast('已添加演示会话')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();state.sheet?dismiss():state.tools?toggleTools(false):state.full?closeFull():state.open?setOpen(false):setOpen(true);return}if(e.key!=='Tab')return;const root=state.sheet?$('.sheet'):state.tools?$('#tools-panel'):state.full?$('#all-sessions'):state.open?$('#sidebar'):null;if(!root)return;const controls=[...root.querySelectorAll('button,input,select')].filter(el=>!el.disabled&&!el.closest('[inert],[hidden]')&&el.getClientRects().length);if(!controls.length)return;const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
render();sync();
