# Include inside each HTTPS server block for orbising.com.
location = /beta-review { return 308 /beta-review/; }
location ^~ /beta-review/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    access_log off;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
# Only the standard phone pairing and device transport are public.
location = /review-relay/v1/pairings {
    proxy_pass http://127.0.0.1:8788/v1/pairings;
    include /etc/nginx/snippets/orbis-proxy.conf;
}
location = /review-relay/v1/device {
    proxy_pass http://127.0.0.1:8789/v1/device;
    include /etc/nginx/snippets/orbis-proxy.conf;
}
location ^~ /review-relay/ { return 404; }
