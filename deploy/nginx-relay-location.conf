# Include this inside the TLS server block when Nginx already owns ports 80/443.
# Clients then use wss://your-domain.example/relay.
location ^~ /relay/ {
    # The trailing slash strips /relay/ before forwarding. Relay therefore sees
    # /v1/device, /v1/runtime, /v1/pairings, and /healthz as expected.
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
}
