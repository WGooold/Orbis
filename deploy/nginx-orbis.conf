# Include in nginx http context after replacing the domain and certificate paths.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name orbising.com;
    location /.well-known/acme-challenge/ { root /var/www/orbis-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name orbising.com;
    ssl_certificate /etc/letsencrypt/live/orbising.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbising.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location /.well-known/acme-challenge/ { root /var/www/orbis-acme; }
    location = /relay { return 308 /relay/; }
    location /downloads/ {
        alias /var/www/orbis-downloads/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control no-cache;
        try_files $uri @relay_download;
    }
    location @relay_download {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /relay/ {
        proxy_pass http://127.0.0.1:8787/;
        include /etc/nginx/snippets/orbis-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/orbis-proxy.conf;
    }
}
