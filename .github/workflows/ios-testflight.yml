name: iOS TestFlight (external)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release externally, upload only for validation, resume an existing build, or read status
        type: choice
        options: [release, upload, resume, status]
        default: release
      version:
        description: iOS marketing version (must match the archived app)
        type: string
        required: true
      build:
        description: iOS build number (choose an unused number for release)
        type: string
        required: true
      what_to_test:
        description: Tester-facing notes for release/resume (no private reviewer links)
        type: string
      notify_approved_build:
        description: Send Apple notification to all testers assigned to this build after Beta Review approval
        type: boolean
        default: false
      review_ready:
        description: Confirm review Host, reviewer instructions and exact candidate validation are ready for external distribution
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: orbis-ios-testflight-external
  cancel-in-progress: false

jobs:
  testflight:
    # Production distribution runs only from reviewed main; resume always targets the explicit build.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 55
    env:
      IOS_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build }}
      ASC_TESTFLIGHT_NOTES: ${{ inputs.what_to_test }}
    steps:
      - name: Check external release inputs
        if: inputs.operation == 'release' || inputs.operation == 'resume'
        env:
          REVIEW_READY: ${{ inputs.review_ready }}
        run: |
          set -euo pipefail
          if [[ "$REVIEW_READY" != true ]]; then
            echo 'Verify the review environment and instructions before external distribution.' >&2
            exit 1
          fi
          : "${ASC_TESTFLIGHT_NOTES:?Add tester-facing What to Test notes.}"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Read external TestFlight status
        if: inputs.operation == 'status'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: node scripts/ios-testflight-external.mjs status --version "$IOS_VERSION" --build "$BUILD_NUMBER"
      - name: Check release preflight and export declaration
        if: inputs.operation == 'release'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          python3 scripts/check-ios-export-compliance.py ios/Orbis/Orbis/Info.plist
          node scripts/ios-testflight-external.mjs preflight --version "$IOS_VERSION" --build "$BUILD_NUMBER"
      - name: Check upload-only candidate and export declaration
        if: inputs.operation == 'upload'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          python3 scripts/check-ios-export-compliance.py ios/Orbis/Orbis/Info.plist
          node scripts/ios-testflight-external.mjs preflight --upload-only --version "$IOS_VERSION" --build "$BUILD_NUMBER"
      - name: Check existing verified iOS CI run for HEAD
        id: ios-verified
        if: inputs.operation == 'release' || inputs.operation == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verdict=$(node scripts/ci-verified-checks.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --mode ios)
          echo "$verdict"
          if printf '%s' "$verdict" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("verified") else 1)'; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Identify Swift toolchain
        id: swift
        if: (inputs.operation == 'release' || inputs.operation == 'upload') && steps.ios-verified.outputs.verified != 'true'
        run: echo "version=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Swift test bundle cache
        if: (inputs.operation == 'release' || inputs.operation == 'upload') && steps.ios-verified.outputs.verified != 'true'
        uses: actions/cache@v4
        with:
          path: ios/Orbis/.build
          key: swift-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('ios/Orbis/Package.swift', 'ios/Orbis/Orbis/**', 'ios/Orbis/Tests/**', 'shared/**', 'scripts/check-ios.sh') }}
          restore-keys: |
            swift-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-
      - name: Verify core protocol and build iOS Simulator app
        if: (inputs.operation == 'release' || inputs.operation == 'upload') && steps.ios-verified.outputs.verified != 'true'
        run: bash scripts/check-ios.sh
      - name: Archive, verify the signed bundle, and upload to TestFlight
        if: inputs.operation == 'release' || inputs.operation == 'upload'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_KEY_ID:?缺少 secret APP_STORE_CONNECT_KEY_ID}"
          : "${ASC_ISSUER_ID:?缺少 secret APP_STORE_CONNECT_ISSUER_ID}"
          : "${ASC_KEY_P8_BASE64:?缺少 secret APP_STORE_CONNECT_KEY_P8_BASE64}"
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          archive="$RUNNER_TEMP/Orbis.xcarchive"
          options="$RUNNER_TEMP/ExportOptions.plist"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/Orbis/Orbis.xcodeproj -scheme Orbis -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${auth[@]}" archive
          app_path=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$archive/Info.plist")
          app="$archive/Products/$app_path"
          python3 scripts/check-ios-export-compliance.py "$app/Info.plist" --version "$IOS_VERSION" --build "$BUILD_NUMBER"
          codesign --verify --deep --strict "$app"
          cat > "$options" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>Z5KBY7SP63</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          printf 'Apple upload accepted for Orbis iOS %s (%s). This does not establish external availability.\n' "$IOS_VERSION" "$BUILD_NUMBER"
      - name: Add exact build to Orbis external testing and submit if needed
        if: inputs.operation == 'release' || inputs.operation == 'resume'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          NOTIFY_APPROVED: ${{ inputs.notify_approved_build }}
        run: |
          set -euo pipefail
          # Bash 3.2 with nounset rejects expansion of an empty array.
          set -- scripts/ios-testflight-external.mjs distribute --version "$IOS_VERSION" --build "$BUILD_NUMBER" --wait 720
          if [[ "$NOTIFY_APPROVED" == true ]]; then set -- "$@" --notify-approved; fi
          node "$@"
