name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Verify core protocol and build iOS Simulator app
        run: bash scripts/check-ios.sh
      - name: Archive, sign, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          # 每次上传的构建号必须比上一次大；run_number 在本 workflow 内单调递增。
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?缺少 secret APP_STORE_CONNECT_KEY_ID}"
          : "${ASC_ISSUER_ID:?缺少 secret APP_STORE_CONNECT_ISSUER_ID}"
          : "${ASC_KEY_P8_BASE64:?缺少 secret APP_STORE_CONNECT_KEY_P8_BASE64}"
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          archive="$RUNNER_TEMP/Orbis.xcarchive"
          options="$RUNNER_TEMP/ExportOptions.plist"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$key"
          # 自动签名 + API 密钥：发布证书与描述文件由 Xcode 云端管理，runner 上不落证书。
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/Orbis/Orbis.xcodeproj -scheme Orbis -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${auth[@]}" archive
          cat > "$options" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>Z5KBY7SP63</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$archive/Info.plist")
          echo "Uploaded Orbis iOS $version ($BUILD_NUMBER) to TestFlight"
