name: iOS native build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Compile Swift test bundle
        run: bash scripts/check-ios.sh prepare-tests
      - name: Run Swift tests
        run: bash scripts/check-ios.sh tests

  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify iOS Simulator app
        run: bash scripts/check-ios.sh app

  build:
    if: always()
    needs: [tests, simulator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify iOS results
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
        run: test "$TESTS_RESULT" = success && test "$SIMULATOR_RESULT" = success
