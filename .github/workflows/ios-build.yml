name: iOS native build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/check-ios.sh'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'scripts/check-ios.sh'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Verify core protocol and build iOS Simulator app
        run: bash scripts/check-ios.sh
