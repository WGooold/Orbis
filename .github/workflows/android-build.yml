name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 发版证书指纹。签名一变，已装用户就无法覆盖升级，所以产物证书不符直接失败，
      # 而不是把一个"能装但升不上去"的 APK 交给发版流程。
      ORBIS_RELEASE_CERT_SHA256: 1bac1a243db5655a906f148f4104fc744d4ae9cadf59c8b95a68ea63ac00ae6a
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ORBIS_RELEASE_KEYSTORE_BASE64 }}
          # Gradle 把 ORG_GRADLE_PROJECT_* 映射成同名项目属性；密码不出现在命令行参数里。
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIS_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_KEY_ALIAS: ${{ secrets.ORBIS_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 secret ORBIS_RELEASE_KEYSTORE_BASE64}"
          keystore="$RUNNER_TEMP/orbis-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          ORG_GRADLE_PROJECT_ORBIS_RELEASE_STORE_FILE="$keystore" sh ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signature and stage artifact
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          signers=$(grep -c 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt")
          digest=$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([a-f0-9]{64})$/\1/p' "$RUNNER_TEMP/certs.txt")
          [ "$signers" = 1 ] && [ "$digest" = "$ORBIS_RELEASE_CERT_SHA256" ] || { echo "Unexpected signing certificate: $digest"; exit 1; }
          mkdir -p .artifacts/android
          cp "$apk" .artifacts/android/orbis.apk
          (cd .artifacts/android && sha256sum orbis.apk > orbis.apk.sha256)
          cat .artifacts/android/orbis.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Orbis-android
          if-no-files-found: error
          path: |
            .artifacts/android/orbis.apk
            .artifacts/android/orbis.apk.sha256
