name: Relay deploy

on:
  workflow_call:
    inputs:
      skip_checks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_checks:
        description: 'Skip Core checks when this exact commit already passed CI'
        required: false
        type: boolean
        default: false
      windows_build_run_id:
        description: 'Optional successful Windows Host build run ID to publish on the website'
        required: false
        type: string
      macos_build_run_id:
        description: 'Optional successful macOS Host build run ID to publish on the website'
        required: false
        type: string
      linux_build_run_id:
        description: 'Optional successful Linux CLI build run ID to publish on the website'
        required: false
        type: string
      android_release_tag:
        description: 'Optional GitHub release containing verified orbis.apk and orbis.apk.sha256 assets'
        required: false
        type: string
      android_apk_sha256:
        description: 'Required SHA-256 of the locally verified APK when publishing Android'
        required: false
        type: string

# 一次只跑一个部署，且不取消进行中的那个：部署中途被打断会留下候选容器。
concurrency:
  group: relay-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.gate.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check existing verified CI run for HEAD
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_INPUT: ${{ inputs.skip_checks }}
        run: |
          set -euo pipefail
          if [[ "$SKIP_INPUT" == "true" ]]; then
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
            echo "Core checks skipped via workflow input."
            exit 0
          fi
          verdict=$(node scripts/ci-verified-checks.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --mode core-full)
          echo "$verdict"
          if printf '%s' "$verdict" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("verified") else 1)'; then
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: preflight
    if: needs.preflight.outputs.run_checks == 'true'
    uses: ./.github/workflows/core-checks.yml

  deploy:
    name: 部署到服务器
    needs: [preflight, check]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.check.result == 'success' || (needs.preflight.outputs.run_checks == 'false' && needs.check.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET: ${{ secrets.ORBIS_DEPLOY_TARGET || secrets.PI_REMOTE_DEPLOY_TARGET }}
      PORT: ${{ secrets.ORBIS_SSH_PORT || secrets.PI_REMOTE_SSH_PORT }}
      APP_DIR: ${{ secrets.ORBIS_DEPLOY_DIR || secrets.PI_REMOTE_DEPLOY_DIR }}
      HEALTH_URL: ${{ secrets.ORBIS_HEALTH_URL || secrets.PI_REMOTE_HEALTH_URL }}
      SSH_KEY_FILE: /tmp/orbis-deploy-key
      SSH_PRIVATE_KEY: ${{ secrets.ORBIS_SSH_KEY || secrets.PI_REMOTE_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.ORBIS_SSH_KNOWN_HOSTS || secrets.PI_REMOTE_SSH_KNOWN_HOSTS }}
      WINDOWS_BUILD_RUN: ${{ inputs.windows_build_run_id }}
      MACOS_BUILD_RUN: ${{ inputs.macos_build_run_id }}
      LINUX_BUILD_RUN: ${{ inputs.linux_build_run_id }}
      ANDROID_RELEASE_TAG: ${{ inputs.android_release_tag }}
      ANDROID_APK_SHA256: ${{ inputs.android_apk_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 打包 HEAD
        run: |
          set -euo pipefail
          release="$(git rev-parse --short=12 HEAD)"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          git archive --format=tar.gz --output="/tmp/orbis-relay-$release.tar.gz" HEAD
          echo "待部署版本：$release"

      - name: Validate requested Host builds
        if: inputs.windows_build_run_id != '' || inputs.macos_build_run_id != '' || inputs.linux_build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          release = os.environ['RELEASE']
          repository = os.environ['GITHUB_REPOSITORY']
          targets = [
              (os.environ['WINDOWS_BUILD_RUN'], 'windows-host-build.yml'),
              (os.environ['MACOS_BUILD_RUN'], 'macos-host-build.yml'),
              (os.environ['LINUX_BUILD_RUN'], 'linux-host-build.yml'),
          ]
          for run_id, workflow in targets:
              if not run_id:
                  continue
              assert run_id.isdigit(), f'invalid run id: {run_id}'
              raw = subprocess.check_output(['gh', 'api', f'repos/{repository}/actions/runs/{run_id}'])
              run = json.loads(raw)
              assert run['conclusion'] == 'success', f'{workflow} run {run_id} concluded {run["conclusion"]}'
              assert run['head_branch'] == 'main', f'{workflow} run {run_id} is not from main: {run["head_branch"]}'
              assert run['path'] == f'.github/workflows/{workflow}', f'unexpected workflow: {run["path"]}'
              # 装到官网上的产物必须就是这个 HEAD 构建的：版本号相同、提交不同
              # 的 run 会让下载页挂着一份与 deployed-commit 对不上的安装包。
              assert run['head_sha'].startswith(release), f'{workflow} run is {run["head_sha"]}, release is {release}'
              print(f'Verified {workflow} run {run_id} ({run["head_sha"][:12]})')
          PY
          if [[ -n "$WINDOWS_BUILD_RUN" || -n "$MACOS_BUILD_RUN" || -n "$LINUX_BUILD_RUN" ]]; then
            echo 'PUBLISH_HOST_DOWNLOADS=true' >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        if: inputs.windows_build_run_id != ''
        with:
          name: OrbisHost-windows-x64
          path: /tmp/orbis-windows-artifact
          run-id: ${{ inputs.windows_build_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: inputs.macos_build_run_id != ''
        with:
          name: OrbisHost-macos-arm64
          path: /tmp/orbis-macos-artifact/arm64
          run-id: ${{ inputs.macos_build_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: inputs.macos_build_run_id != ''
        with:
          # 两个架构分别落到自己的目录：两边的 artifact 都带 smoke/qml.log，
          # 合到同一目录会撞名（merge-multiple 直接覆盖）。
          name: OrbisHost-macos-x64
          path: /tmp/orbis-macos-artifact/x64
          run-id: ${{ inputs.macos_build_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: inputs.linux_build_run_id != ''
        with:
          name: OrbisHost-linux-x64-cli
          path: /tmp/orbis-linux-artifact/x64
          run-id: ${{ inputs.linux_build_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: inputs.linux_build_run_id != ''
        with:
          name: OrbisHost-linux-arm64-cli
          path: /tmp/orbis-linux-artifact/arm64
          run-id: ${{ inputs.linux_build_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Android SDK for APK metadata extraction
        if: inputs.android_release_tag != ''
        uses: android-actions/setup-android@v3
        with:
          # 上游 SDK 已移除 `tools` 包；保留默认的 `tools platform-tools` 会让
          # sdkmanager 直接以 exit 1 退出（Failed to find package 'tools'）。
          # 这里只需要 aapt，build-tools 由下一步显式安装。
          packages: 'platform-tools'
      - name: Install Android build tools
        if: inputs.android_release_tag != ''
        run: sdkmanager "build-tools;35.0.0"

      - name: Verify Host download checksums
        if: env.PUBLISH_HOST_DOWNLOADS == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re
          cmake = Path('packages/windows-host/CMakeLists.txt').read_text()
          version = re.search(r'project\(OrbisHost VERSION ([0-9]+\.[0-9]+\.[0-9]+)', cmake).group(1)
          wanted = []
          if os.environ['WINDOWS_BUILD_RUN']:
              wanted += [f'OrbisHost-{version}-windows-x64-setup.exe', f'OrbisHost-{version}-windows-x64.zip']
          if os.environ['MACOS_BUILD_RUN']:
              wanted += [f'OrbisHost-{version}-macos-arm64.dmg', f'OrbisHost-{version}-macos-x64.dmg']
          if os.environ['LINUX_BUILD_RUN']:
              wanted += [f'OrbisHost-{version}-linux-{arch}-cli.tar.gz' for arch in ('x64', 'arm64')]
          roots = [Path(path) for path in ('/tmp/orbis-windows-artifact', '/tmp/orbis-macos-artifact', '/tmp/orbis-linux-artifact') if Path(path).is_dir()]
          for name in wanted:
              matches = [match for root in roots for match in root.rglob(name)]
              assert len(matches) == 1, name
              file = matches[0]
              checksum = file.with_name(name + '.sha256')
              assert hashlib.sha256(file.read_bytes()).hexdigest() == checksum.read_text().split()[0], name
              print(f'Verified {name}')
          PY

      - name: Download and verify requested Android release
        if: inputs.android_release_tag != '' || inputs.android_apk_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ANDROID_RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          [[ "$ANDROID_APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p /tmp/orbis-android-artifact
          gh release download "$ANDROID_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern orbis.apk --pattern orbis.apk.sha256 --dir /tmp/orbis-android-artifact
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          root = Path('/tmp/orbis-android-artifact')
          apk = root / 'orbis.apk'
          expected = os.environ['ANDROID_APK_SHA256']
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == expected, 'APK hash mismatch'
          assert (root / 'orbis.apk.sha256').read_text().split() == [expected, 'orbis.apk'], 'Invalid checksum file'
          with zipfile.ZipFile(apk) as archive:
              assert 'AndroidManifest.xml' in archive.namelist(), 'Missing Android manifest'
              assert 'classes.dex' in archive.namelist(), 'Missing Android code'
          import re, subprocess
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0' / 'aapt'
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          package = next(line for line in badging.splitlines() if line.startswith('package:'))
          version = re.search(r"versionName='([^']+)'", package).group(1)
          version_code = int(re.search(r"versionCode='([0-9]+)'", package).group(1))
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Invalid Android versionName'
          assert version_code > 0, 'Invalid Android versionCode'
          (root / 'orbis.apk.version.json').write_text(json.dumps({
              'version': version, 'versionCode': version_code, 'sha256': expected,
          }, separators=(',', ':')) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_APP_VERSION={version}\nANDROID_APP_VERSION_CODE={version_code}\n')
          print(f'Verified Android APK version: {version} ({version_code})')
          print('Verified Android APK SHA-256: ' + expected)
          PY

      - name: 准备 SSH
        run: |
          set -euo pipefail
          : "${TARGET:?缺少 secret ORBIS_DEPLOY_TARGET}"
          : "${PORT:?缺少 secret ORBIS_SSH_PORT}"
          : "${APP_DIR:?缺少 secret ORBIS_DEPLOY_DIR}"
          : "${HEALTH_URL:?缺少 secret ORBIS_HEALTH_URL}"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          : "${SSH_KNOWN_HOSTS:?Missing pinned host keys}"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - name: 服务器已是这个版本就跳过
        id: skip
        run: |
          set -euo pipefail
          deployed="$(ssh -p "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$TARGET" "cat $APP_DIR/shared/deployed-commit 2>/dev/null || true" | tr -d '\r\n')"
          if [[ "$deployed" == "$RELEASE" && -z "$WINDOWS_BUILD_RUN" && -z "$MACOS_BUILD_RUN" && -z "$LINUX_BUILD_RUN" && -z "$ANDROID_RELEASE_TAG" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "expected_commit=$RELEASE" >> "$GITHUB_OUTPUT"
            echo "服务器已经是 $RELEASE，跳过构建与切换。"
          elif [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && -n "$deployed" && -z "$WINDOWS_BUILD_RUN" && -z "$MACOS_BUILD_RUN" && -z "$LINUX_BUILD_RUN" && -z "$ANDROID_RELEASE_TAG" ]] &&
            git cat-file -e "${deployed}^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$RELEASE" "$deployed"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "expected_commit=$deployed" >> "$GITHUB_OUTPUT"
            echo "服务器已运行更新的 main 提交 $deployed（包含 $RELEASE），跳过旧提交覆盖。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "expected_commit=$RELEASE" >> "$GITHUB_OUTPUT"
            echo "服务器当前 ${deployed:-<无标记>} → 将部署 $RELEASE"
          fi

      - name: 上传归档与远端部署脚本
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          scp -P "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "/tmp/orbis-relay-$RELEASE.tar.gz" "$TARGET:/tmp/orbis-relay-$RELEASE.tar.gz"
          scp -P "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            deploy/remote-deploy.sh "$TARGET:/tmp/orbis-remote-deploy-$RELEASE.sh"
          if [[ -n "$WINDOWS_BUILD_RUN" || -n "$MACOS_BUILD_RUN" || -n "$LINUX_BUILD_RUN" ]]; then
            upload_args=(
              --archive "/tmp/orbis-downloads-$RELEASE.tar"
              --remote-archive "/tmp/orbis-downloads-$RELEASE.tar"
              --target "$TARGET"
              --port "$PORT"
              --key-file "$SSH_KEY_FILE"
              --app-dir "$APP_DIR"
              --root /tmp/orbis-windows-artifact
              --root /tmp/orbis-macos-artifact
              --root /tmp/orbis-linux-artifact
              --workers 8
            )
            if [[ -n "$WINDOWS_BUILD_RUN" ]]; then upload_args+=(--windows-selected); fi
            if [[ -n "$MACOS_BUILD_RUN" ]]; then upload_args+=(--macos-selected); fi
            if [[ -n "$LINUX_BUILD_RUN" ]]; then upload_args+=(--linux-selected); fi
            python3 deploy/upload-host-downloads.py "${upload_args[@]}"
          fi

      - name: 在服务器上构建、健康检查并切换
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          downloads=""
          if [[ -n "$WINDOWS_BUILD_RUN" || -n "$MACOS_BUILD_RUN" || -n "$LINUX_BUILD_RUN" ]]; then downloads="/tmp/orbis-downloads-$RELEASE.tar"; fi
          ssh -p "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$TARGET" "bash /tmp/orbis-remote-deploy-$RELEASE.sh '$RELEASE' \
              '/tmp/orbis-relay-$RELEASE.tar.gz' '$APP_DIR' '$HEALTH_URL' '$downloads'"
          ssh -p "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$TARGET" "rm -f /tmp/orbis-remote-deploy-$RELEASE.sh" || true

      - name: 核对公网版本与服务器部署标记
        env:
          EXPECTED_COMMIT: ${{ steps.skip.outputs.expected_commit }}
          WAS_SKIPPED: ${{ steps.skip.outputs.skip }}
        run: |
          set -euo pipefail
          deployed="$(ssh -p "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$TARGET" "cat $APP_DIR/shared/deployed-commit" | tr -d '\r\n')"
          if [[ "$WAS_SKIPPED" == "true" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]] && git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            git merge-base --is-ancestor "$RELEASE" "$deployed"
          else
            test "$deployed" = "$EXPECTED_COMMIT"
          fi
          health="$(curl -fsS --max-time 20 "$HEALTH_URL")"
          printf '%s' "$health" | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["status"] == "ok" and value["commit"] == sys.argv[1]' "$deployed"
          echo "Verified deployed-commit and public health: $deployed"
          site_url="${HEALTH_URL%/healthz}/"
          site_body="$(curl -fsS --max-time 20 "$site_url")"
          admin_body="$(curl -fsS --max-time 20 "${site_url}admin/")"
          grep -q 'Nothing But the Remote' <<<"$site_body"
          grep -q 'Relay 控制台' <<<"$admin_body"
          status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${site_url}v1/admin/overview")"
          test "$status" = 401

      - name: Read back public Linux CLI archives
        if: inputs.linux_build_run_id != ''
        run: |
          set -euo pipefail
          site_url="${HEALTH_URL%/healthz}/"
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          curl -fsS --max-time 20 "${site_url}v1/site" > "$dir/site.json"
          for sum in /tmp/orbis-linux-artifact/*/*.sha256; do
            name=$(basename "$sum" .sha256)
            sha=$(awk '{print $1}' "$sum")
            jq -e --arg name "$name" --arg sha "$sha" '.linux | any(.name == $name and .sha256 == $sha)' "$dir/site.json" >/dev/null
            curl -fsS --max-time 180 "${site_url}downloads/$name" -o "$dir/$name"
            (cd "$dir" && sha256sum -c "$sum")
            curl -fsS --max-time 20 "${site_url}downloads/$name.sha256" | cmp - "$sum"
          done

      - name: Publish verified Android download
        if: inputs.android_release_tag != ''
        run: |
          set -euo pipefail
          remote_dir="/tmp/orbis-android-$ANDROID_APK_SHA256"
          ssh -p "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$TARGET" "install -d -m 700 '$remote_dir'"
          scp -P "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            /tmp/orbis-android-artifact/orbis.apk /tmp/orbis-android-artifact/orbis.apk.sha256 \
            /tmp/orbis-android-artifact/orbis.apk.version.json \
            "$TARGET:$remote_dir/"
          ssh -p "$PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$TARGET" "bash -s -- '$ANDROID_APK_SHA256' '$ANDROID_APP_VERSION' '$ANDROID_APP_VERSION_CODE'" < deploy/remote-publish-android.sh
