name: macOS Host build

on:
  workflow_dispatch:
    inputs:
      signing:
        description: macOS signing and notarization
        type: choice
        options: [developer-id, ad-hoc]
        default: developer-id

permissions:
  contents: read

jobs:
  check:
    # The complete existing suite has Windows filesystem and launcher assumptions.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/relayquic/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --maxWorkers=1 --retry=1 --testTimeout=30000

  macos-host:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            artifact: macos-arm64
            node_architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            artifact: macos-x64
            node_architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      ORBIS_SIGNING_MODE: ${{ inputs.signing || 'developer-id' }}
      ORBIS_MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Developer ID and notarization credentials
        if: env.ORBIS_SIGNING_MODE == 'developer-id'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${ORBIS_MACOS_TEAM_ID:?Missing variable MACOS_TEAM_ID}"
          : "${P12_BASE64:?Missing secret MACOS_DEVELOPER_ID_P12_BASE64}"
          : "${P12_PASSWORD:?Missing secret MACOS_DEVELOPER_ID_P12_PASSWORD}"
          : "${NOTARY_APPLE_ID:?Missing secret MACOS_NOTARY_APPLE_ID}"
          : "${NOTARY_APP_PASSWORD:?Missing secret MACOS_NOTARY_APP_PASSWORD}"
          keychain="$RUNNER_TEMP/orbis-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          python3 -c 'import os, base64, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "orbis-signing.p12").write_bytes(base64.b64decode(os.environ["P12_BASE64"], validate=True))'
          security import "$RUNNER_TEMP/orbis-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity=$(python3 scripts/macos-sign.py identity --team-id "$ORBIS_MACOS_TEAM_ID" --keychain "$keychain")
          xcrun notarytool store-credentials orbis-macos --keychain "$keychain" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$ORBIS_MACOS_TEAM_ID" --password "$NOTARY_APP_PASSWORD"
          echo "ORBIS_MACOS_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "ORBIS_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/orbis-signing.p12"
      - name: Verify signing and notarization regressions
        run: python3 -m unittest discover -s scripts -p 'test_macos_sign.py'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/relayquic/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          architecture: ${{ matrix.node_architecture }}
          cache: npm
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          archives: 'qtbase qtdeclarative qttools qtsvg qttranslations'
          cache: true
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify native runner and portable behavior
        run: |
          node -e 'if (process.arch !== "${{ matrix.node_architecture }}") throw new Error("Node architecture mismatch")'
          npx vitest run packages/protocol/src packages/relay/src/admin.test.ts packages/host/src/macos-terminal.test.ts packages/host/src/codex-terminal-macos.test.ts packages/host/src/spawner.test.ts packages/host/src/device-protocol.test.ts packages/host/src/host-protocol-compatibility.test.ts packages/host/src/host-service.test.ts packages/host/src/loopback-server.test.ts --maxWorkers=1 --testTimeout=30000
      - name: Build and package macOS app
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/orbis-macos-build"
          dmg_root="$RUNNER_TEMP/orbis-dmg-root"
          cleanup() {
            status=$?
            rm -rf "$build" "$dmg_root" "$RUNNER_TEMP"/orbis-rw-*.dmg "$RUNNER_TEMP"/orbis-dmg-mnt-* "$RUNNER_TEMP"/OrbisHost-*.dmg
            if [ "$status" -ne 0 ]; then
              mkdir -p .artifacts/host-diagnostics
              # Keep a pending/rejected signed image with its submission report.
              for image in .artifacts/host/*.dmg; do
                if [ -f "$image" ]; then mv "$image" .artifacts/host-diagnostics/; fi
              done
              rm -rf .artifacts/host
            fi
            exit "$status"
          }
          trap cleanup EXIT
          rm -rf .artifacts/host "$build" "$dmg_root"
          npm run build
          cmake -S packages/windows-host -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --output-on-failure
          mkdir -p .artifacts/host
          cp -R "$build/Orbis Host.app" ".artifacts/host/OrbisHost.app"
          "$QT_ROOT_DIR/bin/macdeployqt" .artifacts/host/OrbisHost.app -qmldir="$GITHUB_WORKSPACE/packages/windows-host/src/qml" -verbose=1
          node scripts/package-host-runtime.mjs ".artifacts/host/OrbisHost.app/Contents/Resources/runtime"
          chmod +x .artifacts/host/OrbisHost.app/Contents/Resources/runtime/node/node
          cp LICENSE .artifacts/host/OrbisHost.app/Contents/Resources/LICENSE
          cp packages/windows-host/README.md .artifacts/host/OrbisHost.app/Contents/Resources/README.md
          cp packages/windows-host/THIRD-PARTY-NOTICES.md .artifacts/host/OrbisHost.app/Contents/Resources/THIRD-PARTY-NOTICES.md
          cp -R packages/windows-host/licenses .artifacts/host/OrbisHost.app/Contents/Resources/licenses
          if [ "$ORBIS_SIGNING_MODE" = developer-id ]; then
            python3 scripts/macos-sign.py sign-app --app .artifacts/host/OrbisHost.app \
              --identity "$ORBIS_MACOS_IDENTITY" --team-id "$ORBIS_MACOS_TEAM_ID" \
              --keychain "$ORBIS_MACOS_KEYCHAIN" --report .artifacts/host-diagnostics/signing.json
          else
            codesign --force --deep --sign - .artifacts/host/OrbisHost.app
          fi
          codesign --verify --deep --strict .artifacts/host/OrbisHost.app
          python3 - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path('.artifacts/host').resolve()
          smoke = root / 'smoke'
          smoke.mkdir()
          env = dict(os.environ, PATH='/usr/bin:/bin:/usr/sbin:/sbin')
          try:
              with (smoke / 'qml.log').open('w') as log:
                  subprocess.run([str(root / 'OrbisHost.app/Contents/MacOS/Orbis Host'),
                                  '--smoke-test', '--data-dir', str(smoke),
                                  '--screenshot', str(smoke / 'preview.png')],
                                 env=env, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=90)
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
              import shutil
              shutil.copytree(smoke, pathlib.Path('.artifacts/host-diagnostics'), dirs_exist_ok=True)
              for name in ('qml.log', 'smoke-result.json'):
                  diagnostic = smoke / name
                  if diagnostic.is_file():
                      print(diagnostic.read_text(), flush=True)
              raise
          PY
          ORBIS_COMPATIBLE_RUNTIME="$GITHUB_WORKSPACE/.artifacts/host/OrbisHost.app/Contents/Resources/runtime" \
            npx vitest run packages/host/src/host-protocol-compatibility.test.ts --maxWorkers=1 --testTimeout=30000
          version=$(sed -nE 's/^project\(OrbisHost VERSION ([0-9.]+).*$/\1/p' packages/windows-host/CMakeLists.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          dmg="OrbisHost-$version-${{ matrix.artifact }}.dmg"
          # 不用 `hdiutil create -srcfolder`：它在托管 macOS runner 上会以
          # "create failed - Resource busy" 失败，而且失败点不可见。这里拆成
          # 建可写镜像 → 挂到固定 mountpoint → ditto 拷入 → 卸载 → 压成 UDZO，
          # 每一步出错都能在日志里看到是哪一个。
          rw_image="$RUNNER_TEMP/orbis-rw-${{ matrix.artifact }}.dmg"
          mountpoint="$RUNNER_TEMP/orbis-dmg-mnt-${{ matrix.artifact }}"
          staged_dmg="$RUNNER_TEMP/$dmg"
          rm -f "$rw_image" "$staged_dmg"
          rm -rf "$mountpoint"
          mkdir -p "$mountpoint" "$dmg_root"
          cp -R .artifacts/host/OrbisHost.app "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -size 3g -fs HFS+ -volname "Orbis Host" -ov "$rw_image"
          hdiutil attach "$rw_image" -nobrowse -readwrite -mountpoint "$mountpoint"
          ditto "$dmg_root" "$mountpoint"
          sync
          hdiutil detach "$mountpoint"
          rmdir "$mountpoint" 2>/dev/null || true
          hdiutil convert "$rw_image" -format UDZO -o "$staged_dmg"
          mv "$staged_dmg" ".artifacts/host/$dmg"
          if [ "$ORBIS_SIGNING_MODE" = developer-id ]; then
            python3 scripts/macos-sign.py notarize-dmg --dmg ".artifacts/host/$dmg" \
              --identity "$ORBIS_MACOS_IDENTITY" --team-id "$ORBIS_MACOS_TEAM_ID" \
              --keychain "$ORBIS_MACOS_KEYCHAIN" --profile orbis-macos \
              --report .artifacts/host-diagnostics/notarization.json
          fi
          # Stapling changes the DMG bytes; checksum only the assessed final image.
          (cd .artifacts/host && shasum -a 256 "$dmg" > "$dmg.sha256")
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/orbis-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/orbis-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: OrbisHost-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            .artifacts/host/*.dmg
            .artifacts/host/*.sha256
            .artifacts/host/smoke/*.log
            .artifacts/host/smoke/*.png
            .artifacts/host-diagnostics/*.json
      - name: Preserve macOS signing and smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OrbisHost-${{ matrix.artifact }}-diagnostics
          path: .artifacts/host-diagnostics/
