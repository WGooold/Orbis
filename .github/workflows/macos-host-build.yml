name: macOS Host build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-host:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          archives: 'qtbase qtdeclarative qttools qtsvg qttranslations'
          cache: true
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --maxWorkers=1 --retry=1 --testTimeout=30000
      - name: Build and package macOS app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifacts/host .artifacts/macos-host-build
          npm run build
          cmake -S packages/windows-host -B .artifacts/macos-host-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build .artifacts/macos-host-build --parallel 2
          ctest --test-dir .artifacts/macos-host-build --output-on-failure
          mkdir -p .artifacts/host
          cp -R ".artifacts/macos-host-build/Orbis Host.app" ".artifacts/host/OrbisHost.app"
          "$QT_ROOT_DIR/bin/macdeployqt" .artifacts/host/OrbisHost.app -qmldir="$GITHUB_WORKSPACE/packages/windows-host/src/qml" -verbose=1
          node scripts/package-host-runtime.mjs ".artifacts/host/OrbisHost.app/Contents/Resources/runtime"
          chmod +x .artifacts/host/OrbisHost.app/Contents/Resources/runtime/node/node
          cp LICENSE .artifacts/host/OrbisHost.app/Contents/Resources/LICENSE
          cp packages/windows-host/README.md .artifacts/host/OrbisHost.app/Contents/Resources/README.md
          cp packages/windows-host/THIRD-PARTY-NOTICES.md .artifacts/host/OrbisHost.app/Contents/Resources/THIRD-PARTY-NOTICES.md
          mkdir -p .artifacts/host/dmg-root
          cp -R .artifacts/host/OrbisHost.app .artifacts/host/dmg-root/
          ln -s /Applications .artifacts/host/dmg-root/Applications
          hdiutil create -volname "Orbis Host" -srcfolder .artifacts/host/dmg-root -ov -format UDZO ".artifacts/host/OrbisHost-0.1.11-macos-universal.dmg"
          shasum -a 256 ".artifacts/host/OrbisHost-0.1.11-macos-universal.dmg" | awk '{print tolower($1) "  " $2}' > ".artifacts/host/OrbisHost-0.1.11-macos-universal.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: OrbisHost-macos-universal
          if-no-files-found: error
          path: |
            .artifacts/host/*.dmg
            .artifacts/host/*.sha256