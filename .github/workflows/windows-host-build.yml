name: Windows Host build

on:
  workflow_dispatch:
    inputs:
      installer_checks:
        description: 'Run silent install, read-only license, and Claude plugin installer checks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/core-checks.yml
    with:
      native_compatibility: false

  windows-host:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/relayquic/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          archives: 'qtbase qtdeclarative qttools qtsvg qttranslations'
          cache: true
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, package, and smoke-test native client
        shell: pwsh
        run: |
          $qtBase = Split-Path (Split-Path $env:QT_ROOT_DIR)
          $compiler = Join-Path $qtBase 'Tools\mingw1310_64'
          $inno = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $inno)) { throw 'The runner must provide Inno Setup 6' }
          scripts/windows/windows-host-build.ps1 -QtRoot $env:QT_ROOT_DIR -CompilerRoot $compiler -Package -InnoCompiler $inno
      - name: Verify packaged Host business compatibility
        shell: pwsh
        run: |
          $app = Get-ChildItem .artifacts/host -Recurse -Filter 'OrbisHost.exe' | Select-Object -First 1
          if (!$app) { throw 'Packaged Host executable missing' }
          $env:ORBIS_COMPATIBLE_RUNTIME = Join-Path $app.DirectoryName 'runtime'
          try {
            npx vitest run packages/host/src/host-protocol-compatibility.test.ts --maxWorkers=1 --testTimeout=30000
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Host protocol18/19 compatibility failed' }
          } finally {
            Remove-Item Env:ORBIS_COMPATIBLE_RUNTIME -ErrorAction SilentlyContinue
          }
      - name: Verify installed application
        if: inputs.installer_checks
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem .artifacts/host -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'OrbisHost-installed'
          $smokeDir = Join-Path $setup.DirectoryName 'installer-smoke'
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          # Exercise setup's real plugin commands without installing Claude Code or using an account.
          $claudeFixture = Join-Path $smokeDir 'claude-fixture'
          New-Item -ItemType Directory -Path $claudeFixture -Force | Out-Null
          $originalPath = $env:Path
          $originalClaudeConfig = $env:CLAUDE_CONFIG_DIR
          $env:CLAUDE_CONFIG_DIR = Join-Path $claudeFixture 'config'
          $env:ORBIS_CLAUDE_INSTALL_TEST_LOG = Join-Path $claudeFixture 'calls.jsonl'
          $node = (Get-Command node).Source
          [IO.File]::WriteAllText((Join-Path $claudeFixture 'claude.cmd'), "@echo off`r`n`"$node`" `"%~dp0record.cjs`" %*`r`n", [Text.Encoding]::ASCII)
          # Version probes are read-only; retain exact plugin-mutation counts across install/uninstall.
          [IO.File]::WriteAllText((Join-Path $claudeFixture 'record.cjs'), 'const fs=require("node:fs"),args=process.argv.slice(2);if(args.length===1&&args[0]==="--version"){fs.appendFileSync(process.env.ORBIS_CLAUDE_INSTALL_TEST_LOG+".versions",JSON.stringify(args)+"\n");process.stdout.write("2.1.287 (Claude Code)\n");}else{fs.appendFileSync(process.env.ORBIS_CLAUDE_INSTALL_TEST_LOG,JSON.stringify(args)+"\n");}', [Text.Encoding]::ASCII)
          $env:Path = "$claudeFixture;$originalPath"
          $verificationFailure = $null
          try {
            $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $installDir + '"'),('/LOG="' + $smokeDir + '\install.log"') -WindowStyle Hidden -PassThru -Wait
            if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
            $calls = @(Get-Content $env:ORBIS_CLAUDE_INSTALL_TEST_LOG | ForEach-Object { ,($_ | ConvertFrom-Json) })
            if ($calls.Count -ne 3 -or ($calls[0][0..2] -join ' ') -ne 'plugin marketplace add' -or ($calls[1] -join ' ') -ne 'plugin install orbis-host-session-link@orbis-host --scope user' -or ($calls[2] -join ' ') -ne 'plugin update orbis-host-session-link@orbis-host --scope user') { throw 'Installer did not register and update the Claude plugin' }
            if (!(Test-Path "$installDir\runtime\packages\claude-mod\.claude-plugin\plugin.json")) { throw 'Claude plugin missing from installed package' }
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            $app = Start-Process -FilePath "$installDir\OrbisHost.exe" -ArgumentList '--smoke-test','--data-dir',('"' + $smokeDir + '"'),'--screenshot',('"' + $smokeDir + '\preview.png"') -WindowStyle Hidden -PassThru -Wait -RedirectStandardError "$smokeDir\qml.log"
            if ($app.ExitCode -ne 0) { throw "Installed application smoke test failed: $($app.ExitCode)" }
            if (@(Get-Content $env:ORBIS_CLAUDE_INSTALL_TEST_LOG).Count -ne 3) { throw 'Smoke test changed Claude integration' }
          } catch {
            $verificationFailure = $_
            if (Test-Path -LiteralPath $env:ORBIS_CLAUDE_INSTALL_TEST_LOG) { Get-Content -LiteralPath $env:ORBIS_CLAUDE_INSTALL_TEST_LOG | Write-Output }
            throw
          } finally {
            try {
              $env:Path = "$claudeFixture;$originalPath"
              if (Test-Path -LiteralPath "$installDir\unins000.exe") {
                $uninstaller = Start-Process -FilePath "$installDir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -PassThru -Wait
                if ($uninstaller.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstaller.ExitCode)" }
                $calls = @(Get-Content $env:ORBIS_CLAUDE_INSTALL_TEST_LOG | ForEach-Object { ,($_ | ConvertFrom-Json) })
                if ($calls.Count -ne 5 -or ($calls[3][0..1] -join ' ') -ne 'plugin uninstall' -or ($calls[4] -join ' ') -ne 'plugin marketplace remove orbis-host') { throw 'Uninstaller did not remove the Claude plugin' }
              }
            } catch {
              # Cleanup must not replace the original installation or smoke failure.
              if ($verificationFailure) { Write-Warning "Installer cleanup also failed: $_" } else { throw }
            } finally {
              $env:Path = $originalPath
              $env:CLAUDE_CONFIG_DIR = $originalClaudeConfig
              Remove-Item Env:ORBIS_CLAUDE_INSTALL_TEST_LOG -ErrorAction SilentlyContinue
            }
          }
      - name: Verify read-only license upgrade
        if: inputs.installer_checks
        shell: pwsh
        timeout-minutes: 8
        run: |
          $setup = Get-ChildItem .artifacts/host -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (!$setup) { throw 'Installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'OrbisHost-readonly-upgrade'
          $smokeDir = Join-Path $setup.DirectoryName 'installer-smoke'
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          $license = Join-Path $installDir 'runtime\packages\host\native\licenses\github.com_gorilla_websocket\LICENSE'
          # This step only checks the read-only license upgrade. Keep the runner's
          # own Claude Code out of setup's plugin registration so a CLI prompt or
          # network wait can never stall the silent install.
          $claudeFixture = Join-Path $smokeDir 'claude-fixture'
          New-Item -ItemType Directory -Path $claudeFixture -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $claudeFixture 'claude.cmd'),
            "@echo off`r`nif `"%~1`"==`"--version`" goto version`r`nexit /b 0`r`n:version`r`necho 2.1.287 (Claude Code)`r`nexit /b 0`r`n", [Text.Encoding]::ASCII)
          $originalPath = $env:Path
          $env:Path = "$claudeFixture;$originalPath"
          $env:ORBIS_CLAUDE_ENTRY = Join-Path $claudeFixture 'claude.cmd'
          # Inno's uninstaller hands off to a temporary copy and returns early. Wait
          # for the previous step's tree to disappear before reusing the same AppId.
          $previousInstall = Join-Path $env:RUNNER_TEMP 'OrbisHost-installed'
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path -LiteralPath $previousInstall) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          # A silent setup can also wait forever on a locked file. Bound each
          # invocation and surface the installer's own log when it does not return.
          function Invoke-Setup([string[]]$Arguments, [int]$TimeoutSeconds, [string]$LogPath) {
            $process = Start-Process -FilePath $setup.FullName -ArgumentList $Arguments -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit($TimeoutSeconds * 1000)) {
              try { $process.Kill($true) } catch { }
              if (Test-Path -LiteralPath $LogPath) { Get-Content -LiteralPath $LogPath -Tail 40 | Write-Output }
              throw "Installer timed out after $TimeoutSeconds s: $LogPath"
            }
            if ($process.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $LogPath) { Get-Content -LiteralPath $LogPath -Tail 40 | Write-Output }
              throw "Installer failed: $($process.ExitCode) ($LogPath)"
            }
          }
          try {
            $installArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $installDir + '"'))
            $firstLog = Join-Path $smokeDir 'readonly-first.log'
            Invoke-Setup -Arguments ($installArgs + @('/LOG="' + $firstLog + '"')) -TimeoutSeconds 180 -LogPath $firstLog
            $expected = (Get-FileHash -LiteralPath $license -Algorithm SHA256).Hash
            # HOST-UPDATE-04: reproduce a notice shipped with Go-cache read-only attributes.
            (Get-Item -LiteralPath $license).IsReadOnly = $true
            # This fixture has no running Host; native tests separately exercise verified cleanup.
            $upgradeLog = Join-Path $smokeDir 'readonly-upgrade.log'
            Invoke-Setup -Arguments ($installArgs + @('/ORBISHOSTCLOSED=1',('/LOG="' + $upgradeLog + '"'))) -TimeoutSeconds 240 -LogPath $upgradeLog
            if ((Get-FileHash -LiteralPath $license -Algorithm SHA256).Hash -ne $expected) { throw 'Upgrade changed the license contents' }
            if ((Get-Item -LiteralPath $license).IsReadOnly) { throw 'Upgrade retained the read-only license attribute' }
            (Get-Item -LiteralPath $license).IsReadOnly = $true
          } finally {
            if (Test-Path -LiteralPath "$installDir\unins000.exe") {
              $uninstaller = Start-Process -FilePath "$installDir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -PassThru
              if (!$uninstaller.WaitForExit(180000)) { try { $uninstaller.Kill($true) } catch { }; throw 'Read-only fixture uninstall timed out' }
              if ($uninstaller.ExitCode -ne 0) { throw "Read-only fixture uninstall failed: $($uninstaller.ExitCode)" }
              $deadline = (Get-Date).AddSeconds(120)
              while ((Test-Path -LiteralPath $installDir) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
              if (Test-Path -LiteralPath $license) { throw 'Uninstall left the read-only license behind' }
            }
            $env:Path = $originalPath
            Remove-Item Env:ORBIS_CLAUDE_ENTRY -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OrbisHost-windows-x64
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/host/**/*.zip
            .artifacts/host/**/*setup.exe
            .artifacts/host/**/*.sha256
            .artifacts/host/**/preview.png
            .artifacts/host/**/smoke-result.json
            .artifacts/host/**/qml.log
            .artifacts/host/**/installer-smoke/*.log
      - name: Preserve native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrbisHost-windows-native-tests
          include-hidden-files: true
          path: .artifacts/windows-native-test-diagnostics/*
