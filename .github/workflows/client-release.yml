name: Publish client release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release tag'
        required: true
        type: string
      windows_build_run_id:
        description: 'Successful main Windows Host build for the exact release tag commit'
        required: true
        type: string
      macos_build_run_id:
        description: 'Successful main macOS Host build for the exact release tag commit'
        required: true
        type: string
      android_build_run_id:
        description: 'Successful main Android build for the exact release tag commit'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: client-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      WINDOWS_BUILD_RUN: ${{ inputs.windows_build_run_id }}
      MACOS_BUILD_RUN: ${{ inputs.macos_build_run_id }}
      ANDROID_BUILD_RUN: ${{ inputs.android_build_run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release and build provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          if ($env:WINDOWS_BUILD_RUN -notmatch '^[0-9]+$') { throw 'Invalid build run ID' }
          if ($env:MACOS_BUILD_RUN -notmatch '^[0-9]+$') { throw 'Invalid macOS build run ID' }
          if ($env:ANDROID_BUILD_RUN -notmatch '^[0-9]+$') { throw 'Invalid Android build run ID' }
          $commit = git rev-list -n 1 "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0 -or !$commit) { throw 'Release tag not found' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:WINDOWS_BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Windows build run' }
          if ($run.conclusion -ne 'success' -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/windows-host-build.yml' -or $run.head_sha -ne $commit) {
            throw 'Windows build does not match the successful main build for this release tag'
          }
          $mac = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:MACOS_BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read macOS build run' }
          if ($mac.conclusion -ne 'success' -or $mac.head_branch -ne 'main' -or $mac.path -ne '.github/workflows/macos-host-build.yml' -or $mac.head_sha -ne $commit) {
            throw 'macOS build does not match the successful main build for this release tag'
          }
          $android = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ANDROID_BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Android build run' }
          if ($android.conclusion -ne 'success' -or $android.head_branch -ne 'main' -or $android.path -ne '.github/workflows/android-build.yml' -or $android.head_sha -ne $commit) {
            throw 'Android build does not match the successful main build for this release tag'
          }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Expected an existing draft release' }
          $cmake = (git show "${env:RELEASE_TAG}:packages/windows-host/CMakeLists.txt") -join "`n"
          if ($LASTEXITCODE -ne 0 -or $cmake -notmatch 'project\(OrbisHost VERSION ([0-9]+\.[0-9]+\.[0-9]+) ') { throw 'Host version not found in release source' }
          $version = $Matches[1]
          if ("v$version" -ne $env:RELEASE_TAG) { throw 'Host version and tag differ' }
          "HOST_VERSION=$version" >> $env:GITHUB_ENV
          Write-Output "Verified release source: $commit"
      - uses: actions/download-artifact@v4
        with:
          name: OrbisHost-windows-x64
          path: client-artifacts
          run-id: ${{ inputs.windows_build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          # 两个架构分别落到自己的目录：两边的 artifact 都带 smoke/qml.log，
          # 合到同一目录会撞名（merge-multiple 直接覆盖）。
          name: OrbisHost-macos-arm64
          path: client-artifacts-macos/arm64
          run-id: ${{ inputs.macos_build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: OrbisHost-macos-x64
          path: client-artifacts-macos/x64
          run-id: ${{ inputs.macos_build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Orbis-android
          path: android-release
          run-id: ${{ inputs.android_build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify clients and upload Host assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # APK 的签名证书已在 Android build 里按固定指纹核对过；这里核对它没被换掉。
          $apkHash = (Get-FileHash android-release/orbis.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content android-release/orbis.apk.sha256 -Raw).Trim() -ne "$apkHash  orbis.apk") { throw 'Android checksum mismatch' }
          Write-Output "Verified orbis.apk SHA-256: $apkHash"
          $names = @("OrbisHost-$env:HOST_VERSION-windows-x64-setup.exe", "OrbisHost-$env:HOST_VERSION-windows-x64.zip")
          $roots = @('client-artifacts')
          if ($env:MACOS_BUILD_RUN) {
            $names += @("OrbisHost-$env:HOST_VERSION-macos-arm64.dmg", "OrbisHost-$env:HOST_VERSION-macos-x64.dmg")
            $roots += 'client-artifacts-macos'
          }
          $uploads = @((Resolve-Path android-release/orbis.apk).Path, (Resolve-Path android-release/orbis.apk.sha256).Path)
          foreach ($name in $names) {
            $files = @(Get-ChildItem $roots -Recurse -File -Filter $name)
            if ($files.Count -ne 1) { throw "Expected one artifact: $name" }
            $file = $files[0]
            $checksum = $file.FullName + '.sha256'
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content -LiteralPath $checksum -Raw).Trim() -ne "$hash  $name") { throw "Checksum mismatch: $name" }
            $uploads += $file.FullName
            $uploads += $checksum
            Write-Output "Verified $name SHA-256: $hash"
          }
          gh release upload $env:RELEASE_TAG @uploads
          if ($LASTEXITCODE -ne 0) { throw 'Windows release asset upload failed; release remains a draft' }
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify uploaded assets' }
          foreach ($path in $uploads) {
            $name = Split-Path -Leaf $path
            $asset = @($release.assets | Where-Object name -eq $name)
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest -ne "sha256:$hash") { throw "Uploaded asset verification failed: $name" }
          }
      - name: Publish verified release
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
